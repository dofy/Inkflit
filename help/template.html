<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inkflit Help</title>
<!-- Generated by scripts/build-help.py from help/. Edit the sources, not Resources/Help.html. -->
<style>
  :root {
    --bg: #fffdfa; --bg2: #fbf4ec; --line: #eadccf; --fg: #302921; --muted: #7d6e63;
    --accent: #b95c1d; --code: #f5ece3;
    /* Derived from the accent so ?theme= recolors highlights and links too. */
    --accent-soft: color-mix(in srgb, var(--accent) 13%, white); --link: color-mix(in srgb, var(--accent) 88%, black);
    --mono: "SF Mono", ui-monospace, Menlo, "PingFang SC", monospace;
    --reading: -apple-system, BlinkMacSystemFont, "PingFang SC", "PingFang TC", "Hiragino Sans", sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #1d1a17; --bg2: #25211d; --line: #3a332c; --fg: #ece5dd; --muted: #a39587;
      --accent-soft: color-mix(in srgb, var(--accent) 22%, transparent); --code: #2c2722;
      --link: color-mix(in srgb, var(--accent) 60%, white);
    }
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: 20px; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.75 var(--reading); }
  a { color: var(--link); text-decoration: none; }
  a:hover { text-decoration: underline; }
  code { font-family: var(--mono); font-size: 13px; background: var(--code); padding: 1px 5px; border-radius: 4px; }
  kbd { display: inline-block; min-width: 24px; margin: 0 1px; padding: 0 6px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; background: var(--bg2); color: var(--fg); font: 600 13px/1.65 var(--reading); letter-spacing: .04em; text-align: center; white-space: nowrap; }
  pre { background: var(--code); padding: 12px 14px; border-radius: 8px; overflow-x: auto; font-size: 13px; line-height: 1.6; }
  pre code { background: none; padding: 0; }

  .layout { display: flex; min-height: 100vh; }
  nav { width: 240px; flex-shrink: 0; position: sticky; top: 0; height: 100vh; overflow-y: auto; padding: 22px 14px; background: var(--bg2); border-right: 1px solid var(--line); }
  .brand { display: flex; align-items: center; gap: 10px; margin: 0 4px 16px; }
  .brand b { display: block; font-size: 16px; }
  .brand span { font-size: 11px; color: var(--muted); }
  .mark { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 9px; background: var(--accent); color: #fff; flex: none; }
  .mark svg { width: 20px; height: 20px; }
  #q { width: 100%; padding: 6px 10px; margin-bottom: 14px; font: inherit; font-size: 13px; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 7px; }
  #q:focus { outline: 2px solid color-mix(in srgb, var(--accent) 45%, transparent); outline-offset: -1px; }
  nav ol { list-style: none; margin: 0; padding: 0; }
  nav li a { display: flex; align-items: center; gap: 9px; padding: 6px 9px; border-radius: 6px; color: var(--fg); font-size: 13.5px; }
  nav li a svg { width: 16px; height: 16px; flex: none; color: var(--muted); }
  nav li a:hover { background: var(--line); text-decoration: none; }
  nav li a.on { background: var(--accent-soft); color: var(--link); }
  nav li a.on svg { color: inherit; }
  .empty { display: none; color: var(--muted); padding: 12px 9px; font-size: 13px; }

  main { flex: 1; min-width: 0; max-width: 820px; padding: 36px 48px 80px; }
  header.hero { display: flex; gap: 18px; align-items: center; padding-bottom: 24px; border-bottom: 1px solid var(--line); }
  header.hero .mark { width: 64px; height: 64px; border-radius: 16px; box-shadow: 0 8px 20px color-mix(in srgb, var(--accent) 30%, transparent); }
  header.hero .mark svg { width: 36px; height: 36px; }
  header.hero h1 { margin: 0; font-size: 26px; letter-spacing: -0.01em; }
  header.hero p { margin: 4px 0 0; color: var(--muted); }
  section { padding-top: 28px; }
  section.hidden { display: none; }
  section > h2 { display: flex; align-items: center; gap: 9px; font-size: 20px; line-height: 1.4; margin: 12px 0 14px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
  section > h2 svg { width: 20px; height: 20px; flex: none; color: var(--accent); }
  h3 { font-size: 15.5px; margin: 26px 0 6px; }
  p, li { max-width: 68ch; }
  p { margin: 10px 0; }
  ul, ol { padding-left: 22px; }
  li + li { margin-top: 6px; }
  .lead { max-width: none; padding: 14px 16px; background: var(--bg2); border: 1px solid var(--line); border-radius: 9px; }
  .tip { max-width: none; padding: 10px 14px; border-left: 3px solid var(--accent); background: var(--accent-soft); border-radius: 0 8px 8px 0; }
  table { border-collapse: collapse; width: 100%; margin: 14px 0; font-size: 14px; }
  th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; }
  td:first-child { white-space: nowrap; width: 1%; }
  .group td { padding-top: 18px; color: var(--muted); font-size: 12.5px; font-weight: 600; letter-spacing: .03em; border-bottom: 0; }
  footer { margin-top: 44px; padding-top: 14px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }
  @media (max-width: 720px) { nav { display: none; } main { padding: 24px 18px 60px; } }
</style>
</head>
<body>
<div class="layout">
<nav>
  <div class="brand"><span class="mark" data-mark></span><div><b>Inkflit</b><span><span id="brand-label"></span> · %APP_VERSION%</span></div></div>
  <input id="q" type="search" autocomplete="off">
  <ol id="toc"></ol>
  <p class="empty" id="empty"></p>
</nav>
<main>
  <header class="hero">
    <span class="mark" data-mark></span>
    <div><h1 id="title"></h1><p id="tagline"></p></div>
  </header>
  <div id="content"></div>
  <footer>Inkflit %APP_VERSION% · © 2026 phpz.org · <a href="https://inkflit.phpz.org/">inkflit.phpz.org</a> · <a href="https://github.com/dofy/Inkflit">GitHub</a></footer>
</main>
</div>
%LANGUAGES%
<script>
  // The app opens Help.html?lang=<language>&theme=<accent id>.
  const params = new URLSearchParams(location.search);
  const accents = { orange: '#b95c1d', blue: '#2868a2', green: '#387452' };
  if (accents[params.get('theme')]) document.documentElement.style.setProperty('--accent', accents[params.get('theme')]);
  const languages = [...document.querySelectorAll('template[data-lang]')].map(t => t.dataset.lang);
  function pickLanguage() {
    const asked = params.get('lang');
    if (languages.includes(asked)) return asked;
    for (const tag of navigator.languages.map(value => value.toLowerCase())) {
      if (tag.startsWith('zh')) return /hant|tw|hk|mo/.test(tag) ? 'zh-Hant' : 'zh-Hans';
      if (tag.startsWith('ja')) return 'ja';
      if (tag.startsWith('en')) return 'en';
    }
    return 'en';
  }
  const lang = pickLanguage();
  const source = document.querySelector(`template[data-lang="${lang}"]`).content;
  const labels = JSON.parse(source.querySelector('script[type="application/json"]').textContent);
  document.documentElement.lang = lang;
  document.title = labels.title;
  document.getElementById('title').textContent = labels.title;
  document.getElementById('tagline').textContent = labels.tagline;
  document.getElementById('brand-label').textContent = labels.label;
  const q = document.getElementById('q');
  q.placeholder = labels.search;
  document.getElementById('empty').textContent = labels.empty;
  const content = document.getElementById('content');
  for (const section of source.querySelectorAll('section')) content.append(section.cloneNode(true));

  // Outline icons, 24px grid, bundled for offline use.
  const icons = {
    mark: '<path d="M7 3.5h10a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-13a2 2 0 0 1 2-2Z"/><path d="M8.5 9h7M8.5 12.5h7M8.5 16h4"/>',
    start: '<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"/>',
    notes: '<path d="M8 3h9a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H8"/><path d="M5 6h9a2 2 0 0 1 2 2v13H7a2 2 0 0 1-2-2Z"/>',
    palette: '<circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/>',
    writing: '<path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16Z"/><path d="m13.5 6.5 4 4"/>',
    blocks: '<rect x="3" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.5"/><path d="M17.25 14v6.5M14 17.25h6.5"/>',
    code: '<path d="m8 8-4 4 4 4M16 8l4 4-4 4M13.5 5l-3 14"/>',
    vim: '<path d="m4 5 4 14 4-14m1 14h7M13 5h7m-3.5 0v14"/>',
    settings: '<circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M4.6 4.6l2.1 2.1M17.3 17.3l2.1 2.1M2.5 12h3M18.5 12h3M4.6 19.4l2.1-2.1M17.3 6.7l2.1-2.1"/>',
    shortcuts: '<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M6 9h.01M10 9h.01M14 9h.01M18 9h.01M6 13h.01M10 13h.01M14 13h.01M18 13h.01M8 16h8"/>',
    data: '<ellipse cx="12" cy="5.5" rx="8" ry="3"/><path d="M4 5.5v6.5c0 1.7 3.6 3 8 3s8-1.3 8-3V5.5M4 12v6.5c0 1.7 3.6 3 8 3s8-1.3 8-3V12"/>',
    automation: '<path d="M13 2 4 14h7l-1 8 9-12h-7Z"/>',
    trouble: '<circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 0 1 5 0c0 2-2.5 2-2.5 4m0 3.5h.01"/>',
  };
  function icon(name) {
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    for (const [key, value] of Object.entries({ viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', 'stroke-width': '1.8', 'stroke-linecap': 'round', 'stroke-linejoin': 'round', 'aria-hidden': 'true' })) svg.setAttribute(key, value);
    svg.innerHTML = icons[name] || icons.start;
    return svg;
  }
  for (const mark of document.querySelectorAll('[data-mark]')) mark.append(icon('mark'));

  const sections = [...content.querySelectorAll('section')];
  const toc = document.getElementById('toc');
  for (const section of sections) {
    section.querySelector('h2').prepend(icon(section.id));
    const link = document.createElement('a');
    link.href = `#${section.id}`;
    link.append(icon(section.id), document.createTextNode(section.querySelector('h2').textContent));
    const item = document.createElement('li'); item.append(link); toc.append(item);
  }
  const links = [...toc.querySelectorAll('a')];
  function filter() {
    const term = q.value.trim().toLowerCase();
    let shown = 0;
    sections.forEach((section, index) => {
      const hit = !term || section.textContent.toLowerCase().includes(term);
      section.classList.toggle('hidden', !hit);
      links[index].parentElement.style.display = hit ? '' : 'none';
      shown += hit ? 1 : 0;
    });
    document.getElementById('empty').style.display = shown ? 'none' : 'block';
  }
  function mark() {
    let current = sections.find(section => !section.classList.contains('hidden')) || sections[0];
    for (const section of sections) if (!section.classList.contains('hidden') && section.getBoundingClientRect().top < 120) current = section;
    links.forEach(link => link.classList.toggle('on', link.getAttribute('href') === `#${current.id}`));
  }
  function jump() { const target = location.hash && document.getElementById(location.hash.slice(1)); if (target) target.scrollIntoView(); mark(); }
  q.addEventListener('input', () => { filter(); mark(); });
  addEventListener('scroll', mark, { passive: true });
  addEventListener('hashchange', jump);
  addEventListener('keydown', event => {
    if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === 'f') { event.preventDefault(); q.focus(); q.select(); }
    if (event.key === 'Escape' && document.activeElement === q) { q.value = ''; filter(); mark(); }
  });
  requestAnimationFrame(jump);
</script>
</body>
</html>
