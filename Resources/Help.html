<section id="writing">
  <h2>書寫</h2>
  <p>筆記就是一般的 Markdown。標題、清單、強調和連結會邊寫邊顯示樣式，原始檔用任何編輯器開啟都清楚易讀。</p>
  <ul>
    <li><b>核取方塊：</b><code>- [ ]</code> 和 <code>- [x]</code> 可以直接點擊勾選。</li>
    <li><b>註解：</b>以 <code>//</code> 開頭的行是註解。<kbd>⌘/</kbd> 為目前行或選取的行加上或取消註解。</li>
    <li><b>程式碼圍欄：</b><code>```js</code> 這樣的程式碼圍欄會依語言突顯。</li>
  </ul>
  <p>在長筆記裡移動游標時，游標上下始終保留三行可見。</p>
  <h3>片段</h3>
  <p>輸入 <code>@</code> 加一個詞，插入常用值。</p>
  <ul>
    <li><kbd>Return</kbd> 插入第一種格式，<kbd>↑</kbd> <kbd>↓</kbd> 選其他格式，<kbd>Esc</kbd> 關閉清單。</li>
    <li>一個詞有多種格式時全部列出：<code>@date</code> 列出所有日期格式。</li>
    <li>只打一部分，或依序打幾個字母也能找到：<code>@wk</code> 找到 <code>@week</code>。</li>
    <li>只輸入 <code>@</code>：每個詞顯示一行。</li>
    <li>預覽就是要插入的內容，時間類的值即時更新。</li>
  </ul>
  <table>
    <thead><tr><th>詞</th><th>格式</th></tr></thead>
    <tbody>
      <tr><td><code>@date</code></td><td>2026-11-18、2026/11/18、20261118、依介面語言顯示的長日期和完整日期</td></tr>
      <tr><td><code>@time</code></td><td>14:05、14:05:30（<code>@timesec</code>）、上午2:05</td></tr>
      <tr><td><code>@now</code></td><td>日期和時間（<code>@datetime</code>）、含秒（<code>@datetimesec</code>）、ISO 8601（<code>@iso</code>）、長格式</td></tr>
      <tr><td><code>@year @month @day</code></td><td>2026；2026-11、11、十一月；18、11月18日</td></tr>
      <tr><td><code>@week</code></td><td>2026-W47、W47、星期幾（<code>@weekday</code>）、星期幾簡寫</td></tr>
      <tr><td><code>@timestamp</code></td><td>Unix 秒（<code>@unix</code>）、毫秒（<code>@ms</code>）</td></tr>
      <tr><td><code>@uuid</code></td><td>隨機 UUID：小寫、大寫、無連字號</td></tr>
      <tr><td><code>@ip</code></td><td>公用位址、IPv4（<code>@ipv4</code>）、IPv6（<code>@ipv6</code>）、區域網路（<code>@localip</code>）</td></tr>
      <tr><td><code>@mac</code></td><td>網路卡 MAC 位址</td></tr>
      <tr><td><code>@host</code></td><td>主機名稱（<code>@hostname</code>）、電腦名稱（<code>@computer</code>）、目前使用者名稱（<code>@whoami</code>）</td></tr>
      <tr><td><code>@fn @unit @cur @const</code></td><td>只在計算區塊中：函式、單位、貨幣和常數，見<a href="#math">計算</a></td></tr>
    </tbody>
  </table>
  <ul>
    <li>括號裡的詞直接插入那一種格式，例如 <code>@timesec</code>。</li>
    <li>公用 IP 在清單顯示或插入時向 ipify 查詢，不傳送其他內容。</li>
    <li>在程式碼裡、或緊接在字母後面時不彈出，所以電子郵件地址不受影響。</li>
  </ul>
  <h4>自訂片段</h4>
  <p>在「設定 → 片段」或命令面板的「管理片段」中新增。儲存在筆記資料夾裡的 <code>snippets.json</code>，隨筆記一起搬移和備份。</p>
  <p>在「設定 → 片段 → 片段開關」中可以按分組或單項啟停內建片段。在那裡關閉「自訂片段」可隱藏全部自訂片段，也可以取消勾選表格中某一列的「啟用」。停用後會從補全和預留位置選單隱藏，範本裡已有的預留位置仍可展開。</p>
  <ul>
    <li><b>一個觸發詞可以有幾行：</b>和 macOS 的文字替代一樣。幾個地址都用 <code>addr</code>，<code>@addr</code> 會全部列出，預設插入第一行。</li>
    <li><b>和內建詞同名：</b>你的列排在前面，所以自己寫的 <code>date</code> 會成為預設格式。</li>
    <li><b>內容可以多行。</b></li>
  </ul>
  <h4>預留位置</h4>
  <table>
    <thead><tr><th>寫法</th><th>插入</th></tr></thead>
    <tbody>
      <tr><td><code>{date}</code></td><td>這個詞的預設格式</td></tr>
      <tr><td><code>{date#2}</code></td><td>這個詞的第 2 種格式</td></tr>
      <tr><td><code>{ipv4}</code></td><td>別名對應的那一種格式</td></tr>
      <tr><td><code>{cursor}</code></td><td>游標位置，見下文</td></tr>
      <tr><td><code>{cursor:姓名}</code></td><td>游標位置，插入後先選取「姓名」</td></tr>
      <tr><td><code>{{</code></td><td>一個 <code>{</code> 字元</td></tr>
    </tbody>
  </table>
  <p>「插入預留位置」選單列出全部預留位置和範例。</p>
  <h4>游標位置</h4>
  <pre><code>您好 {cursor:姓名}：
{cursor}
{date}</code></pre>
  <ol>
    <li>插入後「姓名」被選取，直接輸入就能取代。</li>
    <li>按 <kbd>Tab</kbd> 跳到空行。</li>
    <li>按 <kbd>⇧Tab</kbd> 回到「姓名」，填過的內容會再次被選取。</li>
  </ol>
  <ul>
    <li><b>標記：</b>正在填的位置是深色底紋加實線底線；其他位置是淺色底紋加點狀底線，空位置是一條直線。有沒有修改過都一樣，直到跳轉結束。</li>
    <li><b>Tab 只管跳轉：</b>跳轉期間 <kbd>Tab</kbd> 和 <kbd>⇧Tab</kbd> 只用來跳轉，清單中也一樣。</li>
    <li><b>結束跳轉：</b>到達最後一個位置、把游標移出這些位置、或按 <kbd>Esc</kbd>。之後 <kbd>Tab</kbd> 恢復縮排。</li>
    <li><b>這次 <kbd>Esc</kbd></b> 不收起視窗；Vim 模式下同時回到一般模式。</li>
    <li><b>最後一個位置不在結尾時</b>，再按一次 <kbd>Tab</kbd> 跳到片段結尾。</li>
  </ul>
  <h4>注意</h4>
  <ul>
    <li>多行片段從第二行起跟隨目前這行的縮排。</li>
    <li>在一個位置中再插入帶游標位置的片段，外層剩下的位置會失效。</li>
    <li>值要等一下才取得的片段（例如 IP）：如果期間游標移開了，插入時不會把游標拉回來。</li>
  </ul>
</section>

<section id="blocks">
  <h2>功能區塊</h2>
  <p>功能區塊把筆記的一部分變成小工具：清單、計算機、加總或一段程式碼。一則筆記裡可以放任意多個功能區塊。</p>
  <h3>插入與修改功能區塊</h3>
  <ol>
    <li>在空行輸入 <code>/</code>。（Vim 模式下請先進入插入模式。）</li>
    <li>用方向鍵和 <kbd>Return</kbd> 選擇，或直接點擊。</li>
    <li>在功能區塊的最後一行按 <kbd>Return</kbd> 會在區塊內新增一行。</li>
  </ol>
  <ul>
    <li>區塊的標題列或 <kbd>⌘K</kbd>：變更類型、轉回一般文字或刪除。</li>
    <li><kbd>⌘⇧D</kbd>：刪除目前區塊。</li>
    <li><kbd>⌘O</kbd> / <kbd>⌘⇧O</kbd>：在目前這行或區塊的下方 / 上方插入空行。</li>
  </ul>
  <p>這些操作都可以還原。</p>
  <h3>功能區塊類型</h3>
  <table>
    <thead><tr><th>功能區塊</th><th>作用</th></tr></thead>
    <tbody>
      <tr><td>清單</td><td>點擊核取方塊、在行尾輸入 <code>/x</code>，或在目前項目的任何位置按 <kbd>⌘↩</kbd>，都能切換完成狀態。<kbd>⌘↩</kbd> 也支援一般 Markdown 待辦項目。<kbd>Tab</kbd> 和 <kbd>⇧Tab</kbd> 縮排和取消縮排，子項目會跟著父項目一起移動。</td></tr>
      <tr><td>計算</td><td>在行尾輸入 <code>=</code> 得出結果，支援變數、函式、單位和貨幣，見<a href="#math">計算</a>。</td></tr>
      <tr><td>加總 / 平均值</td><td>對區塊裡的數字加總或求平均，不計算運算式。<br>只算獨立的數字：<code>1.2.3.4</code>、IP、日期 <code>2026-11-19</code>、時間 <code>14:05</code> 不算；行首的編號 <code>1.</code>、<code>1.2.</code> 也不算。</td></tr>
      <tr><td>計數</td><td>統計項目數、字數和字元數。</td></tr>
      <tr><td>程式碼</td><td>依語言突顯程式碼，見<a href="#code">程式碼</a>。</td></tr>
    </tbody>
  </table>
  <p>以 <code>//</code> 開頭的行不列入加總和計數。</p>
  <h3>整篇筆記</h3>
  <p>第一行只寫一個關鍵詞，整篇筆記就是這種類型，沒有結束標記。生效時關鍵詞會以強調色標出。</p>
  <table>
    <thead><tr><th>第一行</th><th>整篇筆記</th></tr></thead>
    <tbody>
      <tr><td><code>list</code></td><td>清單</td></tr>
      <tr><td><code>math</code></td><td>計算，見<a href="#math">計算</a></td></tr>
      <tr><td><code>sum</code> / <code>avg</code></td><td>加總 / 平均值</td></tr>
      <tr><td><code>count</code></td><td>計數</td></tr>
      <tr><td><code>code js</code></td><td>程式碼，<code>js</code> 是語言，可省略</td></tr>
    </tbody>
  </table>
  <ul>
    <li>關鍵詞後可以加冒號和標題：<code>sum: 本月開銷</code>、<code>code py: 備份腳本</code>。</li>
    <li>不區分大小寫。</li>
    <li>筆記中的其他功能區塊各算各的；整篇程式碼筆記中的一切都當作程式碼。</li>
  </ul>
</section>

<section id="math">
  <h2>計算</h2>
  <p class="lead">計算區塊是隨手可算的草稿紙：一行一個算式，行尾寫 <code>=</code>，結果就顯示在後面。可以定義變數、呼叫函式、換算單位和貨幣。</p>
  <h3>建立計算區塊</h3>
  <ul>
    <li><b>功能區塊：</b>在空行輸入 <code>/</code>，選擇「計算」。區塊以 <code>:::inkflit math</code> 開頭，以 <code>:::end</code> 結尾。</li>
    <li><b>整篇筆記：</b>第一行只寫 <code>math</code>，也可以加標題，例如 <code>math: 旅行預算</code>。
      <ul>
        <li>一直算到筆記結尾，沒有結束標記。</li>
        <li>筆記中的其他功能區塊和程式碼區塊不參與計算。</li>
        <li>只想算一部分：用功能區塊或 <code>```math</code>。</li>
      </ul>
    </li>
    <li><b>Markdown 程式碼區塊：</b>以 <code>```math</code> 開頭，<code>```</code> 結尾。</li>
  </ul>
  <pre><code>math: 旅行預算
機票: 12000
飯店: 2800 * 4
機票 + 飯店 =
ans / 2 =
// 兩個人平分</code></pre>
  <h3>每一行怎麼寫</h3>
  <table>
    <thead><tr><th>寫法</th><th>作用</th></tr></thead>
    <tbody>
      <tr><td><code>名稱: 算式</code></td><td>定義變數，不顯示結果。<br>名稱可以用中文等任何文字：<code>單價: 80</code>。<br>再定義一次會覆蓋舊值。</td></tr>
      <tr><td><code>算式 =</code></td><td>計算並在行尾顯示結果。結果不會寫進筆記，複製時也不會帶上。</td></tr>
      <tr><td><code>ans</code></td><td>上一個 <code>=</code> 行的結果。</td></tr>
      <tr><td><code>// …</code></td><td>註解，不參與計算。</td></tr>
      <tr><td>其他行</td><td>當作一般文字，原樣保留。</td></tr>
    </tbody>
  </table>
  <ul>
    <li>算式寫錯或沒寫完：不顯示結果，也不報錯；改正後自動出現。</li>
    <li>變數裡也能寫換算：<code>預算: 1000 USD to HKD</code>。之後 <code>預算 / 2 =</code> 得到數字，不帶貨幣代碼。</li>
  </ul>
  <h3>數字和運算子</h3>
  <table>
    <thead><tr><th>寫法</th><th>意思</th></tr></thead>
    <tbody>
      <tr><td><code>+ - * /</code></td><td>加、減、乘、除。也可以寫 <code>×</code> 和 <code>÷</code>。</td></tr>
      <tr><td><code>^</code></td><td>次方，例如 <code>2^10</code> 是 1,024。指數必須是數字，絕對值不超過 100。</td></tr>
      <tr><td><code>( )</code></td><td>括號。數字緊貼括號表示相乘：<code>2(3+4)</code> 是 14。</td></tr>
      <tr><td><code>%</code></td><td>百分比：<code>200 - 10%</code> 是 180，<code>price + 25%</code> 是 <code>price</code> 加上它的 25%。<code>%</code> 不是取餘數。</td></tr>
      <tr><td><code>of</code></td><td>相乘，用於百分比：<code>50% of 200</code> 是 100。</td></tr>
      <tr><td><code>to</code> / <code>in</code></td><td>換算單位或貨幣，見下文。</td></tr>
      <tr><td><code>pi e tau phi</code></td><td>常數 π、e、τ、φ。</td></tr>
    </tbody>
  </table>
  <ul>
    <li><b>數字：</b>整數、小數或科學記號（<code>1.5e3</code>），不能寫千分位逗號。</li>
    <li><b>結果：</b>最多 10 位有效數字，以 <code>1,234.5</code> 的格式顯示。</li>
  </ul>
  <h3>函式</h3>
  <table>
    <thead><tr><th>函式</th><th>作用</th><th>範例</th></tr></thead>
    <tbody>
      <tr><td><code>sqrt(x)</code></td><td>平方根</td><td><code>sqrt(16) = 4</code></td></tr>
      <tr><td><code>abs(x)</code></td><td>絕對值</td><td><code>abs(-3) = 3</code></td></tr>
      <tr><td><code>round(x)<br><code>round(x, n)</code></code></td><td>四捨五入；<code>n</code> 是保留的小數位數</td><td><code>round(2.567, 2) = 2.57</code></td></tr>
      <tr><td><code>floor(x)</code></td><td>無條件捨去</td><td><code>floor(2.7) = 2</code></td></tr>
      <tr><td><code>ceil(x)</code></td><td>無條件進位</td><td><code>ceil(2.1) = 3</code></td></tr>
      <tr><td><code>sin(x)</code></td><td>正弦。預設為弧度，加 <code>deg</code> 改用角度</td><td><code>sin(30 deg) = 0.5</code></td></tr>
      <tr><td><code>cos(x)</code></td><td>餘弦</td><td><code>cos(0) = 1</code></td></tr>
      <tr><td><code>tan(x)</code></td><td>正切</td><td><code>tan(45 deg) = 1</code></td></tr>
      <tr><td><code>log(x)<br><code>log(x, b)</code></code></td><td>自然對數；<code>b</code> 指定底數</td><td><code>log(100, 10) = 2</code></td></tr>
      <tr><td><code>log10(x)</code></td><td>常用對數</td><td><code>log10(1000) = 3</code></td></tr>
      <tr><td><code>exp(x)</code></td><td>e 的冪</td><td><code>exp(1) = 2.718281828</code></td></tr>
      <tr><td><code>min(a, b, …)</code></td><td>最小值</td><td><code>min(3, 1, 2) = 1</code></td></tr>
      <tr><td><code>max(a, b, …)</code></td><td>最大值</td><td><code>max(3, 1, 2) = 3</code></td></tr>
    </tbody>
  </table>
  <h3>單位</h3>
  <p>數字後面接單位，用 <code>to</code> 換算。</p>
  <table>
    <thead><tr><th>算式</th><th>結果</th><th>說明</th></tr></thead>
    <tbody>
      <tr><td><code>10 km to mi =</code></td><td><code>6.213711922 mi</code></td><td>用 <code>to</code> 換算</td></tr>
      <tr><td><code>2 h + 15 min =</code></td><td><code>2.25 h</code></td><td>不寫 <code>to</code>：用第一個單位</td></tr>
      <tr><td><code>2 m * 3 m =</code></td><td><code>6 m^2</code></td><td>單位相乘</td></tr>
      <tr><td><code>50 km / 2 h to km/h =</code></td><td><code>25 km / h</code></td><td>單位相除，再換算</td></tr>
      <tr><td><code>0 degC to degF =</code></td><td><code>32 degF</code></td><td>溫度</td></tr>
    </tbody>
  </table>
  <table>
    <thead><tr><th>類別</th><th>常用單位</th></tr></thead>
    <tbody>
      <tr><td>長度</td><td><code>m</code> <code>km</code> <code>cm</code> <code>mm</code> <code>um</code> <code>nm</code> <code>in</code> <code>ft</code> <code>yd</code> <code>mi</code> <code>nmi</code> <code>mil</code> <code>angstrom</code></td></tr>
      <tr><td>面積</td><td><code>m2</code> <code>km2</code> <code>cm2</code> <code>sqin</code> <code>sqft</code> <code>sqyd</code> <code>sqmi</code> <code>acre</code> <code>hectare</code></td></tr>
      <tr><td>體積</td><td><code>L</code> <code>mL</code> <code>m3</code> <code>cc</code> <code>cuin</code> <code>cuft</code> <code>teaspoon</code> <code>tablespoon</code> <code>cup</code> <code>floz</code> <code>pint</code> <code>quart</code> <code>gallon</code> <code>oilbarrel</code></td></tr>
      <tr><td>質量</td><td><code>mg</code> <code>g</code> <code>kg</code> <code>t</code> <code>ton</code> <code>oz</code> <code>lb</code> <code>stone</code> <code>grain</code></td></tr>
      <tr><td><a href="#time-units">時間</a></td><td><code>ms</code> <code>s</code> <code>min</code> <code>h</code> <code>day</code> <code>week</code> <code>month</code> <code>year</code></td></tr>
      <tr><td>速度</td><td><code>m/s</code> <code>km/h</code> <code>mph</code></td></tr>
      <tr><td>溫度</td><td><code>degC</code> <code>degF</code> <code>K</code></td></tr>
      <tr><td><a href="#angle-units">角度</a></td><td><code>deg</code> <code>rad</code> <code>grad</code> <code>arcmin</code> <code>arcsec</code></td></tr>
      <tr><td>力</td><td><code>N</code> <code>kN</code> <code>kgf</code> <code>lbf</code></td></tr>
      <tr><td>能量</td><td><code>J</code> <code>kJ</code> <code>Wh</code> <code>kWh</code> <code>BTU</code> <code>eV</code></td></tr>
      <tr><td>功率</td><td><code>W</code> <code>kW</code> <code>hp</code></td></tr>
      <tr><td>壓力</td><td><code>Pa</code> <code>kPa</code> <code>MPa</code> <code>bar</code> <code>atm</code> <code>psi</code> <code>mmHg</code></td></tr>
      <tr><td>電磁</td><td><code>A</code> <code>mA</code> <code>V</code> <code>kV</code> <code>ohm</code> <code>C</code> <code>Ah</code> <code>mAh</code> <code>F</code> <code>H</code> <code>S</code> <code>Wb</code> <code>T</code></td></tr>
      <tr><td>資料</td><td><code>b</code> <code>B</code> <code>kB</code> <code>MB</code> <code>GB</code> <code>TB</code> <code>KiB</code> <code>MiB</code> <code>GiB</code> <code>TiB</code></td></tr>
      <tr><td>頻率</td><td><code>Hz</code> <code>kHz</code> <code>MHz</code> <code>GHz</code></td></tr>
      <tr><td>其他</td><td><code>mol</code> <code>cd</code></td></tr>
    </tbody>
  </table>
  <ul>
    <li>公制單位可以加字首 <code>k</code> <code>M</code> <code>G</code> <code>m</code> <code>u</code> 等：<code>mg</code>、<code>kN</code>、<code>GHz</code>。</li>
    <li>表外的 mathjs 內建單位也能用，全名和複數也行：<code>meters</code>、<code>inches</code>。</li>
    <li>單位區分大小寫：<code>t</code> 是公噸，<code>T</code> 是特斯拉；<code>b</code> 是位元，<code>B</code> 是位元組。<code>MB</code> 是 1000² 位元組，<code>MiB</code> 是 1024² 位元組。</li>
    <li><code>min</code> 單獨寫是分鐘，寫成 <code>min(…)</code> 是函式。<code>in</code> 接在數字後面是英寸（<code>5 in to cm</code>），其他位置是換算（<code>10 km in mi</code>）。</li>
    <li>變數和單位同名時，以變數為準。</li>
  </ul>
  <h4 id="time-units">時間單位</h4>
  <table>
    <thead><tr><th>全名（符號）</th><th>公式寫法</th><th>換算</th></tr></thead>
    <tbody>
      <tr><td>毫秒（ms）</td><td><code>ms</code> / <code>millisecond</code></td><td>1 毫秒 = 0.001 秒</td></tr>
      <tr><td>秒（s）</td><td><code>s</code> / <code>second</code></td><td>1 秒 = 1000 毫秒</td></tr>
      <tr><td>分鐘（min）</td><td><code>min</code> / <code>minute</code></td><td>1 分鐘 = 60 秒</td></tr>
      <tr><td>小時（h）</td><td><code>h</code> / <code>hour</code></td><td>1 小時 = 60 分鐘</td></tr>
      <tr><td>天（d）</td><td><code>day</code></td><td>1 天 = 24 小時</td></tr>
      <tr><td>週</td><td><code>week</code></td><td>1 週 = 7 天</td></tr>
      <tr><td>月</td><td><code>month</code></td><td>1 個月 = 30.4375 天</td></tr>
      <tr><td>年</td><td><code>year</code></td><td>1 年 = 365.25 天 = 12 個月</td></tr>
    </tbody>
  </table>
  <p>Inkflit 在單位換算中把月和年視為固定時長。兩個日期之間的實際天數要按日曆計算。</p>
  <p>公式裡可以直接寫全名 <code>minute</code> 和 <code>second</code>。<code>1 minute to s =</code> 得到 <code>60 s</code>，<code>1 second to ms =</code> 得到 <code>1000 ms</code>。在片段選單中輸入 <code>@sec</code>，選取 <code>@second</code> 就會插入 <code>s</code>。在公式裡，秒要寫 <code>s</code> 或 <code>second</code>，Inkflit 不會辨識 <code>sec</code> 這個時間單位。</p>
  <h4 id="angle-units">角度單位</h4>
  <table>
    <thead><tr><th>全名（符號）</th><th>公式寫法</th><th>換算</th></tr></thead>
    <tbody>
      <tr><td>度（°）</td><td><code>deg</code> / <code>degree</code></td><td>1° = π/180 rad</td></tr>
      <tr><td>弧度（rad）</td><td><code>rad</code> / <code>radian</code></td><td>π rad = 180°</td></tr>
      <tr><td>百分度（gon）</td><td><code>grad</code> / <code>gradian</code></td><td>100 grad = 90°</td></tr>
      <tr><td>角分（′）</td><td><code>arcmin</code> / <code>arcminute</code></td><td>60 arcmin = 1°</td></tr>
      <tr><td>角秒（″）</td><td><code>arcsec</code> / <code>arcsecond</code></td><td>60 arcsec = 1 arcmin = 1/60°</td></tr>
    </tbody>
  </table>
  <p>一整圈是 360°，也就是 2π rad。公式裡用 <code>pi</code> 表示 π，例如 <code>pi rad to deg =</code> 得到 <code>180 deg</code>。三角函式省略單位時按弧度計算。要算 30° 的正弦，寫 <code>sin(30 deg) =</code>，結果是 <code>0.5</code>。</p>
  <h3>貨幣</h3>
  <ul>
    <li><b>寫法：</b><code>10 USD to HKD =</code>。<code>to</code> 也可以寫成 <code>in</code>。</li>
    <li><b>代碼：</b>三個大寫字母。小寫的 <code>usd</code> 不算貨幣。</li>
    <li><b>一行一筆：</b><code>10 USD + 5 EUR</code>、<code>price USD to HKD</code> 都不行。</li>
  </ul>
  <h4>匯率</h4>
  <ul>
    <li><b>來源：</b>Frankfurter 提供的歐洲央行參考匯率，工作日每天更新一次。</li>
    <li><b>日期：</b>結果後面附上匯率日期，例如 <code>78.30 HKD · 2026-11-18</code>。</li>
    <li><b>下載：</b>開啟計算區塊時下載，最多每小時一次；失敗後約 100 秒重試。</li>
    <li><b>提示：</b>還沒取得匯率時顯示「匯率載入中或無法使用」；代碼不在下表中時顯示「不支援的幣別」。</li>
  </ul>
  <p>目前支援以下 30 種貨幣，以 Frankfurter 實際提供為準。不包括新臺幣 TWD：</p>

    <thead><tr><th>代碼</th><th>貨幣</th><th>代碼</th><th>貨幣</th></tr></thead>

      <tr><td><code>GBP</code></td><td>英鎊</td><td><code>HKD</code></td><td>港幣</td></tr>
      <tr><td><code>HUF</code></td><td>匈牙利福林</td><td><code>IDR</code></td><td>印尼盾</td></tr>
      <tr><td><code>ILS</code></td><td>以色列新謝克爾</td><td><code>INR</code></td><td>印度盧比</td></tr>
      <tr><td><code>ISK</code></td><td>冰島克朗</td><td><code>JPY</code></td><td>日圓</td></tr>

  <p class="tip">Inkflit 只下載公開匯率，不會上傳你的筆記。取不到匯率時會直接提示，不會給出猜測的結果。</p>
  <h3>用 @ 插入函式、單位、貨幣和常數</h3>
  <p>在計算區塊中輸入 <code>@</code>，還可以找到四組片段。</p>
  <table>
    <thead><tr><th>詞</th><th>內容</th></tr></thead>
    <tbody>
      <tr><td><code>@fn</code></td><td>全部函式，旁邊附說明。插入 <code>sqrt()</code> 後游標停在括號內，寫完參數按 <kbd>Tab</kbd> 跳到括號後面。</td></tr>
      <tr><td><code>@unit</code></td><td>上表中的單位，旁邊附類別。</td></tr>
      <tr><td><code>@cur</code></td><td>全部貨幣，顯示名稱和對本地貨幣的匯率：簡體中文對 CNY，繁體中文對 HKD，日文對 JPY，英文對 USD。</td></tr>
      <tr><td><code>@const</code></td><td>數學常數和常用科學常數。</td></tr>
    </tbody>
  </table>
  <ul>
    <li>名稱可以單獨使用：<code>@sqrt</code>、<code>@km</code>、<code>@kilometer</code>、<code>@usd</code> 直接找到那一項。</li>
    <li>數字後面可以緊接 <code>@</code>：<code>10@km</code>。</li>
    <li>在計算區塊中，<code>@min</code> 同時顯示最小值函式和分鐘單位 <code>@minute</code>，選取分鐘會插入 <code>min</code>。<code>@ms</code> 同時顯示時間戳和毫秒單位 <code>@millisecond</code>。</li>
  </ul>
  <h3>醒目標示</h3>
  <p>計算區塊依「設定 → 外觀」中的程式碼配色為算式上色，淺色和深色外觀各有一套：</p>
  <table>
    <thead><tr><th>元素</th><th>範例</th></tr></thead>
    <tbody>
      <tr><td>數字和常數</td><td><code>80</code> <code>1.5e3</code> <code>pi</code></td></tr>
      <tr><td>函式</td><td><code>sqrt</code> <code>round</code></td></tr>
      <tr><td>單位</td><td><code>km</code> <code>min</code> <code>degC</code></td></tr>
      <tr><td>貨幣代碼（與單位同色）</td><td><code>USD</code> <code>HKD</code></td></tr>
      <tr><td>運算子和換算詞</td><td><code>+</code> <code>×</code> <code>%</code> <code>to</code> <code>of</code></td></tr>
      <tr><td>括號、逗號、冒號</td><td><code>(</code> <code>,</code> <code>:</code></td></tr>
      <tr><td>行尾的等號（使用運算子顏色）</td><td><code>=</code></td></tr>
      <tr><td>變數定義和參照</td><td><code>price</code> <code>ans</code></td></tr>
      <tr><td>註解</td><td><code>// …</code></td></tr>
    </tbody>
  </table>
  <h3>限制</h3>
  <ul>
    <li>一個算式最長 256 個字元。</li>
    <li>不支援取餘數、矩陣、字串、比較、自訂函式，也不能在算式中用 <code>=</code> 指定值。</li>
  </ul>
</section>

<section id="code">
  <h2>程式碼</h2>
  <ul>
    <li><b>整篇程式碼筆記：</b>第一行寫 <code>code js</code>，整篇依這種語言突顯和編輯。<kbd>⌘L</kbd> 改的是第一行的語言。</li>
    <li><kbd>⌘L</kbd> 選擇目前程式碼區塊的語言。</li>
    <li>括號和引號會自動補上。<kbd>Return</kbd> 保持縮排，<kbd>Tab</kbd> 縮排，<kbd>⇧Tab</kbd> 取消縮排。</li>
    <li>沒有選取內容時，<kbd>⌘C</kbd> 複製整個程式碼區塊。</li>
  </ul>
  <p>在「設定 → 編輯 → 程式碼縮排」可選 2 個空格、4 個空格或 Tab。在「設定 → 外觀 → 程式碼配色」選擇並預覽配色。</p>
  <p>開啟「設定 → 編輯 → 顯示程式碼行號」後，每個程式碼區塊從 1 開始編號。再開啟「相對行號」，游標所在的程式碼區塊會顯示各行與目前行的距離，目前行和其他程式碼區塊仍顯示絕對行號。</p>
</section>

<section id="vim">
  <h2>Vim 模式</h2>
  <p>Vim 按鍵預設開啟。編輯器先處於一般模式，按 <kbd>i</kbd> 開始輸入，再按 <kbd>Esc</kbd> 返回。圖釘關閉時，在一般模式下預設連按兩次 <kbd>Esc</kbd> 會收起視窗。可在「設定 → 編輯」關閉「連按兩次 Esc 收起視窗」，改用單次按鍵。</p>
  <ul>
    <li>一般模式下，Inkflit 會暫時切換到英文（ASCII）輸入法，讓命令鍵直接生效；開始輸入或離開視窗時恢復你原本的輸入法。</li>
    <li>如果輸入法候選視窗還開著，按 <kbd>Esc</kbd> 會先取消候選，再離開插入模式。</li>
    <li>每則筆記的復原記錄會保留到結束應用程式為止。</li>
  </ul>
  <p>這是編輯器裡的 Vim 模擬，不是 Neovim，不會讀取 vimrc。</p>
  <p>在「設定 → 編輯 → Vim 模式」或命令面板裡可以關閉。關閉後直接輸入。圖釘關閉時，<kbd>Esc</kbd> 收起視窗。<kbd>⌘Z</kbd> / <kbd>⌘⇧Z</kbd> 復原和重做。</p>
</section>

<section id="settings">
  <h2>設定</h2>
  <p>按 <kbd>⌘,</kbd> 或透過選單列圖示開啟設定。大部分選項在命令面板裡也能修改。</p>
  <table>
    <thead><tr><th>分頁</th><th>選項</th></tr></thead>
    <tbody>
      <tr><td>一般</td><td>登入時啟動、語言、全域快捷鍵</td></tr>
      <tr><td>外觀</td><td>顯示模式、介面主色、編輯器字型與大小、背景材質、紋理強度、重設視窗大小、視窗不透明度、背景模糊、程式碼配色。拖曳滑桿時按住 <kbd>⌥</kbd>，每次調整 5%。</td></tr>
      <tr><td>編輯</td><td>Vim 模式、連按兩次 Esc 收起視窗、程式碼縮排、顯示程式碼行號、相對行號</td></tr>
      <tr><td>片段</td><td>自訂片段和<a href="#writing">片段開關</a></td></tr>
      <tr><td>資料</td><td>筆記儲存位置、自動備份、歷史版本、回收站、索引還原</td></tr>
      <tr><td>關於</td><td>目前版本、重新產生引導筆記、開啟使用說明</td></tr>
    </tbody>
  </table>
  <p>在<b>外觀</b>中選擇跟隨系統（預設）、淺色或深色。<b>介面主色</b>中的可樂紅藍、聖誕松綠、朱漆紅、午夜黑金和孔雀藍金會一起調整工具列、正文和選單的配色，每套都隨顯示模式切換。</p>
  <h3>背景材質</h3>
  <p>在「設定 → 外觀 → 背景材質」選擇空白、宣紙、羊毛氈、細砂石或粗亞麻。「紋理強度」預設為 50%，調到 0% 就是純色背景。「視窗不透明度」可另外調整桌面透出的程度。 選擇「空白」時，紋理強度滑桿會停用，並保留原來的數值。</p>
  <p>在命令面板輸入 <code>background material</code>，也可以直接搜尋「粗亞麻」等材質名稱。選用材質後，開啟「紋理強度」，輸入 <code>37%</code> 等數值即可。</p>
</section>

<section id="shortcuts">
  <h2>快捷鍵</h2>
  <p>全域快捷鍵在任何應用程式裡都能使用，可以在設定中變更。其他快捷鍵在筆記視窗作用中時可用。</p>
  <table><thead><tr><th>按鍵</th><th>操作</th></tr></thead><tbody><tr class="group"><td colspan="2">視窗</td></tr><tr><td><kbd>⌃⌥Space</kbd></td><td>在任何應用程式中顯示或隱藏 Inkflit（預設快捷鍵，可在設定中變更）</td></tr><tr><td><kbd>Esc</kbd></td><td>收起未固定的視窗（Vim 一般模式下預設連按兩次）</td></tr><tr><td><kbd>⌘W</kbd></td><td>收起筆記視窗，固定時也可用</td></tr><tr><td><kbd>⌘⇧T</kbd></td><td>循環切換一般、保持開啟和置頂</td></tr><tr><td><kbd>⌘,</kbd></td><td>開啟設定</td></tr><tr class="group"><td colspan="2">筆記</td></tr><tr><td><kbd>⌘N</kbd></td><td>在最後新增筆記</td></tr><tr><td><kbd>⌘[</kbd> / <kbd>⌘]</kbd></td><td>上一則 / 下一則筆記</td></tr><tr><td><kbd>⌘⇧[</kbd> / <kbd>⌘⇧]</kbd></td><td>第一則 / 最後一則筆記</td></tr><tr><td><kbd>⌘1</kbd>–<kbd>⌘9</kbd></td><td>跳到第 1–9 則筆記</td></tr><tr><td><kbd>⌘D</kbd></td><td>刪除目前筆記</td></tr><tr><td><kbd>⌘U</kbd></td><td>還原剛刪除的筆記（12 秒內）</td></tr><tr class="group"><td colspan="2">搜尋與命令</td></tr><tr><td><kbd>⌘⇧F</kbd></td><td>搜尋筆記</td></tr><tr><td><kbd>⌘⇧P</kbd></td><td>命令面板</td></tr><tr class="group"><td colspan="2">編輯</td></tr><tr><td><kbd>⌘+</kbd> / <kbd>⌘-</kbd></td><td>放大 / 縮小編輯器字型（⌘= 也可放大）</td></tr><tr><td><kbd>⌘↩</kbd></td><td>切換目前清單項目或 Markdown 待辦的完成狀態</td></tr><tr><td><kbd>⌘/</kbd></td><td>註解或取消註解</td></tr><tr><td><kbd>⌘O</kbd> / <kbd>⌘⇧O</kbd></td><td>在目前行或區塊下方 / 上方插入空行</td></tr><tr><td><kbd>⌘K</kbd></td><td>變更目前區塊類型</td></tr><tr><td><kbd>⌘⇧D</kbd></td><td>刪除目前區塊</td></tr><tr><td><kbd>⌘L</kbd></td><td>選擇程式碼區塊語言</td></tr><tr><td><kbd>⌘C</kbd></td><td>未選取內容時複製整個程式碼區塊</td></tr><tr><td><kbd>==</kbd></td><td>在 Vim 一般模式下自動縮排。程式碼依語言規則和縮排設定調整，清單依層級調整。</td></tr><tr><td><kbd>&gt;&gt;</kbd> / <kbd>&lt;&lt;</kbd></td><td>在 Vim 一般模式下增加或減少縮排。清單子項會跟隨父項移動。</td></tr><tr><td><kbd>⌘Z</kbd> / <kbd>⌘⇧Z</kbd></td><td>復原 / 重做（關閉 Vim 時）</td></tr></tbody></table>
</section>

<section id="data">
  <h2>資料</h2>
  <p>所有內容都只儲存在你的 Mac 上。每則筆記是一個 UTF-8 編碼的 Markdown 檔案：</p>
  <pre><code>~/Documents/Inkflit/
  notes/       每則筆記一個 .md 檔案
  index.json   筆記順序和目前選取的筆記
  backups/     歷史版本
  trash/       已刪除的筆記</code></pre>
  <h3>儲存</h3>
  <ul>
    <li>停止輸入半秒後儲存；連續輸入時至少每兩秒儲存一次。</li>
    <li>切換筆記、收起視窗、結束應用程式時立即儲存。</li>
    <li>儲存失敗時底列會提示；儲存成功之前無法結束應用程式。</li>
  </ul>
  <h3>備份與還原</h3>
  <ul>
    <li>編輯時，每則筆記最多每五分鐘保留一個舊版本。在「設定 → 資料 → 自動備份」選擇保留數量。</li>
    <li>「還原歷史版本…」和「還原已刪除筆記…」都會新增一則筆記，原檔案保留不動。</li>
    <li>如果 <code>index.json</code> 損壞，「重建索引…」會依筆記檔案重新產生索引，舊索引會保留。</li>
  </ul>
  <p>變更儲存位置時，會把整個儲存目錄複製過去，原目錄保留不動。</p>
  <p class="tip">Inkflit 沒有雲端同步。請把筆記資料夾納入你自己的備份，或選擇一個同步服務已經涵蓋的資料夾。</p>
</section>

<section id="automation">
  <h2>自動化</h2>
  <p>其他應用程式和 AI 助理可以透過本機 MCP 服務或 <code>inkflit://</code> 連結讀寫筆記。兩種方式都經過正在執行的 Inkflit，儲存和備份照常進行。</p>
  <h3>MCP</h3>
  <p>把 Inkflit 加入你的 MCP 用戶端，然後重新啟動用戶端：</p>
  <pre><code># Codex
codex mcp add inkflit -- /Applications/Inkflit.app/Contents/MacOS/Inkflit --mcp

# Claude Code
claude mcp add --transport stdio --scope user inkflit -- /Applications/Inkflit.app/Contents/MacOS/Inkflit --mcp

# 其他用戶端
{"mcpServers":{"inkflit":{"command":"/Applications/Inkflit.app/Contents/MacOS/Inkflit","args":["--mcp"]}}}</code></pre>
  <p>工具：<code>list_notes</code>、<code>search_notes</code>、<code>get_note</code>、<code>get_current_note</code>、<code>analyze_note</code>、<code>preview_note_format</code>、<code>apply_note_format</code>、<code>create_note</code>、<code>append_note</code>、<code>replace_note</code>、<code>delete_note</code>。</p>
  <p><code>list_notes</code> 可帶入 <code>limit</code>、<code>cursor</code> 和 <code>include_content: false</code> 分頁取得摘要。<code>get_current_note</code> 讀取目前筆記，<code>analyze_note</code> 依 <code>id</code> 或 <code>index</code> 傳回計算與清單結果。</p>
  <p>用筆記 <code>id</code> 呼叫 <code>preview_note_format</code> 檢視差異，再把同一個 <code>id</code> 和傳回的 <code>preview_id</code> 傳給 <code>apply_note_format</code>。正文變更後需要重新預覽。</p>
  <ul>
    <li>用 <code>index</code>（Inkflit 裡顯示的序號）或穩定的 <code>id</code> 指定筆記。增刪筆記後序號會變動。</li>
    <li>新筆記預設加在最後。<code>position</code> 可以設為 <code>"first"</code>、<code>"last"</code> 或一個數字，放到其他位置。</li>
    <li>刪除的筆記進入回收站。</li>
  </ul>
  <h3>連結</h3>
  <pre><code>open 'inkflit://note/append?index=2&amp;content=Remember%20milk'
open 'inkflit://note/search?query=milk'
open 'inkflit://note/get?index=1'</code></pre>
  <p>可用的操作有 <code>list</code>、<code>get</code>、<code>search</code>、<code>create</code>、<code>append</code>、<code>replace</code> 和 <code>delete</code>。加上 <code>x-success</code> 和 <code>x-error</code> 回呼網址，可以收到 JSON 格式的結果。</p>
  <p>用 <code>inkflit://note/open?index=2</code> 開啟指定筆記，用 <code>inkflit://settings/appearance</code> 或 <code>inkflit://settings/snippets</code> 直達對應設定。</p>
  <p class="tip">寫入和刪除類的連結會立即執行，只開啟你信任的連結。</p>
</section>

<section id="trouble">
  <h2>疑難排解</h2>
  <h3>按快捷鍵沒有反應</h3>
  <p>可能有其他應用程式佔用了這個快捷鍵。這時選單列裡會顯示「設定…（快捷鍵無法使用）」，請在「設定 → 一般」中換一個快捷鍵。</p>
  <h3>登入時啟動無法開啟</h3>
  <p>macOS 可能需要你授權。請在「系統設定 → 一般 → 登入項目」中允許 Inkflit。</p>
  <h3>筆記在 Inkflit 之外被修改</h3>
  <p>如果 Inkflit 執行時筆記檔案被其他應用程式改過，Inkflit 會拒絕覆寫這些檔案。請先把目前內容複製到安全的地方，然後重新啟動 Inkflit。</p>
</section>

<section id="start">
  <h2>はじめに</h2>
  <p class="lead">Inkflit はメニューバーに常駐します。ショートカットひとつで呼び出し、書き終えたらすぐにしまえます。入力内容は自動で保存されます。</p>
  <ol>
    <li><b>ウインドウを表示：</b>グローバルショートカット（初期設定は <kbd>⌃⌥Space</kbd>。「設定 → 一般」で変更できます）を押すか、メニューバーのアイコンから「Inkflit を開く」を選びます。</li>
    <li><b>書く：</b>変更は自動で保存されます。保存ボタンはありません。</li>
    <li><b>隠す：</b>固定していないウインドウを隠すには、同じショートカットか <kbd>Esc</kbd> を押します。Vim のノーマルモードでは、既定で <kbd>Esc</kbd> を 2 回押します。ほかのアプリに切り替えたときも自動で隠れます。</li>
  </ol>
  <p>ツールバーのピン、<kbd>⌘⇧T</kbd>、またはコマンドパレットで「通常」「開いたまま」「常に最前面」を切り替えます。固定すると <kbd>Esc</kbd> を押したり別のアプリに切り替えたりしても、ノートは開いたままです。「常に最前面」ではほかのウインドウより上に表示します。閉じるには <kbd>⌘W</kbd> を押します。</p>
  <h3>ウインドウの表示場所</h3>
  <p>ウインドウはポインタがあるディスプレイの、いま使っているデスクトップに表示されます。別のデスクトップに引き戻されることはありません。位置は記憶され、再起動後も保たれます。設定を開いている間もノートが表示され、変更をその場で確認できます。</p>
  <p>ツールバー中央の空いている部分をドラッグすると移動、端をドラッグするとサイズを変更できます。「設定 → 外観 → ウインドウのサイズ」でリセットできます。</p>
  <h3>ガイドノート</h3>
  <ul>
    <li>初回起動時に、使用中の言語で 7 つのガイドノートが作成されます。自由に編集・削除できます。</li>
    <li>「設定 → 情報」で「ガイドノートを再作成」を選ぶと、新しいガイドを先頭に追加し、ようこそページを開きます。</li>
  </ul>
</section>

<section id="notes">
  <h2>ノート</h2>
  <p>ノートはノートブックのページのように並びます。ツールバーに現在の位置（<code>2 / 5</code> など）が表示されます。ツールバーやショートカットで作成したノートは末尾に追加されます。</p>
  <ul>
    <li><b>新規作成：</b><kbd>⌘N</kbd>、またはツールバーの <b>+</b>。</li>
    <li><b>ページをめくる：</b><kbd>⌘[</kbd> と <kbd>⌘]</kbd>、またはツールバーの矢印。<kbd>⌘⇧[</kbd> と <kbd>⌘⇧]</kbd> で最初と最後のノートへ移動します。</li>
    <li><b>ページへ移動：</b><kbd>⌘1</kbd>〜<kbd>⌘9</kbd> で 1〜9 番目のノートを開きます。</li>
  </ul>
  <p>フッターには現在のノートの作成日時（ローカル時刻）が表示されます。作成日時の記録が始まる前からあるノートには表示されません。</p>
  <p>ページをめくるときは内容が横にスライドします。起動中はノートごとにカーソルとスクロールの位置が保たれ、右端の小さな矢印が上下に続きがあることを示します。</p>
  <p>最初や最後のノートでさらにショートカットを押すと、ページが軽く揺れます。macOS で動きを減らす設定を有効にすると、ページのアニメーションが無効になります。</p>
  <h3>削除と取り消し</h3>
  <p><kbd>⌘D</kbd> で現在のノートをすぐに削除します。通知が 12 秒間表示され、<kbd>⌘U</kbd> を押すか通知をクリックすると元に戻せます。</p>
  <p class="tip">削除したノートはゴミ箱フォルダに移動します。「設定 → データ → 削除したノートを復元…」で、ゴミ箱のノートを新しいノートとして復元できます。</p>
</section>

<section id="palette">
  <h2>検索とコマンド</h2>
  <p>2 つのパネルは同じキーで操作します。入力して絞り込み、<kbd>↑</kbd> <kbd>↓</kbd> で選択、<kbd>Return</kbd> で開き、<kbd>Esc</kbd> で閉じます。</p>
  <h3>ノートを検索 <kbd>⌘⇧F</kbd></h3>
  <ul>
    <li>現在のすべてのノートの本文を検索し、ノートごとに 1 件表示します。</li>
    <li>入力欄が空なら全ノートを一覧するので、目次として使えます。</li>
    <li>バックアップとゴミ箱は検索しません。</li>
  </ul>
  <h3>コマンドパレット <kbd>⌘⇧P</kbd></h3>
  <p><code>format</code> で検索して「ノートを整形」を選ぶと、現在のノートの数式の空白と、JavaScript、TypeScript、JSON、HTML、CSS、Markdown、YAML のコードブロックを整形できます。コードにはインデント設定が適用され、操作全体を一度で取り消せます。</p>
  <p>コマンドパレットからノートを操作したり、設定を変更したりできます。使ったコマンドを最終実行順に新しいものから表示します。</p>
  <ul>
    <li><b>›</b> の付いたコマンドは、アクセントカラーや言語などの 2 段目の一覧を開きます。現在の値には <b>✓</b> が付きます。</li>
    <li>該当の設定を開いて、不透明度、ぼかし、質感の強さ、バックアップ件数を直接入力できます。たとえば「質感の強さ」を開いて <code>37%</code> と入力します。</li>
    <li><kbd>Esc</kbd>、または空の入力欄で <kbd>⌫</kbd> を押すと 1 段戻ります。前に選んでいた行は選択されたままです。</li>
    <li>1 段目で入力すると 2 段目の項目も見つかります。たとえば <code>english</code> と入力すると「言語：English」が表示されます。</li>
  </ul>
  <p>同じショートカットをもう一度押すとパネルを閉じ、もう一方のショートカットを押すとパネルを切り替えます。</p>
  <p><a href="#command-keywords">コマンドのキーワード</a></p>

<section id="writing">
  <h2>書く</h2>
  <p>ノートは普通の Markdown です。見出し、リスト、強調、リンクは入力しながらスタイルが付き、ファイルはどのエディタで開いても読みやすいままです。</p>
  <ul>
    <li><b>チェックボックス：</b><code>- [ ]</code> と <code>- [x]</code> はクリックでチェックできます。</li>
    <li><b>コメント：</b><code>//</code> で始まる行はコメントです。<kbd>⌘/</kbd> で現在の行または選択した行のコメントを切り替えます。</li>
    <li><b>コードフェンス：</b><code>```js</code> のようなコードフェンスは言語ごとに色分けされます。</li>
  </ul>
  <p>長いノートでカーソルを動かすと、カーソルの上下に常に 3 行が見えるようにスクロールします。</p>
  <h3>スニペット</h3>
  <p><code>@</code> と単語を入力すると値を挿入できます。</p>
  <ul>
    <li><kbd>Return</kbd> で最初の形式を挿入、<kbd>↑</kbd> <kbd>↓</kbd> で別の形式を選択、<kbd>Esc</kbd> で一覧を閉じます。</li>
    <li>複数の形式がある単語はすべて表示されます：<code>@date</code> ならすべての日付形式。</li>
    <li>単語の途中まで、または文字を順に入力しても見つかります：<code>@wk</code> で <code>@week</code>。</li>
    <li><code>@</code> だけなら単語ごとに 1 行です。</li>
    <li>プレビューは挿入される内容そのもので、時刻の値は常に最新です。</li>
  </ul>
  <table>
    <thead><tr><th>単語</th><th>形式</th></tr></thead>
    <tbody>
      <tr><td><code>@date</code></td><td>2026-11-18、2026/11/18、20261118、表示言語での長い日付と完全な日付</td></tr>
      <tr><td><code>@time</code></td><td>14:05、14:05:30（<code>@timesec</code>）、午前2:05</td></tr>
      <tr><td><code>@now</code></td><td>日時（<code>@datetime</code>）、秒まで（<code>@datetimesec</code>）、ISO 8601（<code>@iso</code>）、長い形式</td></tr>
      <tr><td><code>@year @month @day</code></td><td>2026；2026-11、11、11月；18、11月18日</td></tr>
      <tr><td><code>@week</code></td><td>2026-W47、W47、曜日（<code>@weekday</code>）、曜日の短縮形</td></tr>
      <tr><td><code>@timestamp</code></td><td>Unix 秒（<code>@unix</code>）、ミリ秒（<code>@ms</code>）</td></tr>
      <tr><td><code>@uuid</code></td><td>ランダムな UUID：小文字、大文字、ハイフンなし</td></tr>
      <tr><td><code>@ip</code></td><td>グローバルアドレス、IPv4（<code>@ipv4</code>）、IPv6（<code>@ipv6</code>）、ローカルネットワーク（<code>@localip</code>）</td></tr>
      <tr><td><code>@mac</code></td><td>ネットワークインターフェースの MAC アドレス</td></tr>
      <tr><td><code>@host</code></td><td>ホスト名（<code>@hostname</code>）、コンピュータ名（<code>@computer</code>）、ユーザー名（<code>@whoami</code>）</td></tr>
      <tr><td><code>@fn @unit @cur @const</code></td><td>計算ブロック内のみ：関数、単位、通貨、定数。<a href="#math">計算</a>を参照</td></tr>
    </tbody>
  </table>
  <ul>
    <li>括弧内の単語はその形式を直接挿入します（例：<code>@timesec</code>）。</li>
    <li>グローバル IP は一覧に表示したときと挿入したときに ipify から取得し、それ以外は送信しません。</li>
    <li>コードの中や英字の直後では表示されないので、メールアドレスはそのままです。</li>
  </ul>
  <h4>自分のスニペット</h4>
  <p>「設定 → スニペット」またはコマンドパレットの「スニペットを管理」で追加します。ノートのフォルダの <code>snippets.json</code> に保存され、ノートと一緒に移動・バックアップされます。</p>
  <p>「設定 → スニペット → スニペットの有効設定」で、組み込みスニペットをグループ別または個別に切り替えられます。「カスタムスニペット」で自作分をまとめて切り替えるか、各行の「有効」を外してください。無効にした項目は補完とプレースホルダの選択に表示されません。テンプレートに含まれるプレースホルダは引き続き展開されます。</p>
  <ul>
    <li><b>1 つのトリガーに複数の行：</b>macOS のユーザ辞書と同じです。住所をいくつか <code>addr</code> に登録すると、<code>@addr</code> ですべて一覧され、既定では最初の行が挿入されます。</li>
    <li><b>組み込みの単語と同じ名前：</b>自分の行が先頭に入るので、自分の <code>date</code> が既定になります。</li>
    <li><b>内容は複数行にできます。</b></li>
  </ul>
  <h4>プレースホルダ</h4>
  <table>
    <thead><tr><th>書き方</th><th>挿入されるもの</th></tr></thead>
    <tbody>
      <tr><td><code>{date}</code></td><td>その単語の既定の形式</td></tr>
      <tr><td><code>{date#2}</code></td><td>2 番目の形式</td></tr>
      <tr><td><code>{ipv4}</code></td><td>その別名の形式</td></tr>
      <tr><td><code>{cursor}</code></td><td>カーソル位置（後述）</td></tr>
      <tr><td><code>{cursor:名前}</code></td><td>「名前」を選択した状態で始まるカーソル位置</td></tr>
      <tr><td><code>{{</code></td><td><code>{</code> そのもの</td></tr>
    </tbody>
  </table>
  <p>「プレースホルダを挿入」に例と一緒に一覧されます。</p>
  <h4>カーソル位置</h4>
  <pre><code>{cursor:名前} 様
{cursor}
{date}</code></pre>
  <ol>
    <li>挿入すると「名前」が選択されます。そのまま入力すれば置き換わります。</li>
    <li><kbd>Tab</kbd> で空の行へ移動します。</li>
    <li><kbd>⇧Tab</kbd> で名前に戻ると、入力した内容がまた選択されます。</li>
  </ol>
  <ul>
    <li><b>表示：</b>入力中の位置は濃い背景と実線の下線、ほかの位置は薄い背景と点線の下線、空の位置は細い縦線です。変更の有無にかかわらず、移動が終わるまで表示されます。</li>
    <li><b>Tab は移動専用：</b>移動中は <kbd>Tab</kbd> と <kbd>⇧Tab</kbd> で位置を移動するだけです。チェックリストの中でも同じです。</li>
    <li><b>終了：</b>最後の位置に着く、カーソルを位置の外へ動かす、<kbd>Esc</kbd> を押す。その後 <kbd>Tab</kbd> はインデントに戻ります。</li>
    <li><b>このときの <kbd>Esc</kbd></b> ではウインドウは隠れません。Vim モードではノーマルモードにも戻ります。</li>
    <li><b>最後の位置が末尾でないとき：</b>もう一度 <kbd>Tab</kbd> でスニペットの末尾へ移動します。</li>
  </ul>
  <h4>注意</h4>
  <ul>
    <li>複数行のスニペットでは、2 行目以降が挿入した行のインデントに揃います。</li>
    <li>位置の中にカーソル位置付きのスニペットを挿入すると、外側の残りの位置は終了します。</li>
    <li>値の取得に時間がかかるスニペット（IP アドレスなど）：その間にカーソルを動かしていれば、カーソルは戻されません。</li>
  </ul>
</section>

<section id="blocks">
  <h2>機能ブロック</h2>
  <p>機能ブロックは、ノートの一部をチェックリスト、計算機、合計、コードなどの小さなツールに変えます。1 つのノートにいくつでも置けます。</p>
  <h3>ブロックの追加と変更</h3>
  <ol>
    <li>空の行で <code>/</code> を入力します。（Vim モードでは先に挿入モードに入ります。）</li>
    <li>矢印キーと <kbd>Return</kbd>、またはクリックでブロックを選びます。</li>
    <li>ブロックの最終行で <kbd>Return</kbd> を押すと、ブロック内に行が追加されます。</li>
  </ol>
  <ul>
    <li>ブロックのヘッダーか <kbd>⌘K</kbd>：種類の変更、通常のテキストへの変換、削除。</li>
    <li><kbd>⌘⇧D</kbd>：現在のブロックを削除。</li>
    <li><kbd>⌘O</kbd> / <kbd>⌘⇧O</kbd>：現在の行またはブロックの下 / 上に空行を追加。</li>
  </ul>
  <p>どれも取り消せます。</p>
  <h3>ブロックの種類</h3>
  <table>
    <thead><tr><th>ブロック</th><th>機能</th></tr></thead>
    <tbody>
      <tr><td>チェックリスト</td><td>チェックボックスをクリックするか、項目の末尾で <code>/x</code> と入力するか、項目内のどこかで <kbd>⌘↩</kbd> を押すと完了状態を切り替えられます。<kbd>⌘↩</kbd> は通常の Markdown タスクでも使えます。<kbd>Tab</kbd> と <kbd>⇧Tab</kbd> でインデントを増減し、子項目は親と一緒に移動します。</td></tr>
      <tr><td>計算</td><td>行末に <code>=</code> を入力すると計算します。変数、関数、単位、通貨に対応します。<a href="#math">計算</a>を参照。</td></tr>
      <tr><td>合計 / 平均</td><td>ブロック内の数値を合計または平均します。式は計算しません。<br>独立した数値だけが対象です：<code>1.2.3.4</code>、IP アドレス、日付 <code>2026-11-19</code>、時刻 <code>14:05</code>、行頭の番号 <code>1.</code>・<code>1.2.</code> は数えません。</td></tr>
      <tr><td>カウント</td><td>項目数、単語数、文字数を数えます。</td></tr>
      <tr><td>コード</td><td>言語ごとにコードを色分けします。<a href="#code">コード</a>を参照してください。</td></tr>
    </tbody>
  </table>
  <p><code>//</code> で始まる行は合計とカウントから除外されます。</p>
  <h3>ノート全体</h3>
  <p>1 行目をキーワードだけにすると、ノート全体がその種類になります。終わりの記号はありません。有効なときはキーワードがアクセントカラーで表示されます。</p>
  <table>
    <thead><tr><th>1 行目</th><th>ノート全体</th></tr></thead>
    <tbody>
      <tr><td><code>list</code></td><td>チェックリスト</td></tr>
      <tr><td><code>math</code></td><td>計算（<a href="#math">計算</a>を参照）</td></tr>
      <tr><td><code>sum</code> / <code>avg</code></td><td>合計 / 平均</td></tr>
      <tr><td><code>count</code></td><td>カウント</td></tr>
      <tr><td><code>code js</code></td><td>コード。<code>js</code> は言語で省略可</td></tr>
    </tbody>
  </table>
  <ul>
    <li>コロンとタイトルを続けられます：<code>sum: 今月の支出</code>、<code>code py: バックアップ</code>。</li>
    <li>大文字と小文字は区別しません。</li>
    <li>ノート内のほかのブロックはそれぞれの種類のままです。ノート全体のコードでは、すべてがコードになります。</li>
  </ul>
</section>

<section id="math">
  <h2>計算</h2>
  <p class="lead">計算ブロックは計算できるメモ用紙です。1 行に 1 つの式を書き、行末に <code>=</code> を付けると結果が後ろに表示されます。変数、関数、単位と通貨の換算が使えます。</p>
  <h3>計算ブロックを作る</h3>
  <ul>
    <li><b>ブロック：</b>空の行で <code>/</code> を入力し、「計算」を選びます。ブロックは <code>:::inkflit math</code> で始まり <code>:::end</code> で終わります。</li>
    <li><b>ノート全体：</b>1 行目を <code>math</code> だけにします。<code>math: 旅行の予算</code> のようにタイトルも付けられます。
      <ul>
        <li>ノートの末尾まで計算されます。終わりの記号はありません。</li>
        <li>ノート内のほかのブロックやコードブロックは計算されません。</li>
        <li>一部だけ計算したいときは、ブロックか <code>```math</code> を使います。</li>
      </ul>
    </li>
    <li><b>Markdown のコードブロック：</b><code>```math</code> で始め、<code>```</code> で終えます。</li>
  </ul>
  <pre><code>math: 旅行の予算
航空券: 36000
ホテル: 9000 * 4
航空券 + ホテル =
ans / 2 =
// 2 人で割り勘</code></pre>
  <h3>行の書き方</h3>
  <table>
    <thead><tr><th>書き方</th><th>働き</th></tr></thead>
    <tbody>
      <tr><td><code>名前: 式</code></td><td>変数を定義します。結果は表示されません。<br>名前には日本語など任意の文字を使えます：<code>単価: 80</code>。<br>もう一度定義すると値が置き換わります。</td></tr>
      <tr><td><code>式 =</code></td><td>計算して行末に結果を表示します。結果はノートには書き込まれず、コピーにも含まれません。</td></tr>
      <tr><td><code>ans</code></td><td>直前の <code>=</code> 行の結果。</td></tr>
      <tr><td><code>// …</code></td><td>コメント。計算されません。</td></tr>
      <tr><td>それ以外の行</td><td>普通のテキストとしてそのまま残ります。</td></tr>
    </tbody>
  </table>
  <ul>
    <li>式が間違っているか書きかけのとき：結果もエラーも表示されず、直すと結果が出ます。</li>
    <li>定義に換算も書けます：<code>予算: 1000 USD to JPY</code>。<code>予算 / 2 =</code> は通貨コードなしの数値になります。</li>
  </ul>
  <h3>数値と演算子</h3>
  <table>
    <thead><tr><th>書き方</th><th>意味</th></tr></thead>
    <tbody>
      <tr><td><code>+ - * /</code></td><td>加算、減算、乗算、除算。<code>×</code> と <code>÷</code> も使えます。</td></tr>
      <tr><td><code>^</code></td><td>べき乗。<code>2^10</code> は 1,024。指数は絶対値 100 以下の数値に限ります。</td></tr>
      <tr><td><code>( )</code></td><td>括弧。数値の直後の括弧は掛け算です：<code>2(3+4)</code> は 14。</td></tr>
      <tr><td><code>%</code></td><td>パーセント：<code>200 - 10%</code> は 180、<code>price + 25%</code> は <code>price</code> にその 25% を足します。<code>%</code> は剰余ではありません。</td></tr>
      <tr><td><code>of</code></td><td>掛け算。パーセントと一緒に使います：<code>50% of 200</code> は 100。</td></tr>
      <tr><td><code>to</code> / <code>in</code></td><td>単位や通貨を換算します（後述）。</td></tr>
      <tr><td><code>pi e tau phi</code></td><td>定数 π、e、τ、φ。</td></tr>
    </tbody>
  </table>
  <ul>
    <li><b>数値：</b>整数、小数、指数表記（<code>1.5e3</code>）。桁区切りのカンマは使えません。</li>
    <li><b>結果：</b>有効数字 10 桁まで、<code>1,234.5</code> の形式で表示します。</li>
  </ul>
  <h3>関数</h3>
  <table>
    <thead><tr><th>関数</th><th>働き</th><th>例</th></tr></thead>
    <tbody>
      <tr><td><code>sqrt(x)</code></td><td>平方根</td><td><code>sqrt(16) = 4</code></td></tr>
      <tr><td><code>abs(x)</code></td><td>絶対値</td><td><code>abs(-3) = 3</code></td></tr>
      <tr><td><code>round(x)<br><code>round(x, n)</code></code></td><td>四捨五入。<code>n</code> は残す小数の桁数</td><td><code>round(2.567, 2) = 2.57</code></td></tr>
      <tr><td><code>floor(x)</code></td><td>切り捨て</td><td><code>floor(2.7) = 2</code></td></tr>
      <tr><td><code>ceil(x)</code></td><td>切り上げ</td><td><code>ceil(2.1) = 3</code></td></tr>
      <tr><td><code>sin(x)</code></td><td>正弦。既定はラジアン、<code>deg</code> を付けると度</td><td><code>sin(30 deg) = 0.5</code></td></tr>
      <tr><td><code>cos(x)</code></td><td>余弦</td><td><code>cos(0) = 1</code></td></tr>
      <tr><td><code>tan(x)</code></td><td>正接</td><td><code>tan(45 deg) = 1</code></td></tr>
      <tr><td><code>log(x)<br><code>log(x, b)</code></code></td><td>自然対数。<code>b</code> で底を指定</td><td><code>log(100, 10) = 2</code></td></tr>
      <tr><td><code>log10(x)</code></td><td>常用対数</td><td><code>log10(1000) = 3</code></td></tr>
      <tr><td><code>exp(x)</code></td><td>e のべき乗</td><td><code>exp(1) = 2.718281828</code></td></tr>
      <tr><td><code>min(a, b, …)</code></td><td>最小値</td><td><code>min(3, 1, 2) = 1</code></td></tr>
      <tr><td><code>max(a, b, …)</code></td><td>最大値</td><td><code>max(3, 1, 2) = 3</code></td></tr>
    </tbody>
  </table>
  <h3>単位</h3>
  <p>数値の後ろに単位を書き、<code>to</code> で換算します。</p>
  <table>
    <thead><tr><th>式</th><th>結果</th><th>説明</th></tr></thead>
    <tbody>
      <tr><td><code>10 km to mi =</code></td><td><code>6.213711922 mi</code></td><td><code>to</code> で換算</td></tr>
      <tr><td><code>2 h + 15 min =</code></td><td><code>2.25 h</code></td><td><code>to</code> なし：最初の単位</td></tr>
      <tr><td><code>2 m * 3 m =</code></td><td><code>6 m^2</code></td><td>単位の掛け算</td></tr>
      <tr><td><code>50 km / 2 h to km/h =</code></td><td><code>25 km / h</code></td><td>単位の割り算と換算</td></tr>
      <tr><td><code>0 degC to degF =</code></td><td><code>32 degF</code></td><td>温度</td></tr>
    </tbody>
  </table>
  <table>
    <thead><tr><th>種類</th><th>主な単位</th></tr></thead>
    <tbody>
      <tr><td>長さ</td><td><code>m</code> <code>km</code> <code>cm</code> <code>mm</code> <code>um</code> <code>nm</code> <code>in</code> <code>ft</code> <code>yd</code> <code>mi</code> <code>nmi</code> <code>mil</code> <code>angstrom</code></td></tr>
      <tr><td>面積</td><td><code>m2</code> <code>km2</code> <code>cm2</code> <code>sqin</code> <code>sqft</code> <code>sqyd</code> <code>sqmi</code> <code>acre</code> <code>hectare</code></td></tr>
      <tr><td>体積</td><td><code>L</code> <code>mL</code> <code>m3</code> <code>cc</code> <code>cuin</code> <code>cuft</code> <code>teaspoon</code> <code>tablespoon</code> <code>cup</code> <code>floz</code> <code>pint</code> <code>quart</code> <code>gallon</code> <code>oilbarrel</code></td></tr>
      <tr><td>質量</td><td><code>mg</code> <code>g</code> <code>kg</code> <code>t</code> <code>ton</code> <code>oz</code> <code>lb</code> <code>stone</code> <code>grain</code></td></tr>
      <tr><td><a href="#time-units">時間</a></td><td><code>ms</code> <code>s</code> <code>min</code> <code>h</code> <code>day</code> <code>week</code> <code>month</code> <code>year</code></td></tr>
      <tr><td>速度</td><td><code>m/s</code> <code>km/h</code> <code>mph</code></td></tr>
      <tr><td>温度</td><td><code>degC</code> <code>degF</code> <code>K</code></td></tr>
      <tr><td><a href="#angle-units">角度</a></td><td><code>deg</code> <code>rad</code> <code>grad</code> <code>arcmin</code> <code>arcsec</code></td></tr>
      <tr><td>力</td><td><code>N</code> <code>kN</code> <code>kgf</code> <code>lbf</code></td></tr>
      <tr><td>エネルギー</td><td><code>J</code> <code>kJ</code> <code>Wh</code> <code>kWh</code> <code>BTU</code> <code>eV</code></td></tr>
      <tr><td>仕事率</td><td><code>W</code> <code>kW</code> <code>hp</code></td></tr>
      <tr><td>圧力</td><td><code>Pa</code> <code>kPa</code> <code>MPa</code> <code>bar</code> <code>atm</code> <code>psi</code> <code>mmHg</code></td></tr>
      <tr><td>電磁気</td><td><code>A</code> <code>mA</code> <code>V</code> <code>kV</code> <code>ohm</code> <code>C</code> <code>Ah</code> <code>mAh</code> <code>F</code> <code>H</code> <code>S</code> <code>Wb</code> <code>T</code></td></tr>
      <tr><td>データ</td><td><code>b</code> <code>B</code> <code>kB</code> <code>MB</code> <code>GB</code> <code>TB</code> <code>KiB</code> <code>MiB</code> <code>GiB</code> <code>TiB</code></td></tr>
      <tr><td>周波数</td><td><code>Hz</code> <code>kHz</code> <code>MHz</code> <code>GHz</code></td></tr>
      <tr><td>その他</td><td><code>mol</code> <code>cd</code></td></tr>
    </tbody>
  </table>
  <ul>
    <li>メートル法の単位には <code>k</code> <code>M</code> <code>G</code> <code>m</code> <code>u</code> などの接頭辞を付けられます：<code>mg</code>、<code>kN</code>、<code>GHz</code>。</li>
    <li>表にない mathjs の組み込み単位も使えます。正式名や複数形も可：<code>meters</code>、<code>inches</code>。</li>
    <li>単位は大文字と小文字を区別します：<code>t</code> はトン、<code>T</code> はテスラ。<code>b</code> はビット、<code>B</code> はバイト。<code>MB</code> は 1000² バイト、<code>MiB</code> は 1024² バイトです。</li>
    <li><code>min</code> だけなら分、<code>min(…)</code> なら関数です。<code>in</code> は数値の直後ならインチ（<code>5 in to cm</code>）、それ以外では換算です（<code>10 km in mi</code>）。</li>
    <li>変数と単位が同じ名前なら変数が優先されます。</li>
  </ul>
  <h4 id="time-units">時間の単位</h4>
  <table>
    <thead><tr><th>単位名（記号）</th><th>数式での入力</th><th>換算</th></tr></thead>
    <tbody>
      <tr><td>ミリ秒（ms）</td><td><code>ms</code> / <code>millisecond</code></td><td>1 ミリ秒 = 0.001 秒</td></tr>
      <tr><td>秒（s）</td><td><code>s</code> / <code>second</code></td><td>1 秒 = 1000 ミリ秒</td></tr>
      <tr><td>分（min）</td><td><code>min</code> / <code>minute</code></td><td>1 分 = 60 秒</td></tr>
      <tr><td>時（h）</td><td><code>h</code> / <code>hour</code></td><td>1 時間 = 60 分</td></tr>
      <tr><td>日（d）</td><td><code>day</code></td><td>1 日 = 24 時間</td></tr>
      <tr><td>週</td><td><code>week</code></td><td>1 週 = 7 日</td></tr>
      <tr><td>月</td><td><code>month</code></td><td>1 か月 = 30.4375 日</td></tr>
      <tr><td>年</td><td><code>year</code></td><td>1 年 = 365.25 日 = 12 か月</td></tr>
    </tbody>
  </table>
  <p>Inkflit の単位換算では、月と年を固定の長さとして扱います。日付の間の実際の日数は暦に従います。</p>
  <p>数式では単位名の <code>minute</code> や <code>second</code> もそのまま使えます。<code>1 minute to s =</code> は <code>60 s</code>、<code>1 second to ms =</code> は <code>1000 ms</code> になります。スニペットで <code>@sec</code> と入力し、<code>@second</code> を選ぶと <code>s</code> が挿入されます。数式で秒を表すには <code>s</code> か <code>second</code> を使ってください。Inkflit は <code>sec</code> を時間の単位として認識しません。</p>
  <h4 id="angle-units">角度の単位</h4>
  <table>
    <thead><tr><th>単位名（記号）</th><th>数式での入力</th><th>換算</th></tr></thead>
    <tbody>
      <tr><td>度（°）</td><td><code>deg</code> / <code>degree</code></td><td>1° = π/180 rad</td></tr>
      <tr><td>ラジアン（rad）</td><td><code>rad</code> / <code>radian</code></td><td>π rad = 180°</td></tr>
      <tr><td>グラジアン（gon）</td><td><code>grad</code> / <code>gradian</code></td><td>100 grad = 90°</td></tr>
      <tr><td>角分（′）</td><td><code>arcmin</code> / <code>arcminute</code></td><td>60 arcmin = 1°</td></tr>
      <tr><td>角秒（″）</td><td><code>arcsec</code> / <code>arcsecond</code></td><td>60 arcsec = 1 arcmin = 1/60°</td></tr>
    </tbody>
  </table>
  <p>一周は 360°、つまり 2π rad です。数式では π を <code>pi</code> と書きます。たとえば <code>pi rad to deg =</code> は <code>180 deg</code> になります。三角関数は単位を省略するとラジアンで計算します。30° の正弦を求めるには <code>sin(30 deg) =</code> と書きます。結果は <code>0.5</code> です。</p>
  <h3>通貨</h3>
  <ul>
    <li><b>書き方：</b><code>10 USD to JPY =</code>。<code>to</code> の代わりに <code>in</code> も使えます。</li>
    <li><b>コード：</b>大文字 3 文字。小文字の <code>usd</code> は通貨になりません。</li>
    <li><b>1 行に 1 つ：</b><code>10 USD + 5 EUR</code> や <code>price USD to JPY</code> は使えません。</li>
  </ul>
  <h4>レート</h4>
  <ul>
    <li><b>出典：</b>Frankfurter が提供する欧州中央銀行の参照レート。営業日に 1 日 1 回更新されます。</li>
    <li><b>日付：</b>結果にレートの日付が付きます（例：<code>1,507 JPY · 2026-11-18</code>）。</li>
    <li><b>取得：</b>計算ブロックを開いているとき、最大 1 時間に 1 回。失敗したら約 100 秒後に再試行します。</li>
    <li><b>表示：</b>レート取得前は「為替レートを取得中、または利用できません」、表にないコードは「未対応の通貨」。</li>
  </ul>
  <p>現在は次の 30 通貨に対応しています（一覧は Frankfurter に準じます）：</p>
  <table>
    <thead><tr><th>コード</th><th>通貨</th><th>コード</th><th>通貨</th></tr></thead>
    <tbody>
      <tr><td><code>AUD</code></td><td>オーストラリア ドル</td><td><code>BRL</code></td><td>ブラジル レアル</td></tr>
      <tr><td><code>CAD</code></td><td>カナダ ドル</td><td><code>CHF</code></td><td>スイス フラン</td></tr>
      <tr><td><code>CNY</code></td><td>中国人民元</td><td><code>CZK</code></td><td>チェコ コルナ</td></tr>
      <tr><td><code>DKK</code></td><td>デンマーク クローネ</td><td><code>EUR</code></td><td>ユーロ</td></tr>
      <tr><td><code>GBP</code></td><td>英国ポンド</td><td><code>HKD</code></td><td>香港ドル</td></tr>
      <tr><td><code>HUF</code></td><td>ハンガリー フォリント</td><td><code>IDR</code></td><td>インドネシア ルピア</td></tr>
      <tr><td><code>ILS</code></td><td>イスラエル新シェケル</td><td><code>INR</code></td><td>インド ルピー</td></tr>
      <tr><td><code>ISK</code></td><td>アイスランド クローナ</td><td><code>JPY</code></td><td>日本円</td></tr>
      <tr><td><code>KRW</code></td><td>韓国ウォン</td><td><code>MXN</code></td><td>メキシコ ペソ</td></tr>
      <tr><td><code>MYR</code></td><td>マレーシア リンギット</td><td><code>NOK</code></td><td>ノルウェー クローネ</td></tr>
      <tr><td><code>NZD</code></td><td>ニュージーランド ドル</td><td><code>PHP</code></td><td>フィリピン ペソ</td></tr>
      <tr><td><code>PLN</code></td><td>ポーランド ズウォティ</td><td><code>RON</code></td><td>ルーマニア レイ</td></tr>
      <tr><td><code>SEK</code></td><td>スウェーデン クローナ</td><td><code>SGD</code></td><td>シンガポール ドル</td></tr>
      <tr><td><code>THB</code></td><td>タイ バーツ</td><td><code>TRY</code></td><td>トルコ リラ</td></tr>
      <tr><td><code>USD</code></td><td>米ドル</td><td><code>ZAR</code></td><td>南アフリカ ランド</td></tr>
    </tbody>
  </table>
  <p class="tip">Inkflit が取得するのは公開されている為替レートだけで、ノートは送信しません。レートを取得できないときは推測せず、そのことを表示します。</p>
  <h3>@ で関数・単位・通貨・定数を挿入する</h3>
  <p>計算ブロックで <code>@</code> を入力すると、通常のスニペットに加えて 4 つのグループが表示されます。</p>
  <table>
    <thead><tr><th>単語</th><th>一覧</th></tr></thead>
    <tbody>
      <tr><td><code>@fn</code></td><td>すべての関数と説明。<code>sqrt()</code> を挿入するとカーソルが括弧の中に入ります。引数を書いたら <kbd>Tab</kbd> で括弧の後ろへ移動できます。</td></tr>
      <tr><td><code>@unit</code></td><td>上の表の単位と、その種類。</td></tr>
      <tr><td><code>@cur</code></td><td>すべての通貨と名前、表示言語の通貨に対するレート（日本語は JPY、英語は USD、簡体字中国語は CNY、繁体字中国語は HKD）。</td></tr>
      <tr><td><code>@const</code></td><td>数学定数とよく使う科学定数。</td></tr>
    </tbody>
  </table>
  <ul>
    <li>名前だけでも使えます：<code>@sqrt</code>、<code>@km</code>、<code>@kilometer</code>、<code>@usd</code> でその項目が直接見つかります。</li>
    <li>数値の直後に <code>@</code> を書けます：<code>10@km</code>。</li>
    <li>計算ブロックの <code>@min</code> には最小値関数と分の単位 <code>@minute</code> が表示されます。分を選ぶと <code>min</code> が挿入されます。<code>@ms</code> にはタイムスタンプとミリ秒の単位 <code>@millisecond</code> が表示されます。</li>
  </ul>
  <h3>ハイライト</h3>
  <p>計算ブロックは「設定 → 外観」のコードの配色で色分けされます。ライトとダークのどちらにも対応します：</p>
  <table>
    <thead><tr><th>要素</th><th>例</th></tr></thead>
    <tbody>
      <tr><td>数値と定数</td><td><code>80</code> <code>1.5e3</code> <code>pi</code></td></tr>
      <tr><td>関数</td><td><code>sqrt</code> <code>round</code></td></tr>
      <tr><td>単位</td><td><code>km</code> <code>min</code> <code>degC</code></td></tr>
      <tr><td>通貨コード（単位と同じ色）</td><td><code>USD</code> <code>JPY</code></td></tr>
      <tr><td>演算子と換算の単語</td><td><code>+</code> <code>×</code> <code>%</code> <code>to</code> <code>of</code></td></tr>
      <tr><td>括弧・カンマ・コロン</td><td><code>(</code> <code>,</code> <code>:</code></td></tr>
      <tr><td>行末の等号（演算子と同じ色）</td><td><code>=</code></td></tr>
      <tr><td>変数の定義と参照</td><td><code>price</code> <code>ans</code></td></tr>
      <tr><td>コメント</td><td><code>// …</code></td></tr>
    </tbody>
  </table>
  <h3>制限</h3>
  <ul>
    <li>式は最大 256 文字です。</li>
    <li>剰余、行列、文字列、比較、独自の関数、式の中での <code>=</code> による代入には対応していません。</li>
  </ul>
</section>

<section id="code">
  <h2>コード</h2>
  <ul>
    <li><b>ノート全体のコード：</b>1 行目を <code>code js</code> にすると、ノート全体をその言語で表示・編集します。<kbd>⌘L</kbd> は 1 行目の言語を変更します。</li>
    <li><kbd>⌘L</kbd> で現在のコードブロックの言語を選びます。</li>
    <li>括弧と引用符は自動で閉じられます。<kbd>Return</kbd> はインデントを保ち、<kbd>Tab</kbd> でインデント、<kbd>⇧Tab</kbd> でインデント解除します。</li>
    <li>何も選択していないときは、<kbd>⌘C</kbd> でブロック全体をコピーします。</li>
  </ul>
  <p>「設定 → 編集 → コードのインデント」でスペース 2 つ、スペース 4 つ、タブから選べます。「設定 → 外観 → コードの配色」では配色を選び、プレビューを確認できます。</p>
  <p>「設定 → 編集 → コードの行番号を表示」をオンにすると、コードブロックごとに 1 から行番号が表示されます。「相対行番号」をオンにすると、カーソルのあるブロックで現在行からの距離を表示します。現在行とほかのブロックは絶対行番号のままです。</p>
</section>

<section id="vim">
  <h2>Vim モード</h2>
  <p>Vim キーは最初からオンです。エディタはノーマルモードで始まり、<kbd>i</kbd> で入力を始め、<kbd>Esc</kbd> でノーマルモードに戻ります。固定していないウインドウでは、ノーマルモードで <kbd>Esc</kbd> を既定で 2 回押すと隠れます。「設定 → 編集」で「Esc を 2 回押して隠す」をオフにすると 1 回で隠せます。</p>
  <ul>
    <li>ノーマルモードでは、コマンドが効くように一時的に英字（ASCII）入力に切り替わります。入力を始めるかウインドウを離れると、元の入力方式に戻ります。</li>
    <li>変換候補が開いているときは、<kbd>Esc</kbd> でまず候補を取り消してから挿入モードを終了します。</li>
    <li>取り消し履歴はノートごとに、アプリを終了するまで保持されます。</li>
  </ul>
  <p>これはエディタ内の Vim エミュレーションで、Neovim ではありません。vimrc は読み込まれません。</p>
  <p>「設定 → 編集 → Vim モード」またはコマンドパレットでオフにできます。オフにすると直接入力できます。固定していないウインドウは <kbd>Esc</kbd> で隠せます。<kbd>⌘Z</kbd> / <kbd>⌘⇧Z</kbd> で取り消しとやり直しができます。</p>
</section>

<section id="settings">
  <h2>設定</h2>
  <p><kbd>⌘,</kbd> またはメニューバーのアイコンから設定を開きます。ほとんどの項目はコマンドパレットからも変更できます。</p>
  <table>
    <thead><tr><th>タブ</th><th>項目</th></tr></thead>
    <tbody>
      <tr><td>一般</td><td>ログイン時に起動、言語、グローバルショートカット</td></tr>
      <tr><td>外観</td><td>表示モード、アクセントカラー、エディタのフォントとサイズ、背景の質感、質感の強さ、ウインドウサイズのリセット、不透明度、背景のぼかし、コードの配色。<kbd>⌥</kbd> を押しながらスライダーを動かすと 5% 単位で調整できます。</td></tr>
      <tr><td>編集</td><td>Vim モード、Esc を 2 回押してウインドウを隠す設定、コードのインデント、コードの行番号を表示、相対行番号</td></tr>
      <tr><td>スニペット</td><td>自分のスニペットと<a href="#writing">スニペットの有効設定</a></td></tr>
      <tr><td>データ</td><td>ノートの保存場所、自動バックアップ、履歴、ゴミ箱、インデックス復旧</td></tr>
      <tr><td>情報</td><td>現在のバージョン、ガイドノートを再作成、ヘルプを開く</td></tr>
    </tbody>
  </table>
  <p><b>外観</b>で「システムに従う」（標準）、「ライト」、「ダーク」から選べます。<b>アクセントカラー</b>には「コーラの赤と青」「クリスマス」「漆の朱」「ミッドナイトゴールド」「ピーコックブルーと金」もあります。いずれもツールバー、本文、メニューに複数の色を組み合わせ、表示モードに合わせて切り替わります。</p>
  <h3>背景の質感</h3>
  <p>「設定 → 外観 → 背景の質感」で、無地、宣紙、ウールフェルト、細粒の砂岩、粗織りリネンから選べます。「質感の強さ」は初期値が 50% で、0% にすると無地になります。デスクトップの透け具合はウインドウの不透明度で調整します。 「無地」を選ぶと質感の強さのスライダーは無効になり、設定値は保持されます。</p>
  <p>コマンドパレットに <code>background material</code> と入力するか、「粗織りリネン」などの名前で検索します。質感を選択したら <code>texture strength</code> を開き、<code>37%</code> などの値を入力できます。</p>
</section>

<section id="shortcuts">
  <h2>キーボードショートカット</h2>
  <p>グローバルショートカットはどのアプリからでも使え、設定で変更できます。そのほかはノートのウインドウがアクティブなときに使えます。</p>
  <table><thead><tr><th>キー</th><th>操作</th></tr></thead><tbody><tr class="group"><td colspan="2">ウインドウ</td></tr><tr><td><kbd>⌃⌥Space</kbd></td><td>どのアプリからでも Inkflit を表示・非表示（初期設定。設定で変更可能）</td></tr><tr><td><kbd>Esc</kbd></td><td>固定していないウインドウを隠す（Vim のノーマルモードでは既定で 2 回）</td></tr><tr><td><kbd>⌘W</kbd></td><td>ノートウインドウを閉じる（固定中も有効）</td></tr><tr><td><kbd>⌘⇧T</kbd></td><td>通常・開いたまま・常に最前面を切り替える</td></tr><tr><td><kbd>⌘,</kbd></td><td>設定を開く</td></tr><tr class="group"><td colspan="2">ノート</td></tr><tr><td><kbd>⌘N</kbd></td><td>末尾に新規ノート</td></tr><tr><td><kbd>⌘[</kbd> / <kbd>⌘]</kbd></td><td>前 / 次のノート</td></tr><tr><td><kbd>⌘⇧[</kbd> / <kbd>⌘⇧]</kbd></td><td>最初 / 最後のノート</td></tr><tr><td><kbd>⌘1</kbd>–<kbd>⌘9</kbd></td><td>1〜9 番目のノートへ移動</td></tr><tr><td><kbd>⌘D</kbd></td><td>現在のノートを削除</td></tr><tr><td><kbd>⌘U</kbd></td><td>直前に削除したノートを復元（12 秒以内）</td></tr><tr class="group"><td colspan="2">検索とコマンド</td></tr><tr><td><kbd>⌘⇧F</kbd></td><td>ノートを検索</td></tr><tr><td><kbd>⌘⇧P</kbd></td><td>コマンドパレット</td></tr><tr class="group"><td colspan="2">編集</td></tr><tr><td><kbd>⌘+</kbd> / <kbd>⌘-</kbd></td><td>エディタの文字を拡大 / 縮小（⌘= でも拡大）</td></tr><tr><td><kbd>⌘↩</kbd></td><td>現在のチェック項目または Markdown タスクの完了状態を切り替える</td></tr><tr><td><kbd>⌘/</kbd></td><td>行をコメント / 解除</td></tr><tr><td><kbd>⌘O</kbd> / <kbd>⌘⇧O</kbd></td><td>現在の行またはブロックの下 / 上に空行を追加</td></tr><tr><td><kbd>⌘K</kbd></td><td>現在のブロックの種類を変更</td></tr><tr><td><kbd>⌘⇧D</kbd></td><td>現在のブロックを削除</td></tr><tr><td><kbd>⌘L</kbd></td><td>コードブロックの言語を選択</td></tr><tr><td><kbd>⌘C</kbd></td><td>未選択時にコードブロック全体をコピー</td></tr><tr><td><kbd>==</kbd></td><td>Vim のノーマルモードで自動インデント。コードは言語の規則とインデント設定、チェックリストは階層に従います。</td></tr><tr><td><kbd>&gt;&gt;</kbd> / <kbd>&lt;&lt;</kbd></td><td>Vim のノーマルモードでインデントを増減。チェックリストの子項目は親項目と一緒に移動します。</td></tr><tr><td><kbd>⌘Z</kbd> / <kbd>⌘⇧Z</kbd></td><td>取り消し / やり直し（Vim オフ時）</td></tr></tbody></table>
</section>

<section id="data">
  <h2>データ</h2>
  <p>すべてのデータは Mac の中だけに保存されます。各ノートは UTF-8 の Markdown ファイルです。</p>
  <pre><code>~/Documents/Inkflit/
  notes/       ノートごとに 1 つの .md ファイル
  index.json   ノートの順番と選択中のノート
  backups/     以前のバージョン
  trash/       削除したノート</code></pre>
  <h3>保存</h3>
  <ul>
    <li>入力を止めて 0.5 秒後に保存します。入力中も少なくとも 2 秒ごとに保存します。</li>
    <li>ノートの切り替え、ウインドウを隠す、アプリの終了ではすぐに保存します。</li>
    <li>保存に失敗するとフッターに表示され、保存に成功するまで終了できません。</li>
  </ul>
  <h3>バックアップと復元</h3>
  <ul>
    <li>編集中、各ノートの以前のバージョンを最大 5 分に 1 回保存します。保持する数は「設定 → データ → 自動バックアップ」で選べます。</li>
    <li>「以前のバージョンを復元…」と「削除したノートを復元…」は新しいノートを作成し、元のファイルはそのまま残します。</li>
    <li><code>index.json</code> が壊れた場合は、「インデックスを再構築…」でノートファイルから作り直せます。古いインデックスは残ります。</li>
  </ul>
  <p>保存場所を変更すると、保存フォルダ全体を新しい場所にコピーし、元のフォルダは残します。</p>
  <p class="tip">Inkflit にはクラウド同期がありません。ノートのフォルダをご自身のバックアップに含めるか、同期サービスが対象にしているフォルダを選んでください。</p>
</section>

<section id="automation">
  <h2>自動化</h2>
  <p>ほかのアプリや AI エージェントは、ローカルの MCP サーバーまたは <code>inkflit://</code> リンクでノートを読み書きできます。どちらも起動中の Inkflit を経由するので、保存とバックアップは通常どおり行われます。</p>
  <h3>MCP</h3>
  <p>MCP クライアントに Inkflit を追加し、クライアントを再起動します。</p>
  <pre><code># Codex
codex mcp add inkflit -- /Applications/Inkflit.app/Contents/MacOS/Inkflit --mcp

# Claude Code
claude mcp add --transport stdio --scope user inkflit -- /Applications/Inkflit.app/Contents/MacOS/Inkflit --mcp

# そのほかのクライアント
{"mcpServers":{"inkflit":{"command":"/Applications/Inkflit.app/Contents/MacOS/Inkflit","args":["--mcp"]}}}</code></pre>
  <p>ツール：<code>list_notes</code>、<code>search_notes</code>、<code>get_note</code>、<code>get_current_note</code>、<code>analyze_note</code>、<code>preview_note_format</code>、<code>apply_note_format</code>、<code>create_note</code>、<code>append_note</code>、<code>replace_note</code>、<code>delete_note</code>。</p>
  <p><code>list_notes</code> に <code>limit</code>、<code>cursor</code>、<code>include_content: false</code> を指定すると概要をページごとに取得できます。<code>get_current_note</code> は選択中のノートを読み取り、<code>analyze_note</code> は <code>id</code> または <code>index</code> で指定したノートの計算結果とチェックリストを返します。</p>
  <p>ノートの <code>id</code> で <code>preview_note_format</code> を呼び出し、差分を確認します。同じ <code>id</code> と返された <code>preview_id</code> を <code>apply_note_format</code> に渡します。本文を変更した場合は再度プレビューしてください。</p>
  <ul>
    <li>ノートは <code>index</code>（Inkflit に表示される番号）か、変わらない <code>id</code> で指定します。ノートを追加・削除すると番号は変わります。</li>
    <li>新しいノートは末尾に追加されます。<code>position</code> に <code>"first"</code>、<code>"last"</code>、または数値を指定すると別の位置に置けます。</li>
    <li>削除したノートはゴミ箱に入ります。</li>
  </ul>
  <h3>リンク</h3>
  <pre><code>open 'inkflit://note/append?index=2&amp;content=Remember%20milk'
open 'inkflit://note/search?query=milk'
open 'inkflit://note/get?index=1'</code></pre>
  <p>操作は <code>list</code>、<code>get</code>、<code>search</code>、<code>create</code>、<code>append</code>、<code>replace</code>、<code>delete</code> です。<code>x-success</code> と <code>x-error</code> にコールバック URL を指定すると、結果を JSON で受け取れます。</p>
  <p><code>inkflit://note/open?index=2</code> でノートを開き、<code>inkflit://settings/appearance</code> または <code>inkflit://settings/snippets</code> で設定を開けます。</p>
  <p class="tip">書き込みや削除のリンクはすぐに実行されます。信頼できるリンクだけを開いてください。</p>
</section>

<section id="trouble">
  <h2>トラブルシューティング</h2>
  <h3>ショートカットが反応しない</h3>
  <p>ほかのアプリが同じショートカットを使っている可能性があります。その場合、メニューバーに「設定…（ショートカットを使用できません）」と表示されます。「設定 → 一般」で別のショートカットを選んでください。</p>
  <h3>ログイン時に起動がオンにならない</h3>
  <p>macOS の承認が必要な場合があります。「システム設定 → 一般 → ログイン項目」で Inkflit を許可してください。</p>
  <h3>Inkflit の外でノートが変更された</h3>
  <p>Inkflit の起動中にほかのアプリがノートファイルを変更すると、Inkflit は上書きを拒否します。現在の内容を安全な場所にコピーしてから、Inkflit を再起動してください。</p>
</section>
</template>
<script>
  const languages = [...document.querySelectorAll('template[data-lang]')].map(t => t.dataset.lang);
  function pickLanguage() {
    const asked = params.get('lang');
    if (languages.includes(asked)) return asked;
    for (const tag of navigator.languages.map(value => value.toLowerCase())) {
      if (tag.startsWith('zh')) return /hant|tw|hk|mo/.test(tag) ? 'zh-Hant' : 'zh-Hans';
      if (tag.startsWith('ja')) return 'ja';
      if (tag.startsWith('en')) return 'en';
    }
    return 'en';
  }
  const lang = pickLanguage();
  const source = document.querySelector(`template[data-lang="${lang}"]`).content;
  const labels = JSON.parse(source.querySelector('script[type="application/json"]').textContent);
  document.documentElement.lang = lang;
  document.title = labels.title;
  document.getElementById('title').textContent = labels.title;
  document.getElementById('tagline').textContent = labels.tagline;
  document.getElementById('brand-label').textContent = labels.label;
  const q = document.getElementById('q');
  q.placeholder = labels.search;
  document.getElementById('empty').textContent = labels.empty;
  const content = document.getElementById('content');
  for (const section of source.querySelectorAll('section')) content.append(section.cloneNode(true));

  // Outline icons, 24px grid, bundled for offline use.
  const icons = {
    start: '<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"/>',
    notes: '<path d="M8 3h9a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H8"/><path d="M5 6h9a2 2 0 0 1 2 2v13H7a2 2 0 0 1-2-2Z"/>',
    palette: '<circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/>',
    'command-keywords': '<path d="m5 7 4 4-4 4M12 15h7"/>',
    writing: '<path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16Z"/><path d="m13.5 6.5 4 4"/>',
    blocks: '<rect x="3" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.5"/><path d="M17.25 14v6.5M14 17.25h6.5"/>',
    math: '<rect x="5" y="2.5" width="14" height="19" rx="2"/><path d="M8.5 6.5h7M8.5 11h.01M12 11h.01M15.5 11h.01M8.5 14.5h.01M12 14.5h.01M15.5 14.5h.01M8.5 18h.01M12 18h.01M15.5 18h.01"/>',
    code: '<path d="m8 8-4 4 4 4M16 8l4 4-4 4M13.5 5l-3 14"/>',
    vim: '<path d="m4 5 4 14 4-14m1 14h7M13 5h7m-3.5 0v14"/>',
    settings: '<circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M4.6 4.6l2.1 2.1M17.3 17.3l2.1 2.1M2.5 12h3M18.5 12h3M4.6 19.4l2.1-2.1M17.3 6.7l2.1-2.1"/>',
    shortcuts: '<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M6 9h.01M10 9h.01M14 9h.01M18 9h.01M6 13h.01M10 13h.01M14 13h.01M18 13h.01M8 16h8"/>',
    data: '<ellipse cx="12" cy="5.5" rx="8" ry="3"/><path d="M4 5.5v6.5c0 1.7 3.6 3 8 3s8-1.3 8-3V5.5M4 12v6.5c0 1.7 3.6 3 8 3s8-1.3 8-3V12"/>',
    automation: '<path d="M13 2 4 14h7l-1 8 9-12h-7Z"/>',
    trouble: '<circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 0 1 5 0c0 2-2.5 2-2.5 4m0 3.5h.01"/>',
  };
  function icon(name) {
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    for (const [key, value] of Object.entries({ viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', 'stroke-width': '1.8', 'stroke-linecap': 'round', 'stroke-linejoin': 'round', 'aria-hidden': 'true' })) svg.setAttribute(key, value);
    svg.innerHTML = icons[name] || icons.start;
    return svg;
  }

  const sections = [...content.querySelectorAll('section')];
  const toc = document.getElementById('toc');
  for (const section of sections) {
    section.querySelector('h2').prepend(icon(section.id));
    const link = document.createElement('a');
    link.href = `#${section.id}`;
    link.append(icon(section.id), document.createTextNode(section.querySelector('h2').textContent));
    const item = document.createElement('li'); item.append(link); toc.append(item);
  }
  const links = [...toc.querySelectorAll('a')];
  function filter() {
    const term = q.value.trim().toLowerCase();
    let shown = 0;
    sections.forEach((section, index) => {
      const hit = !term || section.textContent.toLowerCase().includes(term);
      section.classList.toggle('hidden', !hit);
      links[index].parentElement.style.display = hit ? '' : 'none';
      shown += hit ? 1 : 0;
    });
    document.getElementById('empty').style.display = shown ? 'none' : 'block';
  }
  function mark() {
    let current = sections.find(section => !section.classList.contains('hidden')) || sections[0];
    for (const section of sections) if (!section.classList.contains('hidden') && section.getBoundingClientRect().top < 120) current = section;
    links.forEach(link => link.classList.toggle('on', link.getAttribute('href') === `#${current.id}`));
  }
  function jump() { const target = location.hash && document.getElementById(location.hash.slice(1)); if (target) target.scrollIntoView(); mark(); }
  q.addEventListener('input', () => { filter(); mark(); });
  addEventListener('scroll', mark, { passive: true });
  addEventListener('hashchange', jump);
  addEventListener('keydown', event => {
    if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === 'f') { event.preventDefault(); q.focus(); q.select(); }
    if (event.key === 'Escape' && document.activeElement === q) { q.value = ''; filter(); mark(); }
  });
  requestAnimationFrame(jump);
</script>
