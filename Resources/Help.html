<section id="start">
  <h2>Getting started</h2>
  <p class="lead">Inkflit lives in the menu bar. Call it up with one shortcut, jot something down, and it gets out of the way. Notes save themselves as you type.</p>
  <ol>
    <li><b>Show the window</b> with the global shortcut, <kbd>⌃⌥Space</kbd> by default (you can change it in <b>Settings → General</b>), or click the menu bar icon and choose <b>Open Inkflit</b>.</li>
    <li><b>Write.</b> Changes are saved automatically; there is no Save button.</li>
    <li><b>Hide it</b> with the same shortcut or <kbd>Esc</kbd>. Switching to another app also hides it.</li>
  </ol>
  <h3>Where the window appears</h3>
  <p>The window opens on the display under the pointer, on the Space you are using now, so it never pulls you back to another desktop. It keeps the position you gave it, also after a restart.</p>
  <p>Drag the toolbar's empty middle to move the window, and drag an edge to resize it.</p>
  <h3>Guide notes</h3>
  <p>The first launch creates four guide notes in your language. Edit or delete them freely. <b>Restore Guide Notes</b> at the bottom of Settings brings back a fresh set at the front and opens the welcome note.</p>
</section>

<section id="notes">
  <h2>Notes</h2>
  <p>Notes are kept in order like the pages of a notebook: the first note is the oldest, and a new note is added at the end. The toolbar shows where you are, for example <code>2 / 5</code>.</p>
  <ul>
    <li><b>New note:</b> <kbd>⌘N</kbd> or the <b>+</b> button.</li>
    <li><b>Turn pages:</b> <kbd>⌘[</kbd> and <kbd>⌘]</kbd>, or the arrows in the toolbar.</li>
    <li><b>Jump to a page:</b> <kbd>⌘1</kbd> to <kbd>⌘9</kbd> open notes 1 to 9.</li>
  </ul>
  <p>The footer shows when the current note was created, in your local time. Notes created before this was recorded show no date.</p>
  <h3>Deleting and undoing</h3>
  <p><kbd>⌘D</kbd> deletes the current note right away. A notice stays for 12 seconds; press <kbd>⌘U</kbd> or click it to bring the note back.</p>
  <p class="tip">Deleted notes are never erased. They stay in the Trash folder, and <b>Settings → Backups → Restore deleted note…</b> brings any of them back as a new note.</p>
</section>

<section id="palette">
  <h2>Search and commands</h2>
  <p>Two panels share the same keys: type to filter, <kbd>↑</kbd> <kbd>↓</kbd> to choose, <kbd>Return</kbd> to open, <kbd>Esc</kbd> to close.</p>
  <h3>Search notes <kbd>⌘⇧F</kbd></h3>
  <p>Searches the text of all current notes and lists one match per note. With an empty field it lists every note, so it also works as a table of contents. Backups and the Trash are not searched.</p>
  <h3>Command palette <kbd>⌘⇧P</kbd></h3>
  <p>Runs note actions and changes settings without opening the Settings window.</p>
  <ul>
    <li>Commands marked <b>›</b> open a second list, such as accent colors or languages. The current value has a <b>✓</b>.</li>
    <li>For opacity, blur and backups you can also type a number, for example <code>75</code>.</li>
    <li><kbd>Esc</kbd>, or <kbd>⌫</kbd> in an empty field, goes back one level with the previous row still selected.</li>
    <li>Typing on the first level also finds second-level options, so <code>english</code> finds <b>Language: English</b>.</li>
  </ul>
  <p>Press either shortcut again to close its panel, or the other shortcut to switch panels.</p>
</section>

<section id="writing">
  <h2>Writing</h2>
  <p>Notes are plain Markdown. Headings, lists, emphasis and links are styled as you type, and the source stays readable in any editor.</p>
  <ul>
    <li><b>Checkboxes:</b> <code>- [ ]</code> and <code>- [x]</code> can be clicked to tick them off.</li>
    <li><b>Comments:</b> a line starting with <code>//</code> is a comment. <kbd>⌘/</kbd> toggles it for the current or selected lines.</li>
    <li><b>Code fences:</b> <code>```js</code> fences are highlighted by language.</li>
  </ul>
  <p>While you move through a long note, three lines stay visible above and below the cursor.</p>
</section>

<section id="blocks">
  <h2>Feature blocks</h2>
  <p>A block turns part of a note into a small tool: a checklist, a calculator, a running total or a code snippet. A note can hold any number of blocks.</p>
  <h3>Adding and changing blocks</h3>
  <ol>
    <li>On an empty line, type <code>/</code>. (In Vim mode, enter insert mode first.)</li>
    <li>Pick a block with the arrow keys and <kbd>Return</kbd>, or click it.</li>
    <li>To leave a block, press <kbd>Return</kbd> on its last empty line.</li>
  </ol>
  <p>Use the block header or <kbd>⌘K</kbd> to change the type, turn it back into plain text, or delete it. <kbd>⌘⇧D</kbd> deletes the current block. All of these can be undone. <kbd>⌘O</kbd> and <kbd>⌘⇧O</kbd> add an empty line below or above the current line or block.</p>
  <h3>Block types</h3>
  <table>
    <thead><tr><th>Block</th><th>What it does</th></tr></thead>
    <tbody>
      <tr><td>Checklist</td><td>A checkbox on every line. Click it or end a line with <code>/x</code>. <kbd>Tab</kbd> and <kbd>⇧Tab</kbd> indent and outdent; sub-items move with their parent.</td></tr>
      <tr><td>Math</td><td>End a line with <code>=</code> to calculate. Supports percentages, functions, units and variables such as <code>price: 80</code>. Currency uses uppercase codes: <code>10 USD to CNY =</code>.</td></tr>
      <tr><td>Sum / Average</td><td>Adds up or averages the numbers in the block, without evaluating expressions.</td></tr>
      <tr><td>Count</td><td>Counts items, words and characters.</td></tr>
      <tr><td>Code</td><td>Highlights code by language. See <a href="#code">Code</a>.</td></tr>
    </tbody>
  </table>
  <p>Lines starting with <code>//</code> are left out of totals and counts.</p>
  <p class="tip">Exchange rates come from Frankfurter. Inkflit only downloads public rates; your notes are never sent. When rates are unavailable, the block says so instead of guessing.</p>
</section>

<section id="code">
  <h2>Code</h2>
  <ul>
    <li><kbd>⌘L</kbd> chooses the language of the current code block.</li>
    <li>Brackets and quotes are closed for you. <kbd>Return</kbd> keeps the indentation, <kbd>Tab</kbd> indents and <kbd>⇧Tab</kbd> outdents.</li>
    <li>With nothing selected, <kbd>⌘C</kbd> copies the whole block.</li>
  </ul>
  <p>Indentation (2 spaces, 4 spaces or tabs) and the three color themes are in <b>Settings → Edit</b>, with a live preview.</p>
</section>

<section id="vim">
  <h2>Vim mode</h2>
  <p>Vim keys are on by default. The editor starts in normal mode; press <kbd>i</kbd> to type and <kbd>Esc</kbd> to go back. In normal mode, <kbd>Esc</kbd> hides the window.</p>
  <ul>
    <li>In normal mode Inkflit switches to an ASCII keyboard layout so commands work, and restores your input method when you start typing or leave the window.</li>
    <li>An open input method candidate is cancelled before <kbd>Esc</kbd> leaves insert mode.</li>
    <li>Undo history is kept per note until you quit.</li>
  </ul>
  <p>This is Vim emulation in the editor, not Neovim, so a vimrc is not loaded.</p>
  <p>Turn it off in <b>Settings → Edit → Vim Mode</b> or from the command palette. Then you type directly, <kbd>Esc</kbd> hides the window, and <kbd>⌘Z</kbd> / <kbd>⌘⇧Z</kbd> undo and redo.</p>
</section>

<section id="settings">
  <h2>Settings</h2>
  <p>Open Settings with <kbd>⌘,</kbd> or from the menu bar icon. Most options are also in the command palette.</p>
  <table>
    <thead><tr><th>Tab</th><th>Options</th></tr></thead>
    <tbody>
      <tr><td>General</td><td>Launch at login, the global shortcut, the notes folder</td></tr>
      <tr><td>Appearance</td><td>Accent color, window opacity, background blur. Hold <kbd>⌥</kbd> while dragging a slider to move in 5% steps.</td></tr>
      <tr><td>Edit</td><td>Vim mode, code indentation, code colors</td></tr>
      <tr><td>Language</td><td>Follow the system, or choose English, 简体中文, 繁體中文 or 日本語</td></tr>
      <tr><td>Backups</td><td>Automatic backups, previous versions, Trash, index recovery</td></tr>
    </tbody>
  </table>
  <p>Light and dark appearance follow macOS.</p>
</section>

<section id="shortcuts">
  <h2>Keyboard shortcuts</h2>
  <p>The global shortcut works from any app and can be changed in Settings. The others work while the note window is active.</p>
  <table><thead><tr><th>Keys</th><th>Action</th></tr></thead><tbody><tr class="group"><td colspan="2">Window</td></tr><tr><td><kbd>⌃⌥Space</kbd></td><td>Show or hide Inkflit from any app (default; change it in Settings)</td></tr><tr><td><kbd>Esc</kbd></td><td>Hide the window (in Vim, leave insert mode first)</td></tr><tr><td><kbd>⌘,</kbd></td><td>Open Settings</td></tr><tr class="group"><td colspan="2">Notes</td></tr><tr><td><kbd>⌘N</kbd></td><td>New note at the end</td></tr><tr><td><kbd>⌘[</kbd> / <kbd>⌘]</kbd></td><td>Previous / next note</td></tr><tr><td><kbd>⌘1</kbd>–<kbd>⌘9</kbd></td><td>Jump to note 1–9</td></tr><tr><td><kbd>⌘D</kbd></td><td>Delete the current note</td></tr><tr><td><kbd>⌘U</kbd></td><td>Restore the last deleted note (within 12 seconds)</td></tr><tr class="group"><td colspan="2">Search and commands</td></tr><tr><td><kbd>⌘⇧F</kbd></td><td>Search notes</td></tr><tr><td><kbd>⌘⇧P</kbd></td><td>Command palette</td></tr><tr class="group"><td colspan="2">Editing</td></tr><tr><td><kbd>⌘/</kbd></td><td>Comment or uncomment lines</td></tr><tr><td><kbd>⌘O</kbd> / <kbd>⌘⇧O</kbd></td><td>New line below / above the current line or block</td></tr><tr><td><kbd>⌘K</kbd></td><td>Change the current block type</td></tr><tr><td><kbd>⌘⇧D</kbd></td><td>Delete the current block</td></tr><tr><td><kbd>⌘L</kbd></td><td>Choose the code block language</td></tr><tr><td><kbd>⌘C</kbd></td><td>Copy the whole code block when nothing is selected</td></tr><tr><td><kbd>⌘Z</kbd> / <kbd>⌘⇧Z</kbd></td><td>Undo / redo (with Vim off)</td></tr></tbody></table>
</section>

<section id="data">
  <h2>Your data</h2>
  <p>Everything stays on your Mac. Each note is a UTF-8 Markdown file:</p>
  <pre><code>~/Documents/Inkflit/
  notes/       one .md file per note
  index.json   order and the selected note
  backups/     previous versions
  trash/       deleted notes</code></pre>
  <h3>Saving</h3>
  <p>Changes are saved half a second after you stop typing, and at least every two seconds while you type. Switching notes, hiding the window or quitting saves at once. If a save fails, the footer says so and Inkflit will not quit until it succeeds.</p>
  <h3>Backups and recovery</h3>
  <ul>
    <li>While you edit, the previous version of a note is kept at most once every five minutes. Choose how many to keep in <b>Settings → Backups</b>.</li>
    <li><b>Restore a previous version…</b> and <b>Restore deleted note…</b> create a new note and leave the original file in place.</li>
    <li>If <code>index.json</code> is damaged, <b>Rebuild index…</b> recreates it from the note files. The old index is kept.</li>
  </ul>
  <p>Choosing another folder copies the whole store there and keeps the original.</p>
  <p class="tip">Inkflit has no cloud sync. Include the notes folder in your own backups, or choose a folder that your sync service already covers.</p>
</section>

<section id="automation">
  <h2>Automation</h2>
  <p>Other apps and AI agents can read and edit notes through a local MCP server or <code>inkflit://</code> links. Both go through the running app, so saving and backups work as usual.</p>
  <h3>MCP</h3>
  <p>Add Inkflit to your MCP client, then restart the client:</p>
  <pre><code># Codex
codex mcp add inkflit -- /Applications/Inkflit.app/Contents/MacOS/Inkflit --mcp

# Claude Code
claude mcp add --transport stdio --scope user inkflit -- /Applications/Inkflit.app/Contents/MacOS/Inkflit --mcp

# Other clients
{"mcpServers":{"inkflit":{"command":"/Applications/Inkflit.app/Contents/MacOS/Inkflit","args":["--mcp"]}}}</code></pre>
  <p>Tools: <code>list_notes</code>, <code>search_notes</code>, <code>get_note</code>, <code>create_note</code>, <code>append_note</code>, <code>replace_note</code>, <code>delete_note</code>.</p>
  <ul>
    <li>Pick a note by <code>index</code> (the number shown in Inkflit) or by its stable <code>id</code>. Indices shift when notes are added or deleted.</li>
    <li>New notes go to the end. Pass <code>position</code> as <code>"first"</code>, <code>"last"</code> or a number to place them elsewhere.</li>
    <li>Deleted notes go to the Trash.</li>
  </ul>
  <h3>Links</h3>
  <pre><code>open 'inkflit://note/append?index=2&amp;content=Remember%20milk'
open 'inkflit://note/search?query=milk'
open 'inkflit://note/get?index=1'</code></pre>
  <p>Actions are <code>list</code>, <code>get</code>, <code>search</code>, <code>create</code>, <code>append</code>, <code>replace</code> and <code>delete</code>. Add <code>x-success</code> and <code>x-error</code> callback URLs to receive the result as JSON.</p>
  <p class="tip">Links that write or delete run immediately. Only open links you trust.</p>
</section>

<section id="trouble">
  <h2>Troubleshooting</h2>
  <h3>The shortcut does nothing</h3>
  <p>Another app may already use it. The menu bar shows <b>Settings… (shortcut unavailable)</b> in that case; choose a different shortcut in <b>Settings → General</b>.</p>
  <h3>Launch at login stays off</h3>
  <p>macOS may need your approval. Allow Inkflit in <b>System Settings → General → Login Items</b>.</p>
  <h3>Notes changed outside Inkflit</h3>
  <p>If the note files were edited by another app while Inkflit was running, Inkflit refuses to overwrite them. Copy your current text somewhere safe and restart Inkflit.</p>
</section>

<section id="start">
  <h2>开始使用</h2>
  <p class="lead">Inkflit 常驻在菜单栏。按一个快捷键就能叫出来，记完随手收起。输入时自动保存。</p>
  <ol>
    <li><b>打开窗口：</b>按全局快捷键，默认是 <kbd>⌃⌥Space</kbd>（可在“设置 → 通用”中更改），或点菜单栏图标，选择“打开 Inkflit”。</li>
    <li><b>开始写：</b>内容会自动保存，没有保存按钮。</li>
    <li><b>收起窗口：</b>再按一次快捷键，或按 <kbd>Esc</kbd>。切换到其他应用时也会自动收起。</li>
  </ol>
  <h3>窗口出现在哪里</h3>
  <p>窗口会出现在鼠标所在的显示器、你当前所在的桌面上，不会把你拉回别的桌面。窗口位置会被记住，重启后也一样。</p>
  <p>拖动工具栏中间的空白处可以移动窗口，拖动边缘可以调整大小。</p>
  <h3>引导笔记</h3>
  <p>第一次启动时，Inkflit 会按你的语言创建四篇引导笔记，可以随意修改或删除。点设置窗口底部的“重新生成引导笔记”，会在最前面放一套新的引导，并打开欢迎页。</p>
</section>

<section id="notes">
  <h2>笔记</h2>
  <p>笔记像本子的书页一样排列：第一篇是最早写的，新建的笔记加在最后。工具栏会显示当前位置，比如 <code>2 / 5</code>。</p>
  <ul>
    <li><b>新建：</b><kbd>⌘N</kbd>，或工具栏上的 <b>+</b>。</li>
    <li><b>翻页：</b><kbd>⌘[</kbd> 和 <kbd>⌘]</kbd>，或工具栏上的箭头。</li>
    <li><b>跳到某一页：</b><kbd>⌘1</kbd> 到 <kbd>⌘9</kbd> 打开第 1 到第 9 篇。</li>
  </ul>
  <p>底栏显示当前笔记的创建时间（本地时间）。在记录创建时间之前就有的笔记不显示日期。</p>
  <h3>删除与撤销</h3>
  <p><kbd>⌘D</kbd> 直接删除当前笔记。提示会保留 12 秒，按 <kbd>⌘U</kbd> 或点击提示就能找回。</p>
  <p class="tip">删除的笔记不会被真正抹掉，而是放进回收站文件夹。在“设置 → 备份 → 恢复已删除笔记…”中可以把任意一篇恢复成新笔记。</p>
</section>

<section id="palette">
  <h2>搜索与命令</h2>
  <p>两个面板的按键一样：输入文字筛选，<kbd>↑</kbd> <kbd>↓</kbd> 选择，<kbd>Return</kbd> 打开，<kbd>Esc</kbd> 关闭。</p>
  <h3>搜索笔记 <kbd>⌘⇧F</kbd></h3>
  <p>在所有当前笔记的正文里查找，每篇笔记列出一条匹配结果。输入框为空时会列出全部笔记，可以当目录用。备份和回收站里的内容不会被搜索。</p>
  <h3>命令面板 <kbd>⌘⇧P</kbd></h3>
  <p>不用打开设置窗口，就能执行笔记操作、修改设置。</p>
  <ul>
    <li>带 <b>›</b> 的命令会打开第二级列表，比如界面主色、语言。当前生效的选项带 <b>✓</b>。</li>
    <li>不透明度、模糊和自动备份可以直接输入数字，比如 <code>75</code>。</li>
    <li>按 <kbd>Esc</kbd>，或在空输入框里按 <kbd>⌫</kbd>，返回上一级，之前选中的那一项仍然选中。</li>
    <li>在第一级直接输入，也能搜到第二级的选项，比如输入 <code>english</code> 会出现“语言：English”。</li>
  </ul>
  <p>再按一次同一个快捷键关闭面板；按另一个快捷键则切换到另一个面板。</p>
</section>

<section id="writing">
  <h2>书写</h2>
  <p>笔记就是普通的 Markdown。标题、列表、强调和链接会边写边显示样式，源文件用任何编辑器打开都清楚易读。</p>
  <ul>
    <li><b>复选框：</b><code>- [ ]</code> 和 <code>- [x]</code> 可以直接点击勾选。</li>
    <li><b>注释：</b>以 <code>//</code> 开头的行是注释。<kbd>⌘/</kbd> 为当前行或选中的行添加或取消注释。</li>
    <li><b>代码围栏：</b><code>```js</code> 这样的代码围栏会按语言高亮。</li>
  </ul>
  <p>在长笔记里移动光标时，光标上下始终保留三行可见。</p>
</section>

<section id="blocks">
  <h2>功能块</h2>
  <p>功能块把笔记的一部分变成小工具：清单、计算器、合计或一段代码。一篇笔记里可以放任意多个功能块。</p>
  <h3>插入和修改功能块</h3>
  <ol>
    <li>在空行输入 <code>/</code>。（Vim 模式下请先进入插入模式。）</li>
    <li>用方向键和 <kbd>Return</kbd> 选择，或直接点击。</li>
    <li>要离开功能块，在块的最后一个空行再按一次 <kbd>Return</kbd>。</li>
  </ol>
  <p>用块的标题栏或 <kbd>⌘K</kbd> 更改类型、转回普通文本或删除。<kbd>⌘⇧D</kbd> 删除当前块。这些操作都可以撤销。<kbd>⌘O</kbd> 和 <kbd>⌘⇧O</kbd> 在当前行或块的下方、上方插入一个空行。</p>
  <h3>功能块类型</h3>
  <table>
    <thead><tr><th>功能块</th><th>作用</th></tr></thead>
    <tbody>
      <tr><td>清单</td><td>每行一个复选框。点击勾选，或在行尾输入 <code>/x</code>。<kbd>Tab</kbd> 和 <kbd>⇧Tab</kbd> 缩进和取消缩进，子项会跟着父项一起移动。</td></tr>
      <tr><td>计算</td><td>在行尾输入 <code>=</code> 得出结果。支持百分比、函数、单位和变量，比如 <code>price: 80</code>。货币用大写代码：<code>10 USD to CNY =</code>。</td></tr>
      <tr><td>求和 / 平均值</td><td>对块里的数字求和或求平均，不计算表达式。</td></tr>
      <tr><td>计数</td><td>统计项目数、词数和字符数。</td></tr>
      <tr><td>代码</td><td>按语言高亮代码，见<a href="#code">代码</a>。</td></tr>
    </tbody>
  </table>
  <p>以 <code>//</code> 开头的行不参与合计和计数。</p>
  <p class="tip">汇率来自 Frankfurter。Inkflit 只下载公开汇率，不会上传你的笔记。拿不到汇率时，功能块会直接提示，不会给出猜测的结果。</p>
</section>

<section id="code">
  <h2>代码</h2>
  <ul>
    <li><kbd>⌘L</kbd> 选择当前代码块的语言。</li>
    <li>括号和引号会自动补全。<kbd>Return</kbd> 保持缩进，<kbd>Tab</kbd> 缩进，<kbd>⇧Tab</kbd> 取消缩进。</li>
    <li>没有选中内容时，<kbd>⌘C</kbd> 复制整个代码块。</li>
  </ul>
  <p>缩进方式（2 个空格、4 个空格或 Tab）和三种配色在“设置 → 编辑”中，可以实时预览。</p>
</section>

<section id="vim">
  <h2>Vim 模式</h2>
  <p>Vim 按键默认开启。编辑器先处于普通模式，按 <kbd>i</kbd> 开始输入，按 <kbd>Esc</kbd> 回到普通模式。在普通模式下按 <kbd>Esc</kbd> 会收起窗口。</p>
  <ul>
    <li>普通模式下，Inkflit 会临时切换到英文（ASCII）输入法，让命令键直接生效；开始输入或离开窗口时恢复你原来的输入法。</li>
    <li>如果输入法候选框还开着，按 <kbd>Esc</kbd> 会先取消候选，再退出插入模式。</li>
    <li>每篇笔记的撤销记录会保留到退出应用为止。</li>
  </ul>
  <p>这是编辑器里的 Vim 模拟，不是 Neovim，不会读取 vimrc。</p>
  <p>在“设置 → 编辑 → Vim 模式”或命令面板里可以关闭。关闭后直接输入，<kbd>Esc</kbd> 收起窗口，<kbd>⌘Z</kbd> / <kbd>⌘⇧Z</kbd> 撤销和重做。</p>
</section>

<section id="settings">
  <h2>设置</h2>
  <p>按 <kbd>⌘,</kbd> 或通过菜单栏图标打开设置。大部分选项在命令面板里也能改。</p>
  <table>
    <thead><tr><th>标签页</th><th>选项</th></tr></thead>
    <tbody>
      <tr><td>通用</td><td>开机启动、全局快捷键、笔记保存位置</td></tr>
      <tr><td>外观</td><td>界面主色、窗口不透明度、背景模糊。拖动滑块时按住 <kbd>⌥</kbd>，每次调整 5%。</td></tr>
      <tr><td>编辑</td><td>Vim 模式、代码缩进、代码配色</td></tr>
      <tr><td>语言</td><td>跟随系统，或选择 English、简体中文、繁體中文、日本語</td></tr>
      <tr><td>备份</td><td>自动备份、历史版本、回收站、索引恢复</td></tr>
    </tbody>
  </table>
  <p>浅色和深色外观跟随 macOS。</p>
</section>

<section id="shortcuts">
  <h2>快捷键</h2>
  <p>全局快捷键在任何应用里都能用，可以在设置中更改。其他快捷键在笔记窗口激活时可用。</p>
  <table><thead><tr><th>按键</th><th>操作</th></tr></thead><tbody><tr class="group"><td colspan="2">窗口</td></tr><tr><td><kbd>⌃⌥Space</kbd></td><td>在任意应用中显示或隐藏 Inkflit（默认快捷键，可在设置中更改）</td></tr><tr><td><kbd>Esc</kbd></td><td>隐藏窗口（Vim 模式下先退出插入模式）</td></tr><tr><td><kbd>⌘,</kbd></td><td>打开设置</td></tr><tr class="group"><td colspan="2">笔记</td></tr><tr><td><kbd>⌘N</kbd></td><td>在末尾新建笔记</td></tr><tr><td><kbd>⌘[</kbd> / <kbd>⌘]</kbd></td><td>上一条 / 下一条笔记</td></tr><tr><td><kbd>⌘1</kbd>–<kbd>⌘9</kbd></td><td>跳到第 1–9 条笔记</td></tr><tr><td><kbd>⌘D</kbd></td><td>删除当前笔记</td></tr><tr><td><kbd>⌘U</kbd></td><td>恢复刚删除的笔记（12 秒内）</td></tr><tr class="group"><td colspan="2">搜索与命令</td></tr><tr><td><kbd>⌘⇧F</kbd></td><td>搜索笔记</td></tr><tr><td><kbd>⌘⇧P</kbd></td><td>命令面板</td></tr><tr class="group"><td colspan="2">编辑</td></tr><tr><td><kbd>⌘/</kbd></td><td>注释或取消注释</td></tr><tr><td><kbd>⌘O</kbd> / <kbd>⌘⇧O</kbd></td><td>在当前行或块下方 / 上方插入空行</td></tr><tr><td><kbd>⌘K</kbd></td><td>更改当前块类型</td></tr><tr><td><kbd>⌘⇧D</kbd></td><td>删除当前块</td></tr><tr><td><kbd>⌘L</kbd></td><td>选择代码块语言</td></tr><tr><td><kbd>⌘C</kbd></td><td>未选中内容时复制整个代码块</td></tr><tr><td><kbd>⌘Z</kbd> / <kbd>⌘⇧Z</kbd></td><td>撤销 / 重做（关闭 Vim 时）</td></tr></tbody></table>
</section>

<section id="data">
  <h2>数据</h2>
  <p>所有内容都只保存在你的 Mac 上。每篇笔记是一个 UTF-8 编码的 Markdown 文件：</p>
  <pre><code>~/Documents/Inkflit/
  notes/       每篇笔记一个 .md 文件
  index.json   笔记顺序和当前选中的笔记
  backups/     历史版本
  trash/       已删除的笔记</code></pre>
  <h3>保存</h3>
  <p>停止输入半秒后保存，连续输入时至少每两秒保存一次。切换笔记、收起窗口或退出应用时会立即保存。保存失败时底栏会提示，并且在保存成功之前无法退出应用。</p>
  <h3>备份与恢复</h3>
  <ul>
    <li>编辑时，每篇笔记最多每五分钟保留一个旧版本。保留多少个可以在“设置 → 备份”中选择。</li>
    <li>“恢复历史版本…”和“恢复已删除笔记…”都会新建一篇笔记，原文件保留不动。</li>
    <li>如果 <code>index.json</code> 损坏，“重建索引…”会根据笔记文件重新生成索引，旧索引会保留。</li>
  </ul>
  <p>更改保存位置时，会把整个存储目录复制过去，原目录保留不动。</p>
  <p class="tip">Inkflit 没有云同步。请把笔记文件夹纳入你自己的备份，或者选择一个同步服务已经覆盖的文件夹。</p>
</section>

<section id="automation">
  <h2>自动化</h2>
  <p>其他应用和 AI 助手可以通过本机 MCP 服务或 <code>inkflit://</code> 链接读写笔记。两种方式都经过正在运行的 Inkflit，保存和备份照常进行。</p>
  <h3>MCP</h3>
  <p>把 Inkflit 加进你的 MCP 客户端，然后重启客户端：</p>
  <pre><code># Codex
codex mcp add inkflit -- /Applications/Inkflit.app/Contents/MacOS/Inkflit --mcp

# Claude Code
claude mcp add --transport stdio --scope user inkflit -- /Applications/Inkflit.app/Contents/MacOS/Inkflit --mcp

# 其他客户端
{"mcpServers":{"inkflit":{"command":"/Applications/Inkflit.app/Contents/MacOS/Inkflit","args":["--mcp"]}}}</code></pre>
  <p>工具：<code>list_notes</code>、<code>search_notes</code>、<code>get_note</code>、<code>create_note</code>、<code>append_note</code>、<code>replace_note</code>、<code>delete_note</code>。</p>
  <ul>
    <li>用 <code>index</code>（Inkflit 里显示的序号）或稳定的 <code>id</code> 指定笔记。增删笔记后序号会变化。</li>
    <li>新笔记默认加在最后。<code>position</code> 可以设为 <code>"first"</code>、<code>"last"</code> 或一个数字，放到其他位置。</li>
    <li>删除的笔记进入回收站。</li>
  </ul>
  <h3>链接</h3>
  <pre><code>open 'inkflit://note/append?index=2&amp;content=Remember%20milk'
open 'inkflit://note/search?query=milk'
open 'inkflit://note/get?index=1'</code></pre>
  <p>可用的操作有 <code>list</code>、<code>get</code>、<code>search</code>、<code>create</code>、<code>append</code>、<code>replace</code> 和 <code>delete</code>。加上 <code>x-success</code> 和 <code>x-error</code> 回调地址，可以收到 JSON 格式的结果。</p>
  <p class="tip">写入和删除类的链接会立即执行，只打开你信任的链接。</p>
</section>

<section id="trouble">
  <h2>常见问题</h2>
  <h3>按快捷键没有反应</h3>
  <p>可能有其他应用占用了这个快捷键。这时菜单栏里会显示“设置…（快捷键不可用）”，请在“设置 → 通用”中换一个快捷键。</p>
  <h3>开机启动打不开</h3>
  <p>macOS 可能需要你授权。请在“系统设置 → 通用 → 登录项”中允许 Inkflit。</p>
  <h3>笔记在 Inkflit 之外被修改</h3>
  <p>如果 Inkflit 运行时笔记文件被其他应用改过，Inkflit 会拒绝覆盖这些文件。请先把当前内容复制到安全的地方，然后重启 Inkflit。</p>
</section>

<section id="start">
  <h2>開始使用</h2>
  <p class="lead">Inkflit 常駐在選單列。按一個快捷鍵就能叫出來，記完隨手收起。輸入時自動儲存。</p>
  <ol>
    <li><b>開啟視窗：</b>按全域快捷鍵，預設為 <kbd>⌃⌥Space</kbd>（可在「設定 → 一般」中變更），或點選單列圖示，選擇「開啟 Inkflit」。</li>
    <li><b>開始寫：</b>內容會自動儲存，沒有儲存按鈕。</li>
    <li><b>收起視窗：</b>再按一次快捷鍵，或按 <kbd>Esc</kbd>。切換到其他應用程式時也會自動收起。</li>
  </ol>
  <h3>視窗出現在哪裡</h3>
  <p>視窗會出現在滑鼠所在的顯示器、你目前所在的桌面上，不會把你拉回其他桌面。視窗位置會被記住，重新啟動後也一樣。</p>
  <p>拖曳工具列中間的空白處可以移動視窗，拖曳邊緣可以調整大小。</p>
  <h3>引導筆記</h3>
  <p>第一次啟動時，Inkflit 會依你的語言建立四篇引導筆記，可以隨意修改或刪除。點設定視窗底部的「重新產生引導筆記」，會在最前面放一套新的引導，並開啟歡迎頁。</p>
</section>

<section id="notes">
  <h2>筆記</h2>
  <p>筆記像筆記本的書頁一樣排列：第一則是最早寫的，新增的筆記加在最後。工具列會顯示目前位置，例如 <code>2 / 5</code>。</p>
  <ul>
    <li><b>新增：</b><kbd>⌘N</kbd>，或工具列上的 <b>+</b>。</li>
    <li><b>翻頁：</b><kbd>⌘[</kbd> 和 <kbd>⌘]</kbd>，或工具列上的箭頭。</li>
    <li><b>跳到某一頁：</b><kbd>⌘1</kbd> 到 <kbd>⌘9</kbd> 開啟第 1 到第 9 則。</li>
  </ul>
  <p>底列顯示目前筆記的建立時間（本地時間）。在開始記錄建立時間之前就有的筆記不顯示日期。</p>
  <h3>刪除與復原</h3>
  <p><kbd>⌘D</kbd> 直接刪除目前筆記。提示會保留 12 秒，按 <kbd>⌘U</kbd> 或點擊提示就能找回。</p>
  <p class="tip">刪除的筆記不會被真正抹除，而是放進回收站資料夾。在「設定 → 備份 → 還原已刪除筆記…」中可以把任何一則還原成新筆記。</p>
</section>

<section id="palette">
  <h2>搜尋與命令</h2>
  <p>兩個面板的按鍵一樣：輸入文字篩選，<kbd>↑</kbd> <kbd>↓</kbd> 選擇，<kbd>Return</kbd> 開啟，<kbd>Esc</kbd> 關閉。</p>
  <h3>搜尋筆記 <kbd>⌘⇧F</kbd></h3>
  <p>在所有目前筆記的內文中尋找，每則筆記列出一筆符合結果。輸入框為空時會列出全部筆記，可以當目錄使用。備份和回收站裡的內容不會被搜尋。</p>
  <h3>命令面板 <kbd>⌘⇧P</kbd></h3>
  <p>不用開啟設定視窗，就能執行筆記操作、修改設定。</p>
  <ul>
    <li>帶 <b>›</b> 的命令會開啟第二層清單，例如介面主色、語言。目前生效的選項帶 <b>✓</b>。</li>
    <li>不透明度、模糊和自動備份可以直接輸入數字，例如 <code>75</code>。</li>
    <li>按 <kbd>Esc</kbd>，或在空白輸入框裡按 <kbd>⌫</kbd>，返回上一層，之前選取的項目仍然選取。</li>
    <li>在第一層直接輸入，也能搜尋到第二層的選項，例如輸入 <code>english</code> 會出現「語言：English」。</li>
  </ul>
  <p>再按一次同一個快捷鍵關閉面板；按另一個快捷鍵則切換到另一個面板。</p>
</section>

<section id="writing">
  <h2>書寫</h2>
  <p>筆記就是一般的 Markdown。標題、清單、強調和連結會邊寫邊顯示樣式，原始檔用任何編輯器開啟都清楚易讀。</p>
  <ul>
    <li><b>核取方塊：</b><code>- [ ]</code> 和 <code>- [x]</code> 可以直接點擊勾選。</li>
    <li><b>註解：</b>以 <code>//</code> 開頭的行是註解。<kbd>⌘/</kbd> 為目前行或選取的行加上或取消註解。</li>
    <li><b>程式碼圍欄：</b><code>```js</code> 這樣的程式碼圍欄會依語言突顯。</li>
  </ul>
  <p>在長筆記裡移動游標時，游標上下始終保留三行可見。</p>
</section>

<section id="blocks">
  <h2>功能區塊</h2>
  <p>功能區塊把筆記的一部分變成小工具：清單、計算機、加總或一段程式碼。一則筆記裡可以放任意多個功能區塊。</p>
  <h3>插入與修改功能區塊</h3>
  <ol>
    <li>在空行輸入 <code>/</code>。（Vim 模式下請先進入插入模式。）</li>
    <li>用方向鍵和 <kbd>Return</kbd> 選擇，或直接點擊。</li>
    <li>要離開功能區塊，在區塊的最後一個空行再按一次 <kbd>Return</kbd>。</li>
  </ol>
  <p>用區塊的標題列或 <kbd>⌘K</kbd> 變更類型、轉回一般文字或刪除。<kbd>⌘⇧D</kbd> 刪除目前區塊。這些操作都可以復原。<kbd>⌘O</kbd> 和 <kbd>⌘⇧O</kbd> 在目前行或區塊的下方、上方插入一個空行。</p>
  <h3>功能區塊類型</h3>
  <table>
    <thead><tr><th>功能區塊</th><th>作用</th></tr></thead>
    <tbody>
      <tr><td>清單</td><td>每行一個核取方塊。點擊勾選，或在行尾輸入 <code>/x</code>。<kbd>Tab</kbd> 和 <kbd>⇧Tab</kbd> 縮排和取消縮排，子項目會跟著父項目一起移動。</td></tr>
      <tr><td>計算</td><td>在行尾輸入 <code>=</code> 得出結果。支援百分比、函式、單位和變數，例如 <code>price: 80</code>。貨幣使用大寫代碼：<code>10 USD to TWD =</code>。</td></tr>
      <tr><td>加總 / 平均值</td><td>對區塊裡的數字加總或求平均，不計算運算式。</td></tr>
      <tr><td>計數</td><td>統計項目數、字數和字元數。</td></tr>
      <tr><td>程式碼</td><td>依語言突顯程式碼，見<a href="#code">程式碼</a>。</td></tr>
    </tbody>
  </table>
  <p>以 <code>//</code> 開頭的行不列入加總和計數。</p>
  <p class="tip">匯率來自 Frankfurter。Inkflit 只下載公開匯率，不會上傳你的筆記。取得不到匯率時，功能區塊會直接提示，不會給出猜測的結果。</p>
</section>

<section id="code">
  <h2>程式碼</h2>
  <ul>
    <li><kbd>⌘L</kbd> 選擇目前程式碼區塊的語言。</li>
    <li>括號和引號會自動補上。<kbd>Return</kbd> 保持縮排，<kbd>Tab</kbd> 縮排，<kbd>⇧Tab</kbd> 取消縮排。</li>
    <li>沒有選取內容時，<kbd>⌘C</kbd> 複製整個程式碼區塊。</li>
  </ul>
  <p>縮排方式（2 個空格、4 個空格或 Tab）和三種配色在「設定 → 編輯」中，可以即時預覽。</p>
</section>

<section id="vim">
  <h2>Vim 模式</h2>
  <p>Vim 按鍵預設開啟。編輯器先處於一般模式，按 <kbd>i</kbd> 開始輸入，按 <kbd>Esc</kbd> 回到一般模式。在一般模式下按 <kbd>Esc</kbd> 會收起視窗。</p>
  <ul>
    <li>一般模式下，Inkflit 會暫時切換到英文（ASCII）輸入法，讓命令鍵直接生效；開始輸入或離開視窗時恢復你原本的輸入法。</li>
    <li>如果輸入法候選視窗還開著，按 <kbd>Esc</kbd> 會先取消候選，再離開插入模式。</li>
    <li>每則筆記的復原記錄會保留到結束應用程式為止。</li>
  </ul>
  <p>這是編輯器裡的 Vim 模擬，不是 Neovim，不會讀取 vimrc。</p>
  <p>在「設定 → 編輯 → Vim 模式」或命令面板裡可以關閉。關閉後直接輸入，<kbd>Esc</kbd> 收起視窗，<kbd>⌘Z</kbd> / <kbd>⌘⇧Z</kbd> 復原和重做。</p>
</section>

<section id="settings">
  <h2>設定</h2>
  <p>按 <kbd>⌘,</kbd> 或透過選單列圖示開啟設定。大部分選項在命令面板裡也能修改。</p>
  <table>
    <thead><tr><th>分頁</th><th>選項</th></tr></thead>
    <tbody>
      <tr><td>一般</td><td>登入時啟動、全域快捷鍵、筆記儲存位置</td></tr>
      <tr><td>外觀</td><td>介面主色、視窗不透明度、背景模糊。拖曳滑桿時按住 <kbd>⌥</kbd>，每次調整 5%。</td></tr>
      <tr><td>編輯</td><td>Vim 模式、程式碼縮排、程式碼配色</td></tr>
      <tr><td>語言</td><td>跟隨系統，或選擇 English、简体中文、繁體中文、日本語</td></tr>
      <tr><td>備份</td><td>自動備份、歷史版本、回收站、索引還原</td></tr>
    </tbody>
  </table>
  <p>淺色和深色外觀跟隨 macOS。</p>
</section>

<section id="shortcuts">
  <h2>快捷鍵</h2>
  <p>全域快捷鍵在任何應用程式裡都能使用，可以在設定中變更。其他快捷鍵在筆記視窗作用中時可用。</p>
  <table><thead><tr><th>按鍵</th><th>操作</th></tr></thead><tbody><tr class="group"><td colspan="2">視窗</td></tr><tr><td><kbd>⌃⌥Space</kbd></td><td>在任何應用程式中顯示或隱藏 Inkflit（預設快捷鍵，可在設定中變更）</td></tr><tr><td><kbd>Esc</kbd></td><td>隱藏視窗（Vim 模式下先離開插入模式）</td></tr><tr><td><kbd>⌘,</kbd></td><td>開啟設定</td></tr><tr class="group"><td colspan="2">筆記</td></tr><tr><td><kbd>⌘N</kbd></td><td>在最後新增筆記</td></tr><tr><td><kbd>⌘[</kbd> / <kbd>⌘]</kbd></td><td>上一則 / 下一則筆記</td></tr><tr><td><kbd>⌘1</kbd>–<kbd>⌘9</kbd></td><td>跳到第 1–9 則筆記</td></tr><tr><td><kbd>⌘D</kbd></td><td>刪除目前筆記</td></tr><tr><td><kbd>⌘U</kbd></td><td>還原剛刪除的筆記（12 秒內）</td></tr><tr class="group"><td colspan="2">搜尋與命令</td></tr><tr><td><kbd>⌘⇧F</kbd></td><td>搜尋筆記</td></tr><tr><td><kbd>⌘⇧P</kbd></td><td>命令面板</td></tr><tr class="group"><td colspan="2">編輯</td></tr><tr><td><kbd>⌘/</kbd></td><td>註解或取消註解</td></tr><tr><td><kbd>⌘O</kbd> / <kbd>⌘⇧O</kbd></td><td>在目前行或區塊下方 / 上方插入空行</td></tr><tr><td><kbd>⌘K</kbd></td><td>變更目前區塊類型</td></tr><tr><td><kbd>⌘⇧D</kbd></td><td>刪除目前區塊</td></tr><tr><td><kbd>⌘L</kbd></td><td>選擇程式碼區塊語言</td></tr><tr><td><kbd>⌘C</kbd></td><td>未選取內容時複製整個程式碼區塊</td></tr><tr><td><kbd>⌘Z</kbd> / <kbd>⌘⇧Z</kbd></td><td>復原 / 重做（關閉 Vim 時）</td></tr></tbody></table>
</section>

<section id="data">
  <h2>資料</h2>
  <p>所有內容都只儲存在你的 Mac 上。每則筆記是一個 UTF-8 編碼的 Markdown 檔案：</p>
  <pre><code>~/Documents/Inkflit/
  notes/       每則筆記一個 .md 檔案
  index.json   筆記順序和目前選取的筆記
  backups/     歷史版本
  trash/       已刪除的筆記</code></pre>
  <h3>儲存</h3>
  <p>停止輸入半秒後儲存，連續輸入時至少每兩秒儲存一次。切換筆記、收起視窗或結束應用程式時會立即儲存。儲存失敗時底列會提示，並且在儲存成功之前無法結束應用程式。</p>
  <h3>備份與還原</h3>
  <ul>
    <li>編輯時，每則筆記最多每五分鐘保留一個舊版本。保留幾個可以在「設定 → 備份」中選擇。</li>
    <li>「還原歷史版本…」和「還原已刪除筆記…」都會新增一則筆記，原檔案保留不動。</li>
    <li>如果 <code>index.json</code> 損壞，「重建索引…」會依筆記檔案重新產生索引，舊索引會保留。</li>
  </ul>
  <p>變更儲存位置時，會把整個儲存目錄複製過去，原目錄保留不動。</p>
  <p class="tip">Inkflit 沒有雲端同步。請把筆記資料夾納入你自己的備份，或選擇一個同步服務已經涵蓋的資料夾。</p>
</section>

<section id="automation">
  <h2>自動化</h2>
  <p>其他應用程式和 AI 助理可以透過本機 MCP 服務或 <code>inkflit://</code> 連結讀寫筆記。兩種方式都經過正在執行的 Inkflit，儲存和備份照常進行。</p>
  <h3>MCP</h3>
  <p>把 Inkflit 加入你的 MCP 用戶端，然後重新啟動用戶端：</p>
  <pre><code># Codex
codex mcp add inkflit -- /Applications/Inkflit.app/Contents/MacOS/Inkflit --mcp

# Claude Code
claude mcp add --transport stdio --scope user inkflit -- /Applications/Inkflit.app/Contents/MacOS/Inkflit --mcp

# 其他用戶端
{"mcpServers":{"inkflit":{"command":"/Applications/Inkflit.app/Contents/MacOS/Inkflit","args":["--mcp"]}}}</code></pre>
  <p>工具：<code>list_notes</code>、<code>search_notes</code>、<code>get_note</code>、<code>create_note</code>、<code>append_note</code>、<code>replace_note</code>、<code>delete_note</code>。</p>
  <ul>
    <li>用 <code>index</code>（Inkflit 裡顯示的序號）或穩定的 <code>id</code> 指定筆記。增刪筆記後序號會變動。</li>
    <li>新筆記預設加在最後。<code>position</code> 可以設為 <code>"first"</code>、<code>"last"</code> 或一個數字，放到其他位置。</li>
    <li>刪除的筆記進入回收站。</li>
  </ul>
  <h3>連結</h3>
  <pre><code>open 'inkflit://note/append?index=2&amp;content=Remember%20milk'
open 'inkflit://note/search?query=milk'
open 'inkflit://note/get?index=1'</code></pre>
  <p>可用的操作有 <code>list</code>、<code>get</code>、<code>search</code>、<code>create</code>、<code>append</code>、<code>replace</code> 和 <code>delete</code>。加上 <code>x-success</code> 和 <code>x-error</code> 回呼網址，可以收到 JSON 格式的結果。</p>
  <p class="tip">寫入和刪除類的連結會立即執行，只開啟你信任的連結。</p>
</section>

<section id="trouble">
  <h2>疑難排解</h2>
  <h3>按快捷鍵沒有反應</h3>
  <p>可能有其他應用程式佔用了這個快捷鍵。這時選單列裡會顯示「設定…（快捷鍵無法使用）」，請在「設定 → 一般」中換一個快捷鍵。</p>
  <h3>登入時啟動無法開啟</h3>
  <p>macOS 可能需要你授權。請在「系統設定 → 一般 → 登入項目」中允許 Inkflit。</p>
  <h3>筆記在 Inkflit 之外被修改</h3>
  <p>如果 Inkflit 執行時筆記檔案被其他應用程式改過，Inkflit 會拒絕覆寫這些檔案。請先把目前內容複製到安全的地方，然後重新啟動 Inkflit。</p>
</section>

<section id="start">
  <h2>はじめに</h2>
  <p class="lead">Inkflit はメニューバーに常駐します。ショートカットひとつで呼び出し、書き終えたらすぐにしまえます。入力内容は自動で保存されます。</p>
  <ol>
    <li><b>ウインドウを表示：</b>グローバルショートカット（初期設定は <kbd>⌃⌥Space</kbd>。「設定 → 一般」で変更できます）を押すか、メニューバーのアイコンから「Inkflit を開く」を選びます。</li>
    <li><b>書く：</b>変更は自動で保存されます。保存ボタンはありません。</li>
    <li><b>隠す：</b>同じショートカットか <kbd>Esc</kbd> を押します。ほかのアプリに切り替えたときも自動で隠れます。</li>
  </ol>
  <h3>ウインドウの表示場所</h3>
  <p>ウインドウはポインタがあるディスプレイの、いま使っているデスクトップに表示されます。別のデスクトップに引き戻されることはありません。位置は記憶され、再起動後も保たれます。</p>
  <p>ツールバー中央の空いている部分をドラッグすると移動、端をドラッグするとサイズを変更できます。</p>
  <h3>ガイドノート</h3>
  <p>初回起動時に、使用中の言語で 4 つのガイドノートが作成されます。自由に編集・削除できます。設定ウインドウ下部の「ガイドノートを再作成」を押すと、新しいガイドが先頭に追加され、ようこそページが開きます。</p>
</section>

<section id="notes">
  <h2>ノート</h2>
  <p>ノートはノートブックのページのように並びます。最初のノートがいちばん古く、新しいノートは末尾に追加されます。ツールバーには現在の位置が表示されます（例：<code>2 / 5</code>）。</p>
  <ul>
    <li><b>新規作成：</b><kbd>⌘N</kbd>、またはツールバーの <b>+</b>。</li>
    <li><b>ページをめくる：</b><kbd>⌘[</kbd> と <kbd>⌘]</kbd>、またはツールバーの矢印。</li>
    <li><b>ページへ移動：</b><kbd>⌘1</kbd>〜<kbd>⌘9</kbd> で 1〜9 番目のノートを開きます。</li>
  </ul>
  <p>フッターには現在のノートの作成日時（ローカル時刻）が表示されます。作成日時の記録が始まる前からあるノートには表示されません。</p>
  <h3>削除と取り消し</h3>
  <p><kbd>⌘D</kbd> で現在のノートをすぐに削除します。通知が 12 秒間表示され、<kbd>⌘U</kbd> を押すか通知をクリックすると元に戻せます。</p>
  <p class="tip">削除したノートは完全には消えず、ゴミ箱フォルダに残ります。「設定 → バックアップ → 削除したノートを復元…」から、どのノートでも新しいノートとして復元できます。</p>
</section>

<section id="palette">
  <h2>検索とコマンド</h2>
  <p>2 つのパネルは同じキーで操作します。入力して絞り込み、<kbd>↑</kbd> <kbd>↓</kbd> で選択、<kbd>Return</kbd> で開き、<kbd>Esc</kbd> で閉じます。</p>
  <h3>ノートを検索 <kbd>⌘⇧F</kbd></h3>
  <p>現在のすべてのノートの本文を検索し、ノートごとに 1 件ずつ一致箇所を表示します。入力欄が空のときは全ノートを一覧するので、目次としても使えます。バックアップとゴミ箱は検索対象外です。</p>
  <h3>コマンドパレット <kbd>⌘⇧P</kbd></h3>
  <p>設定ウインドウを開かずに、ノートの操作や設定の変更ができます。</p>
  <ul>
    <li><b>›</b> の付いたコマンドは、アクセントカラーや言語などの 2 段目の一覧を開きます。現在の値には <b>✓</b> が付きます。</li>
    <li>不透明度、ぼかし、自動バックアップは数値を直接入力することもできます（例：<code>75</code>）。</li>
    <li><kbd>Esc</kbd>、または空の入力欄で <kbd>⌫</kbd> を押すと 1 段戻ります。前に選んでいた行は選択されたままです。</li>
    <li>1 段目で入力すると 2 段目の項目も見つかります。たとえば <code>english</code> と入力すると「言語：English」が表示されます。</li>
  </ul>
  <p>同じショートカットをもう一度押すとパネルを閉じ、もう一方のショートカットを押すとパネルを切り替えます。</p>
</section>

<section id="writing">
  <h2>書く</h2>
  <p>ノートは普通の Markdown です。見出し、リスト、強調、リンクは入力しながらスタイルが付き、ファイルはどのエディタで開いても読みやすいままです。</p>
  <ul>
    <li><b>チェックボックス：</b><code>- [ ]</code> と <code>- [x]</code> はクリックでチェックできます。</li>
    <li><b>コメント：</b><code>//</code> で始まる行はコメントです。<kbd>⌘/</kbd> で現在の行または選択した行のコメントを切り替えます。</li>
    <li><b>コードフェンス：</b><code>```js</code> のようなコードフェンスは言語ごとに色分けされます。</li>
  </ul>
  <p>長いノートでカーソルを動かすと、カーソルの上下に常に 3 行が見えるようにスクロールします。</p>
</section>

<section id="blocks">
  <h2>機能ブロック</h2>
  <p>機能ブロックは、ノートの一部をチェックリスト、計算機、合計、コードなどの小さなツールに変えます。1 つのノートにいくつでも置けます。</p>
  <h3>ブロックの追加と変更</h3>
  <ol>
    <li>空の行で <code>/</code> を入力します。（Vim モードでは先に挿入モードに入ります。）</li>
    <li>矢印キーと <kbd>Return</kbd>、またはクリックでブロックを選びます。</li>
    <li>ブロックから出るには、最後の空行でもう一度 <kbd>Return</kbd> を押します。</li>
  </ol>
  <p>ブロックのヘッダーか <kbd>⌘K</kbd> で、種類の変更、通常のテキストへの変換、削除ができます。<kbd>⌘⇧D</kbd> は現在のブロックを削除します。どれも取り消せます。<kbd>⌘O</kbd> と <kbd>⌘⇧O</kbd> は現在の行またはブロックの下・上に空行を追加します。</p>
  <h3>ブロックの種類</h3>
  <table>
    <thead><tr><th>ブロック</th><th>機能</th></tr></thead>
    <tbody>
      <tr><td>チェックリスト</td><td>各行にチェックボックスが付きます。クリックするか、行末に <code>/x</code> と入力します。<kbd>Tab</kbd> と <kbd>⇧Tab</kbd> でインデントを増減し、子項目は親と一緒に移動します。</td></tr>
      <tr><td>計算</td><td>行末に <code>=</code> を入力すると計算します。パーセント、関数、単位、<code>price: 80</code> のような変数に対応します。通貨は大文字のコードで指定します：<code>10 USD to JPY =</code>。</td></tr>
      <tr><td>合計 / 平均</td><td>ブロック内の数値を合計または平均します。式は計算しません。</td></tr>
      <tr><td>カウント</td><td>項目数、単語数、文字数を数えます。</td></tr>
      <tr><td>コード</td><td>言語ごとにコードを色分けします。<a href="#code">コード</a>を参照してください。</td></tr>
    </tbody>
  </table>
  <p><code>//</code> で始まる行は合計とカウントから除外されます。</p>
  <p class="tip">為替レートは Frankfurter から取得します。Inkflit は公開レートをダウンロードするだけで、ノートを送信することはありません。レートを取得できないときは、推測した値ではなくその旨を表示します。</p>
</section>

<section id="code">
  <h2>コード</h2>
  <ul>
    <li><kbd>⌘L</kbd> で現在のコードブロックの言語を選びます。</li>
    <li>括弧と引用符は自動で閉じられます。<kbd>Return</kbd> はインデントを保ち、<kbd>Tab</kbd> でインデント、<kbd>⇧Tab</kbd> でインデント解除します。</li>
    <li>何も選択していないときは、<kbd>⌘C</kbd> でブロック全体をコピーします。</li>
  </ul>
  <p>インデント（スペース 2 つ、スペース 4 つ、タブ）と 3 種類の配色は「設定 → 編集」にあり、プレビューで確認できます。</p>
</section>

<section id="vim">
  <h2>Vim モード</h2>
  <p>Vim キーは最初からオンです。エディタはノーマルモードで始まり、<kbd>i</kbd> で入力を始め、<kbd>Esc</kbd> でノーマルモードに戻ります。ノーマルモードで <kbd>Esc</kbd> を押すとウインドウが隠れます。</p>
  <ul>
    <li>ノーマルモードでは、コマンドが効くように一時的に英字（ASCII）入力に切り替わります。入力を始めるかウインドウを離れると、元の入力方式に戻ります。</li>
    <li>変換候補が開いているときは、<kbd>Esc</kbd> でまず候補を取り消してから挿入モードを終了します。</li>
    <li>取り消し履歴はノートごとに、アプリを終了するまで保持されます。</li>
  </ul>
  <p>これはエディタ内の Vim エミュレーションで、Neovim ではありません。vimrc は読み込まれません。</p>
  <p>「設定 → 編集 → Vim モード」またはコマンドパレットでオフにできます。オフにすると直接入力でき、<kbd>Esc</kbd> でウインドウが隠れ、<kbd>⌘Z</kbd> / <kbd>⌘⇧Z</kbd> で取り消しとやり直しができます。</p>
</section>

<section id="settings">
  <h2>設定</h2>
  <p><kbd>⌘,</kbd> またはメニューバーのアイコンから設定を開きます。ほとんどの項目はコマンドパレットからも変更できます。</p>
  <table>
    <thead><tr><th>タブ</th><th>項目</th></tr></thead>
    <tbody>
      <tr><td>一般</td><td>ログイン時に起動、グローバルショートカット、ノートの保存場所</td></tr>
      <tr><td>外観</td><td>アクセントカラー、ウインドウの不透明度、背景のぼかし。<kbd>⌥</kbd> を押しながらスライダーを動かすと 5% 単位で調整できます。</td></tr>
      <tr><td>編集</td><td>Vim モード、コードのインデント、コードの配色</td></tr>
      <tr><td>言語</td><td>システムに従う、または English、简体中文、繁體中文、日本語</td></tr>
      <tr><td>バックアップ</td><td>自動バックアップ、履歴、ゴミ箱、インデックス復旧</td></tr>
    </tbody>
  </table>
  <p>ライト / ダークの外観は macOS に従います。</p>
</section>

<section id="shortcuts">
  <h2>キーボードショートカット</h2>
  <p>グローバルショートカットはどのアプリからでも使え、設定で変更できます。そのほかはノートのウインドウがアクティブなときに使えます。</p>
  <table><thead><tr><th>キー</th><th>操作</th></tr></thead><tbody><tr class="group"><td colspan="2">ウインドウ</td></tr><tr><td><kbd>⌃⌥Space</kbd></td><td>どのアプリからでも Inkflit を表示・非表示（初期設定。設定で変更可能）</td></tr><tr><td><kbd>Esc</kbd></td><td>ウインドウを隠す（Vim では先に挿入モードを終了）</td></tr><tr><td><kbd>⌘,</kbd></td><td>設定を開く</td></tr><tr class="group"><td colspan="2">ノート</td></tr><tr><td><kbd>⌘N</kbd></td><td>末尾に新規ノート</td></tr><tr><td><kbd>⌘[</kbd> / <kbd>⌘]</kbd></td><td>前 / 次のノート</td></tr><tr><td><kbd>⌘1</kbd>–<kbd>⌘9</kbd></td><td>1〜9 番目のノートへ移動</td></tr><tr><td><kbd>⌘D</kbd></td><td>現在のノートを削除</td></tr><tr><td><kbd>⌘U</kbd></td><td>直前に削除したノートを復元（12 秒以内）</td></tr><tr class="group"><td colspan="2">検索とコマンド</td></tr><tr><td><kbd>⌘⇧F</kbd></td><td>ノートを検索</td></tr><tr><td><kbd>⌘⇧P</kbd></td><td>コマンドパレット</td></tr><tr class="group"><td colspan="2">編集</td></tr><tr><td><kbd>⌘/</kbd></td><td>行をコメント / 解除</td></tr><tr><td><kbd>⌘O</kbd> / <kbd>⌘⇧O</kbd></td><td>現在の行またはブロックの下 / 上に空行を追加</td></tr><tr><td><kbd>⌘K</kbd></td><td>現在のブロックの種類を変更</td></tr><tr><td><kbd>⌘⇧D</kbd></td><td>現在のブロックを削除</td></tr><tr><td><kbd>⌘L</kbd></td><td>コードブロックの言語を選択</td></tr><tr><td><kbd>⌘C</kbd></td><td>未選択時にコードブロック全体をコピー</td></tr><tr><td><kbd>⌘Z</kbd> / <kbd>⌘⇧Z</kbd></td><td>取り消し / やり直し（Vim オフ時）</td></tr></tbody></table>
</section>

<section id="data">
  <h2>データ</h2>
  <p>すべてのデータは Mac の中だけに保存されます。各ノートは UTF-8 の Markdown ファイルです。</p>
  <pre><code>~/Documents/Inkflit/
  notes/       ノートごとに 1 つの .md ファイル
  index.json   ノートの順番と選択中のノート
  backups/     以前のバージョン
  trash/       削除したノート</code></pre>
  <h3>保存</h3>
  <p>入力を止めて 0.5 秒後に保存し、入力中も少なくとも 2 秒ごとに保存します。ノートの切り替え、ウインドウを隠す操作、アプリの終了ではすぐに保存します。保存に失敗するとフッターに表示され、保存に成功するまでアプリを終了できません。</p>
  <h3>バックアップと復元</h3>
  <ul>
    <li>編集中、各ノートの以前のバージョンを最大 5 分に 1 回保存します。保持する数は「設定 → バックアップ」で選べます。</li>
    <li>「以前のバージョンを復元…」と「削除したノートを復元…」は新しいノートを作成し、元のファイルはそのまま残します。</li>
    <li><code>index.json</code> が壊れた場合は、「インデックスを再構築…」でノートファイルから作り直せます。古いインデックスは残ります。</li>
  </ul>
  <p>保存場所を変更すると、保存フォルダ全体を新しい場所にコピーし、元のフォルダは残します。</p>
  <p class="tip">Inkflit にはクラウド同期がありません。ノートのフォルダをご自身のバックアップに含めるか、同期サービスが対象にしているフォルダを選んでください。</p>
</section>

<section id="automation">
  <h2>自動化</h2>
  <p>ほかのアプリや AI エージェントは、ローカルの MCP サーバーまたは <code>inkflit://</code> リンクでノートを読み書きできます。どちらも起動中の Inkflit を経由するので、保存とバックアップは通常どおり行われます。</p>
  <h3>MCP</h3>
  <p>MCP クライアントに Inkflit を追加し、クライアントを再起動します。</p>
  <pre><code># Codex
codex mcp add inkflit -- /Applications/Inkflit.app/Contents/MacOS/Inkflit --mcp

# Claude Code
claude mcp add --transport stdio --scope user inkflit -- /Applications/Inkflit.app/Contents/MacOS/Inkflit --mcp

# そのほかのクライアント
{"mcpServers":{"inkflit":{"command":"/Applications/Inkflit.app/Contents/MacOS/Inkflit","args":["--mcp"]}}}</code></pre>
  <p>ツール：<code>list_notes</code>、<code>search_notes</code>、<code>get_note</code>、<code>create_note</code>、<code>append_note</code>、<code>replace_note</code>、<code>delete_note</code>。</p>
  <ul>
    <li>ノートは <code>index</code>（Inkflit に表示される番号）か、変わらない <code>id</code> で指定します。ノートを追加・削除すると番号は変わります。</li>
    <li>新しいノートは末尾に追加されます。<code>position</code> に <code>"first"</code>、<code>"last"</code>、または数値を指定すると別の位置に置けます。</li>
    <li>削除したノートはゴミ箱に入ります。</li>
  </ul>
  <h3>リンク</h3>
  <pre><code>open 'inkflit://note/append?index=2&amp;content=Remember%20milk'
open 'inkflit://note/search?query=milk'
open 'inkflit://note/get?index=1'</code></pre>
  <p>操作は <code>list</code>、<code>get</code>、<code>search</code>、<code>create</code>、<code>append</code>、<code>replace</code>、<code>delete</code> です。<code>x-success</code> と <code>x-error</code> にコールバック URL を指定すると、結果を JSON で受け取れます。</p>
  <p class="tip">書き込みや削除のリンクはすぐに実行されます。信頼できるリンクだけを開いてください。</p>
</section>

<section id="trouble">
  <h2>トラブルシューティング</h2>
  <h3>ショートカットが反応しない</h3>
  <p>ほかのアプリが同じショートカットを使っている可能性があります。その場合、メニューバーに「設定…（ショートカットを使用できません）」と表示されます。「設定 → 一般」で別のショートカットを選んでください。</p>
  <h3>ログイン時に起動がオンにならない</h3>
  <p>macOS の承認が必要な場合があります。「システム設定 → 一般 → ログイン項目」で Inkflit を許可してください。</p>
  <h3>Inkflit の外でノートが変更された</h3>
  <p>Inkflit の起動中にほかのアプリがノートファイルを変更すると、Inkflit は上書きを拒否します。現在の内容を安全な場所にコピーしてから、Inkflit を再起動してください。</p>
</section>
</template>
<script>
  // The app opens Help.html?lang=<language>&theme=<accent id>.
  const params = new URLSearchParams(location.search);
  const accents = { orange: '#b95c1d', blue: '#2868a2', green: '#387452' };
  if (accents[params.get('theme')]) document.documentElement.style.setProperty('--accent', accents[params.get('theme')]);
  const languages = [...document.querySelectorAll('template[data-lang]')].map(t => t.dataset.lang);
  function pickLanguage() {
    const asked = params.get('lang');
    if (languages.includes(asked)) return asked;
    for (const tag of navigator.languages.map(value => value.toLowerCase())) {
      if (tag.startsWith('zh')) return /hant|tw|hk|mo/.test(tag) ? 'zh-Hant' : 'zh-Hans';
      if (tag.startsWith('ja')) return 'ja';
      if (tag.startsWith('en')) return 'en';
    }
    return 'en';
  }
  const lang = pickLanguage();
  const source = document.querySelector(`template[data-lang="${lang}"]`).content;
  const labels = JSON.parse(source.querySelector('script[type="application/json"]').textContent);
  document.documentElement.lang = lang;
  document.title = labels.title;
  document.getElementById('title').textContent = labels.title;
  document.getElementById('tagline').textContent = labels.tagline;
  document.getElementById('brand-label').textContent = labels.label;
  const q = document.getElementById('q');
  q.placeholder = labels.search;
  document.getElementById('empty').textContent = labels.empty;
  const content = document.getElementById('content');
  for (const section of source.querySelectorAll('section')) content.append(section.cloneNode(true));

  // Outline icons, 24px grid, bundled for offline use.
  const icons = {
    mark: '<path d="M7 3.5h10a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-13a2 2 0 0 1 2-2Z"/><path d="M8.5 9h7M8.5 12.5h7M8.5 16h4"/>',
    start: '<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"/>',
    notes: '<path d="M8 3h9a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H8"/><path d="M5 6h9a2 2 0 0 1 2 2v13H7a2 2 0 0 1-2-2Z"/>',
    palette: '<circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/>',
    writing: '<path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16Z"/><path d="m13.5 6.5 4 4"/>',
    blocks: '<rect x="3" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.5"/><path d="M17.25 14v6.5M14 17.25h6.5"/>',
    code: '<path d="m8 8-4 4 4 4M16 8l4 4-4 4M13.5 5l-3 14"/>',
    vim: '<path d="m4 5 4 14 4-14m1 14h7M13 5h7m-3.5 0v14"/>',
    settings: '<circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M4.6 4.6l2.1 2.1M17.3 17.3l2.1 2.1M2.5 12h3M18.5 12h3M4.6 19.4l2.1-2.1M17.3 6.7l2.1-2.1"/>',
    shortcuts: '<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M6 9h.01M10 9h.01M14 9h.01M18 9h.01M6 13h.01M10 13h.01M14 13h.01M18 13h.01M8 16h8"/>',
    data: '<ellipse cx="12" cy="5.5" rx="8" ry="3"/><path d="M4 5.5v6.5c0 1.7 3.6 3 8 3s8-1.3 8-3V5.5M4 12v6.5c0 1.7 3.6 3 8 3s8-1.3 8-3V12"/>',
    automation: '<path d="M13 2 4 14h7l-1 8 9-12h-7Z"/>',
    trouble: '<circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 0 1 5 0c0 2-2.5 2-2.5 4m0 3.5h.01"/>',
  };
  function icon(name) {
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    for (const [key, value] of Object.entries({ viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', 'stroke-width': '1.8', 'stroke-linecap': 'round', 'stroke-linejoin': 'round', 'aria-hidden': 'true' })) svg.setAttribute(key, value);
    svg.innerHTML = icons[name] || icons.start;
    return svg;
  }
  for (const mark of document.querySelectorAll('[data-mark]')) mark.append(icon('mark'));

  const sections = [...content.querySelectorAll('section')];
  const toc = document.getElementById('toc');
  for (const section of sections) {
    section.querySelector('h2').prepend(icon(section.id));
    const link = document.createElement('a');
    link.href = `#${section.id}`;
    link.append(icon(section.id), document.createTextNode(section.querySelector('h2').textContent));
    const item = document.createElement('li'); item.append(link); toc.append(item);
  }
  const links = [...toc.querySelectorAll('a')];
  function filter() {
    const term = q.value.trim().toLowerCase();
    let shown = 0;
    sections.forEach((section, index) => {
      const hit = !term || section.textContent.toLowerCase().includes(term);
      section.classList.toggle('hidden', !hit);
      links[index].parentElement.style.display = hit ? '' : 'none';
      shown += hit ? 1 : 0;
    });
    document.getElementById('empty').style.display = shown ? 'none' : 'block';
  }
  function mark() {
    let current = sections.find(section => !section.classList.contains('hidden')) || sections[0];
    for (const section of sections) if (!section.classList.contains('hidden') && section.getBoundingClientRect().top < 120) current = section;
    links.forEach(link => link.classList.toggle('on', link.getAttribute('href') === `#${current.id}`));
  }
  function jump() { const target = location.hash && document.getElementById(location.hash.slice(1)); if (target) target.scrollIntoView(); mark(); }
  q.addEventListener('input', () => { filter(); mark(); });
  addEventListener('scroll', mark, { passive: true });
  addEventListener('hashchange', jump);
  addEventListener('keydown', event => {
    if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === 'f') { event.preventDefault(); q.focus(); q.select(); }
    if (event.key === 'Escape' && document.activeElement === q) { q.value = ''; filter(); mark(); }
  });
  requestAnimationFrame(jump);
</script>
</body>
