  #q { width: 100%; padding: 6px 10px; margin-bottom: 14px; font: inherit; font-size: 13px; color: var(--ui-ink); background: var(--ui-paper); border: 1px solid var(--ui-border); border-radius: 7px; }
  #q::placeholder { color: var(--ui-muted); }
  #q:focus { caret-color: var(--ui-cursor); outline: 2px solid color-mix(in srgb, var(--ui-accent) 45%, transparent); outline-offset: -1px; }
  nav ol { list-style: none; margin: 0; padding: 0; }
  nav li a { display: flex; align-items: center; gap: 9px; padding: 6px 9px; border-radius: 6px; color: var(--ui-ink); font-size: 13.5px; }
  nav li a svg { width: 16px; height: 16px; flex: none; color: var(--ui-muted); }
  nav li a:hover { background: var(--ui-hover); text-decoration: none; }
  nav li a.on { background: var(--ui-selection); }
  nav li a:focus-visible { outline: 2px solid var(--ui-accent); outline-offset: -2px; }
  nav li a.on svg { color: var(--ui-accent); }
  .empty { display: none; color: var(--ui-muted); padding: 12px 9px; font-size: 13px; }

  main { flex: 1; min-width: 0; max-width: 820px; padding: 36px 48px 80px; }
  header.hero { display: flex; gap: 18px; align-items: center; padding-bottom: 24px; border-bottom: 1px solid var(--ui-border); }
  header.hero .app-icon { width: 64px; height: 64px; }
  header.hero h1 { margin: 0; font-size: 26px; letter-spacing: -0.01em; }
  header.hero p { margin: 4px 0 0; color: var(--ui-muted); }
  section { padding-top: 28px; }
  section.hidden { display: none; }
  section > h2 { display: flex; align-items: center; gap: 9px; font-size: 20px; line-height: 1.4; margin: 12px 0 14px; padding-bottom: 10px; border-bottom: 1px solid var(--ui-border); }
  section > h2 svg { width: 20px; height: 20px; flex: none; color: var(--ui-accent); }
  h3 { font-size: 15.5px; margin: 26px 0 6px; }
  h4 { font-size: 14.5px; margin: 20px 0 4px; }
  p, li { max-width: 68ch; }
  p { margin: 10px 0; }
  ul, ol { padding-left: 22px; }
  li + li { margin-top: 6px; }
  .lead { max-width: none; padding: 14px 16px; background: var(--ui-bar); border: 1px solid var(--ui-border); border-radius: 9px; }
  .tip { max-width: none; padding: 10px 14px; border-left: 3px solid var(--ui-accent); background: var(--ui-active); border-radius: 0 8px 8px 0; }
  table { border-collapse: collapse; width: 100%; margin: 14px 0; font-size: 14px; }
  th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--ui-border); vertical-align: top; }
  th { color: var(--ui-muted); font-weight: 600; }

<section id="start">
  <h2>Getting started</h2>
  <p class="lead">Inkflit lives in the menu bar. Call it up with one shortcut, jot something down, and it gets out of the way. Notes save themselves as you type.</p>
  <ol>
    <li><b>Show the window</b> with the global shortcut, <kbd>⌃⌥Space</kbd> by default (you can change it in <b>Settings → General</b>), or click the menu bar icon and choose <b>Open Inkflit</b>.</li>
    <li><b>Write.</b> Changes are saved automatically; there is no Save button.</li>
    <li><b>Hide an unpinned window</b> with the same shortcut or <kbd>Esc</kbd> (by default, twice in Vim Normal mode). Switching to another app also hides it.</li>
  </ol>
  <p>Use the toolbar pin, <kbd>⌘⇧T</kbd>, or the command palette to cycle through <b>Normal</b>, <b>Keep Open</b>, and <b>Always on Top</b>. Both pin modes keep the window open when you press <kbd>Esc</kbd> or switch apps. Always on Top floats above other windows. Press <kbd>⌘W</kbd> to close it.</p>
  <h3>Where the window appears</h3>
  <p>The window opens on the display under the pointer, on the Space you are using now, so it never pulls you back to another desktop. It keeps the position you gave it, also after a restart. Opening Settings keeps the note visible for a live preview.</p>
  <p>Drag the toolbar's empty middle to move the window, and drag an edge to resize it. Restore the default size under <b>Settings → Appearance → Window size → Reset</b>.</p>
  <h3>Guide notes</h3>
  <ul>
    <li>The first launch creates seven guide notes in your language. Edit or delete them freely.</li>
    <li><b>Settings → About → Restore Guide Notes</b> adds a fresh set at the front and opens the welcome note.</li>
  </ul>
</section>

<section id="notes">
  <h2>Notes</h2>
  <p>Notes are arranged like pages in a notebook. The toolbar shows your position, such as <code>2 / 5</code>. New notes from the toolbar or keyboard go at the end.</p>
  <ul>
    <li><b>New note:</b> <kbd>⌘N</kbd> or the <b>+</b> button.</li>
    <li><b>Turn pages:</b> <kbd>⌘[</kbd> and <kbd>⌘]</kbd>, or the arrows in the toolbar. <kbd>⌘⇧[</kbd> and <kbd>⌘⇧]</kbd> jump to the first and the last note.</li>
    <li><b>Jump to a page:</b> <kbd>⌘1</kbd> to <kbd>⌘9</kbd> open notes 1 to 9.</li>
  </ul>
  <p>Pages slide horizontally. Each note keeps its cursor and scroll position while Inkflit is running. Small arrows near the right edge show that more content is above or below.</p>
  <p>The page gives a small nudge when you use the shortcut to turn past the first or last note. Page motion follows the system’s Reduce Motion setting.</p>
  <p>The footer shows when the current note was created, in your local time. Notes created before this was recorded show no date.</p>
  <h3>Deleting and undoing</h3>
  <p><kbd>⌘D</kbd> deletes the current note right away. A notice stays for 12 seconds; press <kbd>⌘U</kbd> or click it to bring the note back.</p>
  <p class="tip">Deleted notes go to the Trash folder. <b>Settings → Data → Restore deleted note…</b> brings a Trash item back as a new note.</p>
</section>

<section id="palette">
  <h2>Search and commands</h2>
  <p>Two panels share the same keys: type to filter, <kbd>↑</kbd> <kbd>↓</kbd> to choose, <kbd>Return</kbd> to open, <kbd>Esc</kbd> to close.</p>
  <h3>Search notes <kbd>⌘⇧F</kbd></h3>
  <ul>
    <li>Searches the text of all current notes, one match per note.</li>
    <li>With an empty field it lists every note, so it works as a table of contents.</li>
    <li>Backups and the Trash are not searched.</li>
  </ul>
  <h3>Command palette <kbd>⌘⇧P</kbd></h3>
  <p>Run note actions and change settings from the palette. Commands you have used are ordered by last use, most recent first.</p>
  <p>Search for <code>format</code> and select <b>Format Note</b> to tidy expression spacing in math blocks and format JavaScript, TypeScript, JSON, HTML, CSS, Markdown, and YAML code blocks in the current note. Code uses your Code indentation setting. The whole operation can be undone in one step.</p>
  <ul>
    <li>Commands marked <b>›</b> open a second list, such as accent colors or languages. The current value has a <b>✓</b>.</li>
    <li>Open the setting first, then type an exact value for opacity, blur, texture strength or backup count, such as <code>75%</code> for opacity.</li>
    <li><kbd>Esc</kbd>, or <kbd>⌫</kbd> in an empty field, goes back one level with the previous row still selected.</li>
    <li>Typing on the first level also finds second-level options, so <code>english</code> finds <b>Language: English</b>.</li>
  </ul>
  <p>Press either shortcut again to close its panel, or the other shortcut to switch panels.</p>
  <p><a href="#command-keywords">Command keywords</a></p>
</section>

  <p>Some commands appear only when they apply. For example, Choose code language appears when the cursor is in code, and Texture strength appears after you choose a textured background.</p>

<section id="writing">
  <h2>Writing</h2>
  <p>Notes are plain Markdown. Headings, lists, emphasis and links are styled as you type, and the source stays readable in any editor.</p>
  <ul>
    <li><b>Checkboxes:</b> <code>- [ ]</code> and <code>- [x]</code> can be clicked to tick them off.</li>
    <li><b>Comments:</b> a line starting with <code>//</code> is a comment. <kbd>⌘/</kbd> toggles it for the current or selected lines.</li>
    <li><b>Code fences:</b> <code>```js</code> fences are highlighted by language.</li>
  </ul>
  <p>While you move through a long note, three lines stay visible above and below the cursor.</p>
  <h3>Snippets</h3>
  <p>Type <code>@</code> and a word to insert a value.</p>
  <ul>
    <li><kbd>Return</kbd> inserts the first format, <kbd>↑</kbd> <kbd>↓</kbd> pick another, <kbd>Esc</kbd> closes the list.</li>
    <li>A word with several formats lists them all: <code>@date</code> lists every date format.</li>
    <li>Part of a word, or letters in order, also work: <code>@wk</code> finds <code>@week</code>.</li>
    <li><code>@</code> alone lists one row per word.</li>
    <li>The preview is exactly what will be inserted; clock values stay up to date.</li>
  </ul>
  <table>
    <thead><tr><th>Word</th><th>Formats</th></tr></thead>
    <tbody>
      <tr><td><code>@date</code></td><td>2026-11-18, 2026/11/18, 20261118, long and full dates in your language</td></tr>
      <tr><td><code>@time</code></td><td>14:05, 14:05:30 (<code>@timesec</code>), 2:05 PM</td></tr>
      <tr><td><code>@now</code></td><td>Date and time (<code>@datetime</code>), with seconds (<code>@datetimesec</code>), ISO 8601 (<code>@iso</code>), long form</td></tr>
      <tr><td><code>@year @month @day</code></td><td>2026; 2026-11, 11, November; 18, November 18</td></tr>
      <tr><td><code>@week</code></td><td>2026-W47, W47, weekday (<code>@weekday</code>), short weekday</td></tr>
      <tr><td><code>@timestamp</code></td><td>Unix seconds (<code>@unix</code>), milliseconds (<code>@ms</code>)</td></tr>
      <tr><td><code>@uuid</code></td><td>Random UUID: lowercase, uppercase, without hyphens</td></tr>
      <tr><td><code>@ip</code></td><td>Public address, IPv4 (<code>@ipv4</code>), IPv6 (<code>@ipv6</code>), local network (<code>@localip</code>)</td></tr>
      <tr><td><code>@mac</code></td><td>MAC address of the network interface</td></tr>
      <tr><td><code>@host</code></td><td>Host name (<code>@hostname</code>), computer name (<code>@computer</code>), your account (<code>@whoami</code>)</td></tr>
      <tr><td><code>@fn @unit @cur @const</code></td><td>Only in math blocks: functions, units, currencies and constants. See <a href="#math">Math</a></td></tr>
    </tbody>
  </table>
  <ul>
    <li>Words in parentheses insert that one format directly, such as <code>@timesec</code>.</li>
    <li>The public IP comes from ipify when the list shows it or you insert it; nothing else is sent.</li>
    <li>Snippets do not appear inside code or right after a letter, so e-mail addresses are left alone.</li>
  </ul>
  <h4>Your own snippets</h4>
  <p>Add your own in <b>Settings → Snippets</b> or with <b>Manage snippets</b> in the command palette. They are saved in <code>snippets.json</code> in the notes folder, so they move and back up with your notes.</p>
  <p>Use <b>Snippet availability</b> in Settings → Snippets to turn groups or individual built-in snippets on and off. Toggle <b>Custom snippets</b> there to hide all your own snippets, or uncheck <b>Enabled</b> beside a single row. Disabled snippets are hidden from suggestions and the placeholder picker. Placeholders already in a template still expand.</p>
  <ul>
    <li><b>One trigger, several rows:</b> like macOS text replacements. Put a few addresses under <code>addr</code>; <code>@addr</code> lists them all and inserts the first by default.</li>
    <li><b>Same name as a built-in word:</b> your row comes first, so your own <code>date</code> becomes the default.</li>
    <li><b>Content can span lines.</b></li>
  </ul>
  <h4>Placeholders</h4>
  <table>
    <thead><tr><th>Write</th><th>Inserts</th></tr></thead>
    <tbody>
      <tr><td><code>{date}</code></td><td>The word’s default format</td></tr>
      <tr><td><code>{date#2}</code></td><td>Its second format</td></tr>
      <tr><td><code>{ipv4}</code></td><td>The format with that alias</td></tr>
      <tr><td><code>{cursor}</code></td><td>A caret stop; see below</td></tr>
      <tr><td><code>{cursor:name}</code></td><td>A caret stop that starts with “name” selected</td></tr>
      <tr><td><code>{{</code></td><td>A literal <code>{</code></td></tr>
    </tbody>
  </table>
  <p><b>Insert placeholder</b> lists them all with examples.</p>
  <h4>Caret stops</h4>
  <pre><code>Dear {cursor:name},
{cursor}
{date}</code></pre>
  <ol>
    <li>After inserting, “name” is selected; type to replace it.</li>
    <li>Press <kbd>Tab</kbd> to go to the empty line.</li>
    <li>Press <kbd>⇧Tab</kbd> to go back to the name; what you typed is selected again.</li>
  </ol>
  <ul>
    <li><b>Marked:</b> the stop you are filling has a strong tint and a solid underline; the others a light tint and a dotted underline, and an empty one is a thin bar. Changed or not, until the stops end.</li>
    <li><b>Tab is for stops:</b> while they are active, <kbd>Tab</kbd> and <kbd>⇧Tab</kbd> only move between stops, also in a checklist.</li>
    <li><b>Ending:</b> reach the last stop, move the caret out of them, or press <kbd>Esc</kbd>. Then <kbd>Tab</kbd> indents again.</li>
    <li><b>That <kbd>Esc</kbd></b> does not hide the window; in Vim mode it also returns to Normal mode.</li>
    <li><b>Last stop not at the end:</b> one more <kbd>Tab</kbd> lands at the end of the snippet.</li>
  </ul>
  <h4>Good to know</h4>
  <ul>
    <li>Later lines of a multi-line snippet follow the indentation of the line it goes on.</li>
    <li>A snippet with stops inserted inside another one’s stop ends the outer stops.</li>
    <li>A snippet whose value takes a moment (an IP address): if you move the caret meanwhile, it is not pulled back.</li>
  </ul>
</section>

<section id="blocks">
  <h2>Feature blocks</h2>
  <p>A block turns part of a note into a small tool: a checklist, a calculator, a running total or a code snippet. A note can hold any number of blocks.</p>
  <h3>Adding and changing blocks</h3>
  <ol>
    <li>On an empty line, type <code>/</code>. (In Vim mode, enter insert mode first.)</li>
    <li>Pick a block with the arrow keys and <kbd>Return</kbd>, or click it.</li>
    <li>Press <kbd>Return</kbd> on the last line to add a line inside the block.</li>
  </ol>
  <ul>
    <li>Block header or <kbd>⌘K</kbd>: change the type, turn it back into plain text, or delete it.</li>
    <li><kbd>⌘⇧D</kbd>: delete the current block.</li>
    <li><kbd>⌘O</kbd> / <kbd>⌘⇧O</kbd>: add an empty line below / above the current line or block.</li>
  </ul>
  <p>All of these can be undone.</p>
  <h3>Block types</h3>
  <table>
    <thead><tr><th>Block</th><th>What it does</th></tr></thead>
    <tbody>
      <tr><td>Checklist</td><td>Click a checkbox, type <code>/x</code> at the end of an item, or press <kbd>⌘↩</kbd> anywhere in the item. <kbd>⌘↩</kbd> also works on Markdown tasks. <kbd>Tab</kbd> and <kbd>⇧Tab</kbd> indent and outdent; sub-items move with their parent.</td></tr>
      <tr><td>Math</td><td>End a line with <code>=</code> to calculate, with variables, functions, units and currencies. See <a href="#math">Math</a>.</td></tr>
      <tr><td>Sum / Average</td><td>Adds up or averages the numbers in the block, without evaluating expressions.<br>Only standalone numbers count: <code>1.2.3.4</code>, IP addresses, dates such as <code>2026-11-19</code>, times such as <code>14:05</code>, and numbering at the start of a line such as <code>1.</code> or <code>1.2.</code> do not.</td></tr>
      <tr><td>Count</td><td>Counts items, words and characters.</td></tr>
      <tr><td>Code</td><td>Highlights code by language. See <a href="#code">Code</a>.</td></tr>
    </tbody>
  </table>
  <p>Lines starting with <code>//</code> are left out of totals and counts.</p>
  <h3>Whole notes</h3>
  <p>Make the first line just a keyword and the whole note becomes that type, with no end marker. When it takes effect, the keyword is shown in the accent colour.</p>
  <table>
    <thead><tr><th>First line</th><th>Whole note</th></tr></thead>
    <tbody>
      <tr><td><code>list</code></td><td>Checklist</td></tr>
      <tr><td><code>math</code></td><td>Math; see <a href="#math">Math</a></td></tr>
      <tr><td><code>sum</code> / <code>avg</code></td><td>Sum / average</td></tr>
      <tr><td><code>count</code></td><td>Count</td></tr>
      <tr><td><code>code js</code></td><td>Code; <code>js</code> is the language and is optional</td></tr>
    </tbody>
  </table>
  <ul>
    <li>A colon and a title may follow: <code>sum: Monthly spending</code>, <code>code py: Backup script</code>.</li>
    <li>Case does not matter.</li>
    <li>Other blocks in the note keep their own type; in a whole-note code mode everything is code.</li>
  </ul>
</section>

<section id="math">
  <h2>Math</h2>
  <p class="lead">A math block is scratch paper that calculates: one expression per line, end it with <code>=</code>, and the result appears after it. Define variables, call functions, and convert units and currencies.</p>
  <h3>Start a math block</h3>
  <ul>
    <li><b>Block:</b> on an empty line type <code>/</code> and choose <b>Math</b>. The block starts with <code>:::inkflit math</code> and ends with <code>:::end</code>.</li>
    <li><b>Whole note:</b> make the first line just <code>math</code>, optionally with a title such as <code>math: Trip budget</code>.
      <ul>
        <li>Everything to the end of the note is calculated; there is no end marker.</li>
        <li>Other blocks and code fences in the note are left out.</li>
        <li>To calculate only part of a note, use a block or <code>```math</code>.</li>
      </ul>
    </li>
    <li><b>Markdown fence:</b> start with <code>```math</code> and end with <code>```</code>.</li>
  </ul>
  <pre><code>math: Trip budget
flights: 2400
hotel: 380 * 4
flights + hotel =
ans / 2 =
// split between two</code></pre>
  <h3>Writing lines</h3>
  <table>
    <thead><tr><th>Line</th><th>What it does</th></tr></thead>
    <tbody>
      <tr><td><code>name: expression</code></td><td>Defines a variable without a result.<br>Names may use any script: <code>単価: 80</code>.<br>Defining it again replaces the value.</td></tr>
      <tr><td><code>expression =</code></td><td>Calculates and shows the result at the end of the line. The result is not written into the note and is not copied with it.</td></tr>
      <tr><td><code>ans</code></td><td>The result of the previous <code>=</code> line.</td></tr>
      <tr><td><code>// …</code></td><td>A comment; not calculated.</td></tr>
      <tr><td>Anything else</td><td>Plain text, kept as written.</td></tr>
    </tbody>
  </table>
  <ul>
    <li>A wrong or unfinished expression shows no result and no error; the result appears once it is fixed.</li>
    <li>A definition can hold a conversion: <code>budget: 1000 USD to EUR</code>. Then <code>budget / 2 =</code> gives a plain number without the code.</li>
  </ul>
  <h3>Numbers and operators</h3>
  <table>
    <thead><tr><th>Write</th><th>Meaning</th></tr></thead>
    <tbody>
      <tr><td><code>+ - * /</code></td><td>Add, subtract, multiply, divide. <code>×</code> and <code>÷</code> work too.</td></tr>
      <tr><td><code>^</code></td><td>Power, such as <code>2^10</code> = 1,024. The exponent must be a number between -100 and 100.</td></tr>
      <tr><td><code>( )</code></td><td>Brackets. A number right before a bracket multiplies: <code>2(3+4)</code> = 14.</td></tr>
      <tr><td><code>%</code></td><td>Percent: <code>200 - 10%</code> = 180, and <code>price + 25%</code> adds 25% of <code>price</code>. <code>%</code> is not modulo.</td></tr>
      <tr><td><code>of</code></td><td>Multiplies, for percentages: <code>50% of 200</code> = 100.</td></tr>
      <tr><td><code>to</code> / <code>in</code></td><td>Converts units or currencies; see below.</td></tr>
      <tr><td><code>pi e tau phi</code></td><td>The constants π, e, τ and φ.</td></tr>
    </tbody>
  </table>
  <ul>
    <li><b>Numbers:</b> whole, decimal or scientific (<code>1.5e3</code>); no thousands separators.</li>
    <li><b>Results:</b> up to 10 significant digits, shown like <code>1,234.5</code>.</li>
  </ul>
  <h3>Functions</h3>
  <table>
    <thead><tr><th>Function</th><th>What it does</th><th>Example</th></tr></thead>
    <tbody>
      <tr><td><code>sqrt(x)</code></td><td>Square root</td><td><code>sqrt(16) = 4</code></td></tr>
      <tr><td><code>abs(x)</code></td><td>Absolute value</td><td><code>abs(-3) = 3</code></td></tr>
      <tr><td><code>round(x)<br><code>round(x, n)</code></code></td><td>Round; <code>n</code> keeps that many decimals</td><td><code>round(2.567, 2) = 2.57</code></td></tr>
      <tr><td><code>floor(x)</code></td><td>Round down</td><td><code>floor(2.7) = 2</code></td></tr>
      <tr><td><code>ceil(x)</code></td><td>Round up</td><td><code>ceil(2.1) = 3</code></td></tr>
      <tr><td><code>sin(x)</code></td><td>Sine. Radians unless you add <code>deg</code></td><td><code>sin(30 deg) = 0.5</code></td></tr>
      <tr><td><code>cos(x)</code></td><td>Cosine</td><td><code>cos(0) = 1</code></td></tr>
      <tr><td><code>tan(x)</code></td><td>Tangent</td><td><code>tan(45 deg) = 1</code></td></tr>
      <tr><td><code>log(x)<br><code>log(x, b)</code></code></td><td>Natural logarithm; <code>b</code> sets the base</td><td><code>log(100, 10) = 2</code></td></tr>
      <tr><td><code>log10(x)</code></td><td>Base-10 logarithm</td><td><code>log10(1000) = 3</code></td></tr>
      <tr><td><code>exp(x)</code></td><td>e to the power</td><td><code>exp(1) = 2.718281828</code></td></tr>
      <tr><td><code>min(a, b, …)</code></td><td>Smallest</td><td><code>min(3, 1, 2) = 1</code></td></tr>
      <tr><td><code>max(a, b, …)</code></td><td>Largest</td><td><code>max(3, 1, 2) = 3</code></td></tr>
    </tbody>
  </table>
  <h3>Units</h3>
  <p>Put a unit after a number and convert with <code>to</code>.</p>
  <table>
    <thead><tr><th>Expression</th><th>Result</th><th>Note</th></tr></thead>
    <tbody>
      <tr><td><code>10 km to mi =</code></td><td><code>6.213711922 mi</code></td><td>Convert with <code>to</code></td></tr>
      <tr><td><code>2 h + 15 min =</code></td><td><code>2.25 h</code></td><td>Without <code>to</code>: the first unit</td></tr>
      <tr><td><code>2 m * 3 m =</code></td><td><code>6 m^2</code></td><td>Units multiply</td></tr>
      <tr><td><code>50 km / 2 h to km/h =</code></td><td><code>25 km / h</code></td><td>Units divide, then convert</td></tr>
      <tr><td><code>0 degC to degF =</code></td><td><code>32 degF</code></td><td>Temperature</td></tr>
    </tbody>
  </table>
  <table>
    <thead><tr><th>Kind</th><th>Common units</th></tr></thead>
    <tbody>
      <tr><td>Length</td><td><code>m</code> <code>km</code> <code>cm</code> <code>mm</code> <code>um</code> <code>nm</code> <code>in</code> <code>ft</code> <code>yd</code> <code>mi</code> <code>nmi</code> <code>mil</code> <code>angstrom</code></td></tr>
      <tr><td>Area</td><td><code>m2</code> <code>km2</code> <code>cm2</code> <code>sqin</code> <code>sqft</code> <code>sqyd</code> <code>sqmi</code> <code>acre</code> <code>hectare</code></td></tr>
      <tr><td>Volume</td><td><code>L</code> <code>mL</code> <code>m3</code> <code>cc</code> <code>cuin</code> <code>cuft</code> <code>teaspoon</code> <code>tablespoon</code> <code>cup</code> <code>floz</code> <code>pint</code> <code>quart</code> <code>gallon</code> <code>oilbarrel</code></td></tr>
      <tr><td>Mass</td><td><code>mg</code> <code>g</code> <code>kg</code> <code>t</code> <code>ton</code> <code>oz</code> <code>lb</code> <code>stone</code> <code>grain</code></td></tr>
      <tr><td><a href="#time-units">Time</a></td><td><code>ms</code> <code>s</code> <code>min</code> <code>h</code> <code>day</code> <code>week</code> <code>month</code> <code>year</code></td></tr>
      <tr><td>Speed</td><td><code>m/s</code> <code>km/h</code> <code>mph</code></td></tr>
      <tr><td>Temperature</td><td><code>degC</code> <code>degF</code> <code>K</code></td></tr>
      <tr><td><a href="#angle-units">Angle</a></td><td><code>deg</code> <code>rad</code> <code>grad</code> <code>arcmin</code> <code>arcsec</code></td></tr>
      <tr><td>Force</td><td><code>N</code> <code>kN</code> <code>kgf</code> <code>lbf</code></td></tr>
      <tr><td>Energy</td><td><code>J</code> <code>kJ</code> <code>Wh</code> <code>kWh</code> <code>BTU</code> <code>eV</code></td></tr>
      <tr><td>Power</td><td><code>W</code> <code>kW</code> <code>hp</code></td></tr>
      <tr><td>Pressure</td><td><code>Pa</code> <code>kPa</code> <code>MPa</code> <code>bar</code> <code>atm</code> <code>psi</code> <code>mmHg</code></td></tr>
      <tr><td>Electric</td><td><code>A</code> <code>mA</code> <code>V</code> <code>kV</code> <code>ohm</code> <code>C</code> <code>Ah</code> <code>mAh</code> <code>F</code> <code>H</code> <code>S</code> <code>Wb</code> <code>T</code></td></tr>
      <tr><td>Data</td><td><code>b</code> <code>B</code> <code>kB</code> <code>MB</code> <code>GB</code> <code>TB</code> <code>KiB</code> <code>MiB</code> <code>GiB</code> <code>TiB</code></td></tr>
      <tr><td>Frequency</td><td><code>Hz</code> <code>kHz</code> <code>MHz</code> <code>GHz</code></td></tr>
      <tr><td>Other</td><td><code>mol</code> <code>cd</code></td></tr>
    </tbody>
  </table>
  <ul>
    <li>Metric units take prefixes such as <code>k</code> <code>M</code> <code>G</code> <code>m</code> <code>u</code>: <code>mg</code>, <code>kN</code>, <code>GHz</code>.</li>
    <li>Every other built-in mathjs unit works too, with full names and plurals: <code>meters</code>, <code>inches</code>.</li>
    <li>Units are case-sensitive: <code>t</code> is a tonne and <code>T</code> a tesla; <code>b</code> is a bit and <code>B</code> a byte. <code>MB</code> is 1000² bytes, <code>MiB</code> is 1024² bytes.</li>
    <li><code>min</code> on its own is minutes; <code>min(…)</code> is the function. <code>in</code> right after a number is inches (<code>5 in to cm</code>); elsewhere it converts (<code>10 km in mi</code>).</li>
    <li>A variable wins over a unit with the same name.</li>
  </ul>
  <h4 id="time-units">Time units</h4>
  <table>
    <thead><tr><th>Unit (symbol)</th><th>Formula input</th><th>Conversion</th></tr></thead>
    <tbody>
      <tr><td>Millisecond (ms)</td><td><code>ms</code> / <code>millisecond</code></td><td>1 ms = 0.001 s</td></tr>
      <tr><td>Second (s)</td><td><code>s</code> / <code>second</code></td><td>1 s = 1000 ms</td></tr>
      <tr><td>Minute (min)</td><td><code>min</code> / <code>minute</code></td><td>1 min = 60 s</td></tr>
      <tr><td>Hour (h)</td><td><code>h</code> / <code>hour</code></td><td>1 h = 60 min</td></tr>
      <tr><td>Day (d)</td><td><code>day</code></td><td>1 day = 24 h</td></tr>
      <tr><td>Week</td><td><code>week</code></td><td>1 week = 7 day</td></tr>
      <tr><td>Month</td><td><code>month</code></td><td>1 month = 30.4375 day</td></tr>
      <tr><td>Year</td><td><code>year</code></td><td>1 year = 365.25 day = 12 month</td></tr>
    </tbody>
  </table>
  <p>Inkflit treats months and years as fixed durations when converting units. It does not count calendar days between dates.</p>
  <p>You can write the full names <code>minute</code> and <code>second</code> in formulas. <code>1 minute to s =</code> gives <code>60 s</code>, and <code>1 second to ms =</code> gives <code>1000 ms</code>. In the snippet picker, type <code>@sec</code> and choose <code>@second</code> to insert <code>s</code>. In a formula, write <code>s</code> or <code>second</code>. Inkflit does not recognize <code>sec</code> as a time unit.</p>
  <h4 id="angle-units">Angle units</h4>
  <table>
    <thead><tr><th>Unit (symbol)</th><th>Formula input</th><th>Conversion</th></tr></thead>
    <tbody>
      <tr><td>Degree (°)</td><td><code>deg</code> / <code>degree</code></td><td>1° = π/180 rad</td></tr>
      <tr><td>Radian (rad)</td><td><code>rad</code> / <code>radian</code></td><td>π rad = 180°</td></tr>
      <tr><td>Gradian (gon)</td><td><code>grad</code> / <code>gradian</code></td><td>100 grad = 90°</td></tr>
      <tr><td>Arcminute (′)</td><td><code>arcmin</code> / <code>arcminute</code></td><td>60 arcmin = 1°</td></tr>
      <tr><td>Arcsecond (″)</td><td><code>arcsec</code> / <code>arcsecond</code></td><td>60 arcsec = 1 arcmin = 1/60°</td></tr>
    </tbody>
  </table>
  <p>A full turn is 360° or 2π rad. Use <code>pi</code> in a formula, as in <code>pi rad to deg =</code>, which gives <code>180 deg</code>. Trigonometric functions interpret an input with no unit as radians. Write <code>sin(30 deg) =</code> for 30°, which gives <code>0.5</code>.</p>
  <h3>Currency</h3>
  <ul>
    <li><b>Write:</b> <code>10 USD to EUR =</code>. <code>in</code> works in place of <code>to</code>.</li>
    <li><b>Codes:</b> three uppercase letters. Lowercase <code>usd</code> is not a currency.</li>
    <li><b>One amount per line:</b> <code>10 USD + 5 EUR</code> and <code>price USD to EUR</code> do not work.</li>
  </ul>
  <h4>Rates</h4>
  <ul>
    <li><b>Source:</b> European Central Bank reference rates from Frankfurter, updated once each working day.</li>
    <li><b>Date:</b> results carry the rate date, such as <code>8.62 EUR · 2026-11-18</code>.</li>
    <li><b>Download:</b> while a math block is open, at most once an hour; about 100 seconds after a failure.</li>
    <li><b>Messages:</b> before rates arrive the line shows “Exchange rates loading or unavailable”; a code missing from the table shows “Unsupported currency”.</li>
  </ul>
  <p>These 30 currencies are supported today; Frankfurter decides the list:</p>

    <thead><tr><th>Code</th><th>Currency</th><th>Code</th><th>Currency</th></tr></thead>

      <tr><td><code>HUF</code></td><td>Hungarian Forint</td><td><code>IDR</code></td><td>Indonesian Rupiah</td></tr>
      <tr><td><code>ILS</code></td><td>Israeli New Shekel</td><td><code>INR</code></td><td>Indian Rupee</td></tr>
      <tr><td><code>ISK</code></td><td>Icelandic Króna</td><td><code>JPY</code></td><td>Japanese Yen</td></tr>

      <tr><td><code>MYR</code></td><td>Malaysian Ringgit</td><td><code>NOK</code></td><td>Norwegian Krone</td></tr>
      <tr><td><code>NZD</code></td><td>New Zealand Dollar</td><td><code>PHP</code></td><td>Philippine Peso</td></tr>
      <tr><td><code>PLN</code></td><td>Polish Zloty</td><td><code>RON</code></td><td>Romanian Leu</td></tr>
      <tr><td><code>SEK</code></td><td>Swedish Krona</td><td><code>SGD</code></td><td>Singapore Dollar</td></tr>
      <tr><td><code>THB</code></td><td>Thai Baht</td><td><code>TRY</code></td><td>Turkish Lira</td></tr>

  <p class="tip">Inkflit only downloads public rates; your notes are never sent. When rates are unavailable, the line says so instead of guessing.</p>
  <h3>Insert functions, units, currencies and constants with @</h3>
  <p>In a math block, <code>@</code> offers four additional groups:</p>
  <table>
    <thead><tr><th>Word</th><th>Lists</th></tr></thead>
    <tbody>
      <tr><td><code>@fn</code></td><td>Every function with a description. After inserting <code>sqrt()</code> the caret is inside the brackets; press <kbd>Tab</kbd> after the argument to jump past them.</td></tr>
      <tr><td><code>@unit</code></td><td>The units in the table above, with their kind.</td></tr>
      <tr><td><code>@cur</code></td><td>Every currency with its name and its rate against your language’s currency: USD for English, CNY for Simplified Chinese, HKD for Traditional Chinese, JPY for Japanese.</td></tr>
      <tr><td><code>@const</code></td><td>Mathematical and commonly used scientific constants.</td></tr>
    </tbody>
  </table>
  <ul>
    <li>Each name works on its own: <code>@sqrt</code>, <code>@km</code>, <code>@kilometer</code> and <code>@usd</code> find that row directly.</li>
    <li>A number may come right before <code>@</code>: <code>10@km</code>.</li>
    <li>In a math block, <code>@min</code> lists both the minimum function and <code>@minute</code>, which inserts <code>min</code>. <code>@ms</code> lists the timestamp and <code>@millisecond</code>.</li>
  </ul>
  <h3>Highlighting</h3>
  <p>Math blocks are coloured with the code colors from <b>Settings → Appearance</b>, in both light and dark appearance:</p>
  <table>
    <thead><tr><th>Part</th><th>Example</th></tr></thead>
    <tbody>
      <tr><td>Numbers and constants</td><td><code>80</code> <code>1.5e3</code> <code>pi</code></td></tr>
      <tr><td>Functions</td><td><code>sqrt</code> <code>round</code></td></tr>
      <tr><td>Units</td><td><code>km</code> <code>min</code> <code>degC</code></td></tr>
      <tr><td>Currency codes (use the unit color)</td><td><code>USD</code> <code>EUR</code></td></tr>
      <tr><td>Operators and conversion words</td><td><code>+</code> <code>×</code> <code>%</code> <code>to</code> <code>of</code></td></tr>
      <tr><td>Brackets, commas, colons</td><td><code>(</code> <code>,</code> <code>:</code></td></tr>
      <tr><td>The closing equals sign (uses the operator color)</td><td><code>=</code></td></tr>
      <tr><td>Variable definitions and references</td><td><code>price</code> <code>ans</code></td></tr>
      <tr><td>Comments</td><td><code>// …</code></td></tr>
    </tbody>
  </table>
  <h3>Limits</h3>
  <ul>
    <li>An expression is at most 256 characters.</li>
    <li>No modulo, matrices, strings, comparisons, custom functions, or assignment with <code>=</code> inside an expression.</li>
  </ul>
</section>

<section id="code">
  <h2>Code</h2>
  <ul>
    <li><b>Whole-note code:</b> make the first line <code>code js</code> to highlight and edit the whole note as that language. <kbd>⌘L</kbd> changes the language on the first line.</li>
    <li><kbd>⌘L</kbd> chooses the language of the current code block.</li>
    <li>Brackets and quotes are closed for you. <kbd>Return</kbd> keeps the indentation, <kbd>Tab</kbd> indents and <kbd>⇧Tab</kbd> outdents.</li>
    <li>With nothing selected, <kbd>⌘C</kbd> copies the whole block.</li>
  </ul>
  <p>Choose 2 spaces, 4 spaces, or tabs under <b>Settings → Edit → Code indentation</b>. Choose and preview a theme under <b>Settings → Appearance → Code colors</b>.</p>
  <p>Use <b>Settings → Edit → Show code line numbers</b> to number each code block from 1. Turn on <b>Relative line numbers</b> to show the distance from the cursor within its block. The cursor line and other blocks still show absolute numbers.</p>
</section>

<section id="vim">
  <h2>Vim mode</h2>
  <p>Vim keys are on by default. The editor starts in Normal mode. Press <kbd>i</kbd> to type and <kbd>Esc</kbd> to go back. With the window unpinned, press <kbd>Esc</kbd> twice in Normal mode by default. Turn off <b>Double Esc to hide</b> in Editing settings to hide with one press.</p>
  <ul>
    <li>In normal mode Inkflit switches to an ASCII keyboard layout so commands work, and restores your input method when you start typing or leave the window.</li>
    <li>An open input method candidate is cancelled before <kbd>Esc</kbd> leaves insert mode.</li>
    <li>Undo history is kept per note until you quit.</li>
  </ul>
  <p>This is Vim emulation in the editor, not Neovim, so a vimrc is not loaded.</p>
  <p>Turn it off in <b>Settings → Edit → Vim Mode</b> or from the command palette. Then you type directly. <kbd>Esc</kbd> hides an unpinned window, and <kbd>⌘Z</kbd> / <kbd>⌘⇧Z</kbd> undo and redo.</p>
</section>

<section id="settings">
  <h2>Settings</h2>
  <p>Open Settings with <kbd>⌘,</kbd> or from the menu bar icon. Most options are also in the command palette.</p>
  <table>
    <thead><tr><th>Tab</th><th>Options</th></tr></thead>
    <tbody>
      <tr><td>General</td><td>Launch at login, language, the global shortcut</td></tr>
      <tr><td>Appearance</td><td>Appearance mode, accent color, editor font and size, background texture, texture strength, window size reset, window opacity, background blur, code colors. Hold <kbd>⌥</kbd> while dragging a slider to move in 5% steps.</td></tr>
      <tr><td>Edit</td><td>Vim mode, Double Esc to hide, code indentation, code line numbers, relative line numbers</td></tr>
      <tr><td>Snippets</td><td>Custom snippets and <a href="#writing">snippet availability</a></td></tr>
      <tr><td>Data</td><td>Notes folder, automatic backups, previous versions, Trash, index recovery</td></tr>
      <tr><td>About</td><td>Installed version, Restore Guide Notes, and Open help</td></tr>
    </tbody>
  </table>
  <p>Choose Follow System (the default), Light, or Dark under <b>Appearance</b>. Under <b>Accent color</b>, the multicolor palettes coordinate the toolbar, note, and menus. Choices include Cola Red &amp; Blue, Christmas, Lacquer Red, Midnight Gold, and Peacock &amp; Gold. Each follows your selected appearance mode.</p>
  <h3>Background texture</h3>
  <p>Choose Plain, Xuan paper, Wool felt, Fine sandstone, or Coarse linen under <b>Settings → Appearance → Background texture</b>. <b>Texture strength</b> starts at 50% and controls how visible the texture is. Set it to 0% for a solid background. Use <b>Window opacity</b> to control how much of the desktop shows through. Selecting Plain disables the texture strength slider and preserves its value.</p>
  <p>In the command palette, type <code>background material</code> or search for a surface by name. With a texture selected, open <code>texture strength</code> and enter a value such as <code>37%</code>.</p>
</section>

<section id="shortcuts">
  <h2>Keyboard shortcuts</h2>
  <p>The global shortcut works from any app and can be changed in Settings. The others work while the note window is active.</p>
  <table><thead><tr><th>Keys</th><th>Action</th></tr></thead><tbody><tr class="group"><td colspan="2">Window</td></tr><tr><td><kbd>⌃⌥Space</kbd></td><td>Show or hide Inkflit from any app (default; change it in Settings)</td></tr><tr><td><kbd>Esc</kbd></td><td>Hide an unpinned window. In Vim Normal mode, press twice by default.</td></tr><tr><td><kbd>⌘W</kbd></td><td>Close the note window, including when pinned</td></tr><tr><td><kbd>⌘⇧T</kbd></td><td>Cycle Normal, Keep Open, and Always on Top</td></tr><tr><td><kbd>⌘,</kbd></td><td>Open Settings</td></tr><tr class="group"><td colspan="2">Notes</td></tr><tr><td><kbd>⌘N</kbd></td><td>New note at the end</td></tr><tr><td><kbd>⌘[</kbd> / <kbd>⌘]</kbd></td><td>Previous / next note</td></tr><tr><td><kbd>⌘⇧[</kbd> / <kbd>⌘⇧]</kbd></td><td>First / last note</td></tr><tr><td><kbd>⌘1</kbd>–<kbd>⌘9</kbd></td><td>Jump to note 1–9</td></tr><tr><td><kbd>⌘D</kbd></td><td>Delete the current note</td></tr><tr><td><kbd>⌘U</kbd></td><td>Restore the last deleted note (within 12 seconds)</td></tr><tr class="group"><td colspan="2">Search and commands</td></tr><tr><td><kbd>⌘⇧F</kbd></td><td>Search notes</td></tr><tr><td><kbd>⌘⇧P</kbd></td><td>Command palette</td></tr><tr class="group"><td colspan="2">Editing</td></tr><tr><td><kbd>⌘+</kbd> / <kbd>⌘-</kbd></td><td>Increase / decrease the editor font size (⌘= also increases it)</td></tr><tr><td><kbd>⌘↩</kbd></td><td>Toggle the current checklist or Markdown task</td></tr><tr><td><kbd>⌘/</kbd></td><td>Comment or uncomment lines</td></tr><tr><td><kbd>⌘O</kbd> / <kbd>⌘⇧O</kbd></td><td>New line below / above the current line or block</td></tr><tr><td><kbd>⌘K</kbd></td><td>Change the current block type</td></tr><tr><td><kbd>⌘⇧D</kbd></td><td>Delete the current block</td></tr><tr><td><kbd>⌘L</kbd></td><td>Choose the code block language</td></tr><tr><td><kbd>⌘C</kbd></td><td>Copy the whole code block when nothing is selected</td></tr><tr><td><kbd>==</kbd></td><td>Auto-indent in Vim Normal mode. Code uses language rules and the code indentation setting, and checklists follow their levels.</td></tr><tr><td><kbd>&gt;&gt;</kbd> / <kbd>&lt;&lt;</kbd></td><td>Shift indentation in Vim Normal mode. Checklist descendants move with their parent.</td></tr><tr><td><kbd>⌘Z</kbd> / <kbd>⌘⇧Z</kbd></td><td>Undo / redo (with Vim off)</td></tr></tbody></table>
</section>

<section id="data">
  <h2>Your data</h2>
  <p>Everything stays on your Mac. Each note is a UTF-8 Markdown file:</p>
  <pre><code>~/Documents/Inkflit/
  notes/       one .md file per note
  index.json   order and the selected note
  backups/     previous versions
  trash/       deleted notes</code></pre>
  <h3>Saving</h3>
  <ul>
    <li>Saves half a second after you stop typing, and at least every two seconds while you type.</li>
    <li>Switching notes, hiding the window or quitting saves at once.</li>
    <li>If a save fails, the footer says so, and Inkflit will not quit until a save succeeds.</li>
  </ul>
  <h3>Backups and recovery</h3>
  <ul>
    <li>While you edit, the previous version of a note is kept at most once every five minutes. Choose how many to keep in <b>Settings → Data → Automatic backups</b>.</li>
    <li><b>Restore a previous version…</b> and <b>Restore deleted note…</b> create a new note and leave the original file in place.</li>
    <li>If <code>index.json</code> is damaged, <b>Rebuild index…</b> recreates it from the note files. The old index is kept.</li>
  </ul>
  <p>Choosing another folder copies the whole store there and keeps the original.</p>
  <p class="tip">Inkflit has no cloud sync. Include the notes folder in your own backups, or choose a folder that your sync service already covers.</p>
</section>

<section id="automation">
  <h2>Automation</h2>
  <p>Other apps and AI agents can read and edit notes through a local MCP server or <code>inkflit://</code> links. Both go through the running app, so saving and backups work as usual.</p>
  <h3>MCP</h3>
  <p>Add Inkflit to your MCP client, then restart the client:</p>
  <pre><code># Codex
codex mcp add inkflit -- /Applications/Inkflit.app/Contents/MacOS/Inkflit --mcp

# Claude Code
claude mcp add --transport stdio --scope user inkflit -- /Applications/Inkflit.app/Contents/MacOS/Inkflit --mcp

# Other clients
{"mcpServers":{"inkflit":{"command":"/Applications/Inkflit.app/Contents/MacOS/Inkflit","args":["--mcp"]}}}</code></pre>
  <p>Tools: <code>list_notes</code>, <code>search_notes</code>, <code>get_note</code>, <code>get_current_note</code>, <code>analyze_note</code>, <code>preview_note_format</code>, <code>apply_note_format</code>, <code>create_note</code>, <code>append_note</code>, <code>replace_note</code>, <code>delete_note</code>.</p>
  <p>Use <code>limit</code>, <code>cursor</code>, and <code>include_content: false</code> with <code>list_notes</code> to get pages of short summaries. <code>get_current_note</code> reads the selected note. <code>analyze_note</code> returns calculation and checklist results for an <code>id</code> or <code>index</code>.</p>
  <p>Call <code>preview_note_format</code> with the note <code>id</code> to review the diff. Pass the same <code>id</code> and the returned <code>preview_id</code> to <code>apply_note_format</code>. If the note has changed, request a new preview.</p>
  <ul>
    <li>Pick a note by <code>index</code> (the number shown in Inkflit) or by its stable <code>id</code>. Indices shift when notes are added or deleted.</li>
    <li>New notes go to the end. Pass <code>position</code> as <code>"first"</code>, <code>"last"</code> or a number to place them elsewhere.</li>
    <li>Deleted notes go to the Trash.</li>
  </ul>
  <h3>Links</h3>
  <pre><code>open 'inkflit://note/append?index=2&amp;content=Remember%20milk'
open 'inkflit://note/search?query=milk'
open 'inkflit://note/get?index=1'</code></pre>
  <p>Actions are <code>list</code>, <code>get</code>, <code>search</code>, <code>create</code>, <code>append</code>, <code>replace</code> and <code>delete</code>. Add <code>x-success</code> and <code>x-error</code> callback URLs to receive the result as JSON.</p>
  <p>Use <code>inkflit://note/open?index=2</code> to open a note, or <code>inkflit://settings/appearance</code> and <code>inkflit://settings/snippets</code> to open settings.</p>
  <p class="tip">Links that write or delete run immediately. Only open links you trust.</p>
</section>

<section id="trouble">
  <h2>Troubleshooting</h2>
  <h3>The shortcut does nothing</h3>
  <p>Another app may already use it. The menu bar shows <b>Settings… (shortcut unavailable)</b> in that case; choose a different shortcut in <b>Settings → General</b>.</p>
  <h3>Launch at login stays off</h3>
  <p>macOS may need your approval. Allow Inkflit in <b>System Settings → General → Login Items</b>.</p>
  <h3>Notes changed outside Inkflit</h3>
  <p>If the note files were edited by another app while Inkflit was running, Inkflit refuses to overwrite them. Copy your current text somewhere safe and restart Inkflit.</p>
</section>

<section id="start">
  <h2>开始使用</h2>
  <p class="lead">Inkflit 常驻在菜单栏。按一个快捷键就能叫出来，记完随手收起。输入时自动保存。</p>
  <ol>
    <li><b>打开窗口：</b>按全局快捷键，默认是 <kbd>⌃⌥Space</kbd>（可在“设置 → 通用”中更改），或点菜单栏图标，选择“打开 Inkflit”。</li>
    <li><b>开始写：</b>内容会自动保存，没有保存按钮。</li>
    <li><b>收起窗口：</b>图钉关闭时，再按一次快捷键，或按 <kbd>Esc</kbd>（Vim Normal 模式下默认连按两次）。切换到其他应用时也会自动收起。</li>
  </ol>
  <p>点击工具栏图钉、按 <kbd>⌘⇧T</kbd>，或在命令面板搜索 <code>pin window</code>，可循环切换「普通」「保持打开」「置顶」。后两种状态下，按 <kbd>Esc</kbd> 或切换应用时窗口保持打开。置顶还会让笔记浮在其他窗口上方。按 <kbd>⌘W</kbd> 可收起。</p>
  <h3>窗口出现在哪里</h3>
  <p>窗口会出现在鼠标所在的显示器、你当前所在的桌面上，不会把你拉回别的桌面。窗口位置会被记住，重启后也一样。打开设置时，笔记窗口保持可见，可以实时预览修改。</p>
  <p>拖动工具栏中间的空白处可以移动窗口，拖动边缘可以调整大小。在「设置 → 外观 → 窗口大小」中可恢复默认尺寸。</p>
  <h3>引导笔记</h3>
  <ul>
    <li>第一次启动时，Inkflit 按你的语言创建七篇引导笔记，可以随意修改或删除。</li>
    <li>在「设置 → 关于」选择「重新生成引导笔记」，在最前面放一套新的引导，并打开欢迎页。</li>
  </ul>
</section>

<section id="notes">
  <h2>笔记</h2>
  <p>笔记像本子的书页一样依次排列。工具栏显示当前位置，例如 <code>2 / 5</code>。用工具栏或快捷键新建的笔记会加在最后。</p>
  <ul>
    <li><b>新建：</b><kbd>⌘N</kbd>，或工具栏上的 <b>+</b>。</li>
    <li><b>翻页：</b><kbd>⌘[</kbd> 和 <kbd>⌘]</kbd>，或工具栏上的箭头。<kbd>⌘⇧[</kbd> 和 <kbd>⌘⇧]</kbd> 跳到第一条和最后一条笔记。</li>
    <li><b>跳到某一页：</b><kbd>⌘1</kbd> 到 <kbd>⌘9</kbd> 打开第 1 到第 9 篇。</li>
  </ul>
  <p>翻页时，笔记内容会横向滑动。应用运行期间，每条笔记会保留光标和滚动位置。右侧的小箭头提示上方或下方还有内容。</p>
  <p>到第一条或最后一条后继续用快捷键往外翻，页面会轻晃一下。启用系统的减弱动态效果设置后，翻页和边界动画会关闭。</p>
  <p>底栏显示当前笔记的创建时间（本地时间）。在记录创建时间之前就有的笔记不显示日期。</p>
  <h3>删除与撤销</h3>
  <p><kbd>⌘D</kbd> 直接删除当前笔记。提示会保留 12 秒，按 <kbd>⌘U</kbd> 或点击提示就能找回。</p>
  <p class="tip">删除的笔记会放进回收站文件夹。通过「设置 → 数据 → 恢复已删除笔记…」，可将回收站里的笔记恢复成一篇新笔记。</p>
</section>

<section id="palette">
  <h2>搜索与命令</h2>
  <p>两个面板的按键一样：输入文字筛选，<kbd>↑</kbd> <kbd>↓</kbd> 选择，<kbd>Return</kbd> 打开，<kbd>Esc</kbd> 关闭。</p>
  <h3>搜索笔记 <kbd>⌘⇧F</kbd></h3>
  <ul>
    <li>在所有当前笔记的正文里查找，每篇笔记列一条结果。</li>
    <li>输入框为空时列出全部笔记，可以当目录用。</li>
    <li>不搜索备份和回收站。</li>
  </ul>
  <h3>命令面板 <kbd>⌘⇧P</kbd></h3>
  <p>搜索 <code>format</code> 并选择「格式化笔记」，可整理当前笔记里数学公式的空格，以及 JavaScript、TypeScript、JSON、HTML、CSS、Markdown 和 YAML 代码块。代码沿用「代码缩进」设置，整次操作可以一步撤销。</p>
  <p>在命令面板可以执行笔记操作、修改设置。用过的命令按最后一次执行的先后排序，最近执行的排在最前。</p>
  <ul>
    <li>带 <b>›</b> 的命令会打开第二级列表，比如界面主色、语言。当前生效的选项带 <b>✓</b>。</li>
    <li>打开对应设置后，可以手动输入不透明度、模糊度、纹理强度或备份数量。例如，打开「纹理强度」后输入 <code>37%</code>。</li>
    <li>按 <kbd>Esc</kbd>，或在空输入框里按 <kbd>⌫</kbd>，返回上一级，之前选中的那一项仍然选中。</li>
    <li>在第一级直接输入，也能搜到第二级的选项，比如输入 <code>english</code> 会出现“语言：English”。</li>
  </ul>
  <p>再按一次同一个快捷键关闭面板；按另一个快捷键则切换到另一个面板。</p>

<section id="writing">
  <h2>书写</h2>
  <p>笔记就是普通的 Markdown。标题、列表、强调和链接会边写边显示样式，源文件用任何编辑器打开都清楚易读。</p>
  <ul>
    <li><b>复选框：</b><code>- [ ]</code> 和 <code>- [x]</code> 可以直接点击勾选。</li>
    <li><b>注释：</b>以 <code>//</code> 开头的行是注释。<kbd>⌘/</kbd> 为当前行或选中的行添加或取消注释。</li>
    <li><b>代码围栏：</b><code>```js</code> 这样的代码围栏会按语言高亮。</li>
  </ul>
  <p>在长笔记里移动光标时，光标上下始终保留三行可见。</p>
  <h3>片段</h3>
  <p>输入 <code>@</code> 加一个词，插入常用值。</p>
  <ul>
    <li><kbd>Return</kbd> 插入第一种格式，<kbd>↑</kbd> <kbd>↓</kbd> 选其他格式，<kbd>Esc</kbd> 关闭列表。</li>
    <li>一个词有多种格式时全部列出：<code>@date</code> 列出所有日期格式。</li>
    <li>只打一部分，或按顺序打几个字母也能找到：<code>@wk</code> 找到 <code>@week</code>。</li>
    <li>只输入 <code>@</code>：每个词显示一行。</li>
    <li>预览就是要插入的内容，时间类的值实时更新。</li>
  </ul>
  <table>
    <thead><tr><th>词</th><th>格式</th></tr></thead>
    <tbody>
      <tr><td><code>@date</code></td><td>2026-11-18、2026/11/18、20261118、按界面语言显示的长日期和完整日期</td></tr>
      <tr><td><code>@time</code></td><td>14:05、14:05:30（<code>@timesec</code>）、上午2:05</td></tr>
      <tr><td><code>@now</code></td><td>日期和时间（<code>@datetime</code>）、带秒（<code>@datetimesec</code>）、ISO 8601（<code>@iso</code>）、长格式</td></tr>
      <tr><td><code>@year @month @day</code></td><td>2026；2026-11、11、十一月；18、11月18日</td></tr>
      <tr><td><code>@week</code></td><td>2026-W47、W47、星期几（<code>@weekday</code>）、星期几简写</td></tr>
      <tr><td><code>@timestamp</code></td><td>Unix 秒（<code>@unix</code>）、毫秒（<code>@ms</code>）</td></tr>
      <tr><td><code>@uuid</code></td><td>随机 UUID：小写、大写、无横线</td></tr>
      <tr><td><code>@ip</code></td><td>公网地址、IPv4（<code>@ipv4</code>）、IPv6（<code>@ipv6</code>）、局域网（<code>@localip</code>）</td></tr>
      <tr><td><code>@mac</code></td><td>网卡 MAC 地址</td></tr>
      <tr><td><code>@host</code></td><td>主机名（<code>@hostname</code>）、电脑名称（<code>@computer</code>）、当前用户名（<code>@whoami</code>）</td></tr>
      <tr><td><code>@fn @unit @cur @const</code></td><td>只在计算块里：函数、单位、货币和常量，见<a href="#math">计算</a></td></tr>
    </tbody>
  </table>
  <ul>
    <li>括号里的词直接插入那一种格式，比如 <code>@timesec</code>。</li>
    <li>公网 IP 在列表显示或插入时向 ipify 查询，不发送其他内容。</li>
    <li>在代码里、或紧跟在字母后面时不弹出，所以邮箱地址不受影响。</li>
  </ul>
  <h4>自定义片段</h4>
  <p>在“设置 → 片段”或命令面板的“管理片段”中添加。保存在笔记文件夹里的 <code>snippets.json</code>，随笔记一起迁移和备份。</p>
  <p>在「设置 → 片段 → 片段开关」中可以按分组或单项启停内置片段。在那里关闭「自定义片段」可隐藏全部自定义片段，也可以取消勾选表格中某一行的「启用」。停用后会从补全和占位符菜单隐藏，模板里已有的占位符仍然能展开。</p>
  <ul>
    <li><b>一个触发词可以有几行：</b>像 macOS 的文字替换。几个地址都用 <code>addr</code>，<code>@addr</code> 会全部列出，默认插入第一行。</li>
    <li><b>和内置词同名：</b>你的行排在前面，所以自己写的 <code>date</code> 会成为默认格式。</li>
    <li><b>内容可以多行。</b></li>
  </ul>
  <h4>占位符</h4>
  <table>
    <thead><tr><th>写法</th><th>插入</th></tr></thead>
    <tbody>
      <tr><td><code>{date}</code></td><td>这个词的默认格式</td></tr>
      <tr><td><code>{date#2}</code></td><td>这个词的第 2 种格式</td></tr>
      <tr><td><code>{ipv4}</code></td><td>别名对应的那一种格式</td></tr>
      <tr><td><code>{cursor}</code></td><td>光标位置，见下文</td></tr>
      <tr><td><code>{cursor:姓名}</code></td><td>光标位置，插入后先选中“姓名”</td></tr>
      <tr><td><code>{{</code></td><td>一个 <code>{</code> 字符</td></tr>
    </tbody>
  </table>
  <p>“插入占位符”菜单列出全部占位符和示例。</p>
  <h4>光标位置</h4>
  <pre><code>您好 {cursor:姓名}：
{cursor}
{date}</code></pre>
  <ol>
    <li>插入后“姓名”被选中，直接输入就能替换。</li>
    <li>按 <kbd>Tab</kbd> 跳到空行。</li>
    <li>按 <kbd>⇧Tab</kbd> 回到“姓名”，填过的内容会再次被选中。</li>
  </ol>
  <ul>
    <li><b>标记：</b>正在填的位置是深色底纹加实线下划线；其他位置是浅色底纹加点状下划线，空位置是一条竖线。改没改过都一样，直到跳转结束。</li>
    <li><b>Tab 只管跳转：</b>跳转期间 <kbd>Tab</kbd> 和 <kbd>⇧Tab</kbd> 只用来跳转，清单里也一样。</li>
    <li><b>结束跳转：</b>到达最后一个位置、把光标移出这些位置、或按 <kbd>Esc</kbd>。之后 <kbd>Tab</kbd> 恢复缩进。</li>
    <li><b>这次 <kbd>Esc</kbd></b> 不收起窗口；Vim 模式下同时回到普通模式。</li>
    <li><b>最后一个位置不在末尾时</b>，再按一次 <kbd>Tab</kbd> 跳到片段末尾。</li>
  </ul>
  <h4>注意</h4>
  <ul>
    <li>多行片段从第二行起跟随当前行的缩进。</li>
    <li>在一个位置里再插入带光标位置的片段，外层剩下的位置会失效。</li>
    <li>值要等一会儿才拿到的片段（比如 IP）：如果期间光标移走了，插入时不会把光标拉回来。</li>
  </ul>
</section>

<section id="blocks">
  <h2>功能块</h2>
  <p>功能块把笔记的一部分变成小工具：清单、计算器、合计或一段代码。一篇笔记里可以放任意多个功能块。</p>
  <h3>插入和修改功能块</h3>
  <ol>
    <li>在空行输入 <code>/</code>。（Vim 模式下请先进入插入模式。）</li>
    <li>用方向键和 <kbd>Return</kbd> 选择，或直接点击。</li>
    <li>在功能块的最后一行按 <kbd>Return</kbd> 会在块内新增一行。</li>
  </ol>
  <ul>
    <li>块的标题栏或 <kbd>⌘K</kbd>：更改类型、转回普通文本或删除。</li>
    <li><kbd>⌘⇧D</kbd>：删除当前块。</li>
    <li><kbd>⌘O</kbd> / <kbd>⌘⇧O</kbd>：在当前行或块的下方 / 上方插入空行。</li>
  </ul>
  <p>这些操作都可以撤销。</p>
  <h3>功能块类型</h3>
  <table>
    <thead><tr><th>功能块</th><th>作用</th></tr></thead>
    <tbody>
      <tr><td>清单</td><td>点击复选框、在行尾输入 <code>/x</code>，或在当前项任意位置按 <kbd>⌘↩</kbd>，都能切换完成状态。<kbd>⌘↩</kbd> 也支持普通 Markdown 任务项。<kbd>Tab</kbd> 和 <kbd>⇧Tab</kbd> 缩进和取消缩进，子项会跟着父项一起移动。</td></tr>
      <tr><td>计算</td><td>在行尾输入 <code>=</code> 得出结果，支持变量、函数、单位和货币，见<a href="#math">计算</a>。</td></tr>
      <tr><td>求和 / 平均值</td><td>对块里的数字求和或求平均，不计算表达式。<br>只算独立的数字：<code>1.2.3.4</code>、IP、日期 <code>2026-11-19</code>、时间 <code>14:05</code> 不算；行首的编号 <code>1.</code>、<code>1.2.</code> 也不算。</td></tr>
      <tr><td>计数</td><td>统计项目数、词数和字符数。</td></tr>
      <tr><td>代码</td><td>按语言高亮代码，见<a href="#code">代码</a>。</td></tr>
    </tbody>
  </table>
  <p>以 <code>//</code> 开头的行不参与合计和计数。</p>
  <h3>整篇笔记</h3>
  <p>第一行只写一个关键词，整篇笔记就是这种类型，没有结束标记。生效时关键词会以强调色标出。</p>
  <table>
    <thead><tr><th>第一行</th><th>整篇笔记</th></tr></thead>
    <tbody>
      <tr><td><code>list</code></td><td>清单</td></tr>
      <tr><td><code>math</code></td><td>计算，见<a href="#math">计算</a></td></tr>
      <tr><td><code>sum</code> / <code>avg</code></td><td>求和 / 平均值</td></tr>
      <tr><td><code>count</code></td><td>计数</td></tr>
      <tr><td><code>code js</code></td><td>代码，<code>js</code> 是语言，可省略</td></tr>
    </tbody>
  </table>
  <ul>
    <li>关键词后可以加冒号和标题：<code>sum: 本月开销</code>、<code>code py: 备份脚本</code>。</li>
    <li>不区分大小写。</li>
    <li>笔记里的其他功能块各算各的；整篇代码笔记里的一切都当作代码。</li>
  </ul>
</section>

<section id="math">
  <h2>计算</h2>
  <p class="lead">计算块是随手可算的草稿纸：一行一个式子，行尾写 <code>=</code>，结果就显示在后面。可以定义变量、调用函数、换算单位和货币。</p>
  <h3>创建计算块</h3>
  <ul>
    <li><b>功能块：</b>在空行输入 <code>/</code>，选择“计算”。块以 <code>:::inkflit math</code> 开头，以 <code>:::end</code> 结尾。</li>
    <li><b>整篇笔记：</b>第一行只写 <code>math</code>，也可以带标题，比如 <code>math: 旅行预算</code>。
      <ul>
        <li>一直算到笔记末尾，没有结束标记。</li>
        <li>笔记里的其他功能块和代码块不参与计算。</li>
        <li>只想算一部分：用功能块或 <code>```math</code>。</li>
      </ul>
    </li>
    <li><b>Markdown 代码块：</b>用 <code>```math</code> 开头，<code>```</code> 结尾。</li>
  </ul>
  <pre><code>math: 旅行预算
机票: 2400
酒店: 380 * 4
机票 + 酒店 =
ans / 2 =
// 两个人平分</code></pre>
  <h3>每一行怎么写</h3>
  <table>
    <thead><tr><th>写法</th><th>作用</th></tr></thead>
    <tbody>
      <tr><td><code>名字: 式子</code></td><td>定义变量，不显示结果。<br>名字可以用中文等任何文字：<code>单价: 80</code>。<br>再定义一次会覆盖旧值。</td></tr>
      <tr><td><code>式子 =</code></td><td>计算并在行尾显示结果。结果不写进笔记，复制时也不会带上。</td></tr>
      <tr><td><code>ans</code></td><td>上一个 <code>=</code> 行的结果。</td></tr>
      <tr><td><code>// …</code></td><td>注释，不参与计算。</td></tr>
      <tr><td>其他行</td><td>当作普通文字，原样保留。</td></tr>
    </tbody>
  </table>
  <ul>
    <li>式子写错或没写完：不显示结果，也不报错；改对后自动出现。</li>
    <li>变量里也能写换算：<code>预算: 1000 USD to CNY</code>。之后 <code>预算 / 2 =</code> 得到数字，不带货币代码。</li>
  </ul>
  <h3>数字和运算符</h3>
  <table>
    <thead><tr><th>写法</th><th>含义</th></tr></thead>
    <tbody>
      <tr><td><code>+ - * /</code></td><td>加、减、乘、除。也可以写 <code>×</code> 和 <code>÷</code>。</td></tr>
      <tr><td><code>^</code></td><td>乘方，比如 <code>2^10</code> 是 1,024。指数必须是数字，绝对值不超过 100。</td></tr>
      <tr><td><code>( )</code></td><td>括号。数字紧挨括号表示相乘：<code>2(3+4)</code> 是 14。</td></tr>
      <tr><td><code>%</code></td><td>百分比：<code>200 - 10%</code> 是 180，<code>price + 25%</code> 是 <code>price</code> 加上它的 25%。<code>%</code> 不是取余。</td></tr>
      <tr><td><code>of</code></td><td>相乘，用于百分比：<code>50% of 200</code> 是 100。</td></tr>
      <tr><td><code>to</code> / <code>in</code></td><td>换算单位或货币，见下文。</td></tr>
      <tr><td><code>pi e tau phi</code></td><td>常数 π、e、τ、φ。</td></tr>
    </tbody>
  </table>
  <ul>
    <li><b>数字：</b>整数、小数或科学计数法（<code>1.5e3</code>），不能写千分位逗号。</li>
    <li><b>结果：</b>最多 10 位有效数字，按 <code>1,234.5</code> 的格式显示。</li>
  </ul>
  <h3>函数</h3>
  <table>
    <thead><tr><th>函数</th><th>作用</th><th>例子</th></tr></thead>
    <tbody>
      <tr><td><code>sqrt(x)</code></td><td>平方根</td><td><code>sqrt(16) = 4</code></td></tr>
      <tr><td><code>abs(x)</code></td><td>绝对值</td><td><code>abs(-3) = 3</code></td></tr>
      <tr><td><code>round(x)<br><code>round(x, n)</code></code></td><td>四舍五入；<code>n</code> 是保留的小数位数</td><td><code>round(2.567, 2) = 2.57</code></td></tr>
      <tr><td><code>floor(x)</code></td><td>向下取整</td><td><code>floor(2.7) = 2</code></td></tr>
      <tr><td><code>ceil(x)</code></td><td>向上取整</td><td><code>ceil(2.1) = 3</code></td></tr>
      <tr><td><code>sin(x)</code></td><td>正弦。默认按弧度，加 <code>deg</code> 按角度</td><td><code>sin(30 deg) = 0.5</code></td></tr>
      <tr><td><code>cos(x)</code></td><td>余弦</td><td><code>cos(0) = 1</code></td></tr>
      <tr><td><code>tan(x)</code></td><td>正切</td><td><code>tan(45 deg) = 1</code></td></tr>
      <tr><td><code>log(x)<br><code>log(x, b)</code></code></td><td>自然对数；<code>b</code> 指定底数</td><td><code>log(100, 10) = 2</code></td></tr>
      <tr><td><code>log10(x)</code></td><td>常用对数</td><td><code>log10(1000) = 3</code></td></tr>
      <tr><td><code>exp(x)</code></td><td>e 的幂</td><td><code>exp(1) = 2.718281828</code></td></tr>
      <tr><td><code>min(a, b, …)</code></td><td>最小值</td><td><code>min(3, 1, 2) = 1</code></td></tr>
      <tr><td><code>max(a, b, …)</code></td><td>最大值</td><td><code>max(3, 1, 2) = 3</code></td></tr>
    </tbody>
  </table>
  <h3>单位</h3>
  <p>数字后面跟单位，用 <code>to</code> 换算。</p>
  <table>
    <thead><tr><th>式子</th><th>结果</th><th>说明</th></tr></thead>
    <tbody>
      <tr><td><code>10 km to mi =</code></td><td><code>6.213711922 mi</code></td><td>用 <code>to</code> 换算</td></tr>
      <tr><td><code>2 h + 15 min =</code></td><td><code>2.25 h</code></td><td>不写 <code>to</code>：用第一个单位</td></tr>
      <tr><td><code>2 m * 3 m =</code></td><td><code>6 m^2</code></td><td>单位相乘</td></tr>
      <tr><td><code>50 km / 2 h to km/h =</code></td><td><code>25 km / h</code></td><td>单位相除，再换算</td></tr>
      <tr><td><code>0 degC to degF =</code></td><td><code>32 degF</code></td><td>温度</td></tr>
    </tbody>
  </table>
  <table>
    <thead><tr><th>类别</th><th>常用单位</th></tr></thead>
    <tbody>
      <tr><td>长度</td><td><code>m</code> <code>km</code> <code>cm</code> <code>mm</code> <code>um</code> <code>nm</code> <code>in</code> <code>ft</code> <code>yd</code> <code>mi</code> <code>nmi</code> <code>mil</code> <code>angstrom</code></td></tr>
      <tr><td>面积</td><td><code>m2</code> <code>km2</code> <code>cm2</code> <code>sqin</code> <code>sqft</code> <code>sqyd</code> <code>sqmi</code> <code>acre</code> <code>hectare</code></td></tr>
      <tr><td>体积</td><td><code>L</code> <code>mL</code> <code>m3</code> <code>cc</code> <code>cuin</code> <code>cuft</code> <code>teaspoon</code> <code>tablespoon</code> <code>cup</code> <code>floz</code> <code>pint</code> <code>quart</code> <code>gallon</code> <code>oilbarrel</code></td></tr>
      <tr><td>质量</td><td><code>mg</code> <code>g</code> <code>kg</code> <code>t</code> <code>ton</code> <code>oz</code> <code>lb</code> <code>stone</code> <code>grain</code></td></tr>
      <tr><td><a href="#time-units">时间</a></td><td><code>ms</code> <code>s</code> <code>min</code> <code>h</code> <code>day</code> <code>week</code> <code>month</code> <code>year</code></td></tr>
      <tr><td>速度</td><td><code>m/s</code> <code>km/h</code> <code>mph</code></td></tr>
      <tr><td>温度</td><td><code>degC</code> <code>degF</code> <code>K</code></td></tr>
      <tr><td><a href="#angle-units">角度</a></td><td><code>deg</code> <code>rad</code> <code>grad</code> <code>arcmin</code> <code>arcsec</code></td></tr>
      <tr><td>力</td><td><code>N</code> <code>kN</code> <code>kgf</code> <code>lbf</code></td></tr>
      <tr><td>能量</td><td><code>J</code> <code>kJ</code> <code>Wh</code> <code>kWh</code> <code>BTU</code> <code>eV</code></td></tr>
      <tr><td>功率</td><td><code>W</code> <code>kW</code> <code>hp</code></td></tr>
      <tr><td>压强</td><td><code>Pa</code> <code>kPa</code> <code>MPa</code> <code>bar</code> <code>atm</code> <code>psi</code> <code>mmHg</code></td></tr>
      <tr><td>电磁</td><td><code>A</code> <code>mA</code> <code>V</code> <code>kV</code> <code>ohm</code> <code>C</code> <code>Ah</code> <code>mAh</code> <code>F</code> <code>H</code> <code>S</code> <code>Wb</code> <code>T</code></td></tr>
      <tr><td>数据</td><td><code>b</code> <code>B</code> <code>kB</code> <code>MB</code> <code>GB</code> <code>TB</code> <code>KiB</code> <code>MiB</code> <code>GiB</code> <code>TiB</code></td></tr>
      <tr><td>频率</td><td><code>Hz</code> <code>kHz</code> <code>MHz</code> <code>GHz</code></td></tr>
      <tr><td>其他</td><td><code>mol</code> <code>cd</code></td></tr>
    </tbody>
  </table>
  <ul>
    <li>公制单位可以加前缀 <code>k</code> <code>M</code> <code>G</code> <code>m</code> <code>u</code> 等：<code>mg</code>、<code>kN</code>、<code>GHz</code>。</li>
    <li>表外的 mathjs 内置单位也能用，全称和复数也行：<code>meters</code>、<code>inches</code>。</li>
    <li>单位区分大小写：<code>t</code> 是吨，<code>T</code> 是特斯拉；<code>b</code> 是比特，<code>B</code> 是字节。<code>MB</code> 是 1000² 字节，<code>MiB</code> 是 1024² 字节。</li>
    <li><code>min</code> 单独写是分钟，写成 <code>min(…)</code> 是函数。<code>in</code> 跟在数字后面是英寸（<code>5 in to cm</code>），其他位置是换算（<code>10 km in mi</code>）。</li>
    <li>变量和单位同名时，变量优先。</li>
  </ul>
  <h4 id="time-units">时间单位</h4>
  <table>
    <thead><tr><th>全名（符号）</th><th>公式写法</th><th>换算</th></tr></thead>
    <tbody>
      <tr><td>毫秒（ms）</td><td><code>ms</code> / <code>millisecond</code></td><td>1 毫秒 = 0.001 秒</td></tr>
      <tr><td>秒（s）</td><td><code>s</code> / <code>second</code></td><td>1 秒 = 1000 毫秒</td></tr>
      <tr><td>分钟（min）</td><td><code>min</code> / <code>minute</code></td><td>1 分钟 = 60 秒</td></tr>
      <tr><td>小时（h）</td><td><code>h</code> / <code>hour</code></td><td>1 小时 = 60 分钟</td></tr>
      <tr><td>天（d）</td><td><code>day</code></td><td>1 天 = 24 小时</td></tr>
      <tr><td>周</td><td><code>week</code></td><td>1 周 = 7 天</td></tr>
      <tr><td>月</td><td><code>month</code></td><td>1 月 = 30.4375 天</td></tr>
      <tr><td>年</td><td><code>year</code></td><td>1 年 = 365.25 天 = 12 月</td></tr>
    </tbody>
  </table>
  <p>Inkflit 在单位换算中把月和年当作固定时长。两个日期之间的实际天数要按日历计算。</p>
  <p>公式里可以直接写全名 <code>minute</code> 和 <code>second</code>。<code>1 minute to s =</code> 得到 <code>60 s</code>，<code>1 second to ms =</code> 得到 <code>1000 ms</code>。在片段菜单中输入 <code>@sec</code>，选中 <code>@second</code> 就会插入 <code>s</code>。在公式里，秒要写 <code>s</code> 或 <code>second</code>，Inkflit 不识别 <code>sec</code> 这个时间单位。</p>
  <h4 id="angle-units">角度单位</h4>
  <table>
    <thead><tr><th>全名（符号）</th><th>公式写法</th><th>换算</th></tr></thead>
    <tbody>
      <tr><td>度（°）</td><td><code>deg</code> / <code>degree</code></td><td>1° = π/180 rad</td></tr>
      <tr><td>弧度（rad）</td><td><code>rad</code> / <code>radian</code></td><td>π rad = 180°</td></tr>
      <tr><td>百分度（gon）</td><td><code>grad</code> / <code>gradian</code></td><td>100 grad = 90°</td></tr>
      <tr><td>角分（′）</td><td><code>arcmin</code> / <code>arcminute</code></td><td>60 arcmin = 1°</td></tr>
      <tr><td>角秒（″）</td><td><code>arcsec</code> / <code>arcsecond</code></td><td>60 arcsec = 1 arcmin = 1/60°</td></tr>
    </tbody>
  </table>
  <p>一整圈是 360°，也就是 2π rad。公式里用 <code>pi</code> 表示 π，例如 <code>pi rad to deg =</code> 得到 <code>180 deg</code>。三角函数省略单位时按弧度计算。要算 30° 的正弦，写 <code>sin(30 deg) =</code>，结果是 <code>0.5</code>。</p>
  <h3>货币</h3>
  <ul>
    <li><b>写法：</b><code>10 USD to CNY =</code>。<code>to</code> 也可以写成 <code>in</code>。</li>
    <li><b>代码：</b>三个大写字母。小写的 <code>usd</code> 不算货币。</li>
    <li><b>一行一笔：</b><code>10 USD + 5 EUR</code>、<code>price USD to CNY</code> 都不行。</li>
  </ul>
  <h4>汇率</h4>
  <ul>
    <li><b>来源：</b>Frankfurter 提供的欧洲央行参考汇率，工作日每天更新一次。</li>
    <li><b>日期：</b>结果后面带汇率日期，比如 <code>66.67 CNY · 2026-11-18</code>。</li>
    <li><b>下载：</b>打开计算块时下载，最多每小时一次；失败后约 100 秒重试。</li>
    <li><b>提示：</b>还没拿到汇率时显示“汇率加载中或不可用”；代码不在下表中时显示“不支持的币种”。</li>
  </ul>
  <p>目前支持以下 30 种货币，以 Frankfurter 实际返回为准：</p>
  <table>
    <thead><tr><th>代码</th><th>货币</th><th>代码</th><th>货币</th></tr></thead>
    <tbody>
      <tr><td><code>AUD</code></td><td>澳大利亚元</td><td><code>BRL</code></td><td>巴西雷亚尔</td></tr>
      <tr><td><code>CAD</code></td><td>加拿大元</td><td><code>CHF</code></td><td>瑞士法郎</td></tr>
      <tr><td><code>CNY</code></td><td>人民币</td><td><code>CZK</code></td><td>捷克克朗</td></tr>
      <tr><td><code>DKK</code></td><td>丹麦克朗</td><td><code>EUR</code></td><td>欧元</td></tr>
      <tr><td><code>GBP</code></td><td>英镑</td><td><code>HKD</code></td><td>港元</td></tr>
      <tr><td><code>HUF</code></td><td>匈牙利福林</td><td><code>IDR</code></td><td>印度尼西亚卢比</td></tr>
      <tr><td><code>ILS</code></td><td>以色列新谢克尔</td><td><code>INR</code></td><td>印度卢比</td></tr>
      <tr><td><code>ISK</code></td><td>冰岛克朗</td><td><code>JPY</code></td><td>日元</td></tr>
      <tr><td><code>KRW</code></td><td>韩元</td><td><code>MXN</code></td><td>墨西哥比索</td></tr>
      <tr><td><code>MYR</code></td><td>马来西亚林吉特</td><td><code>NOK</code></td><td>挪威克朗</td></tr>
      <tr><td><code>NZD</code></td><td>新西兰元</td><td><code>PHP</code></td><td>菲律宾比索</td></tr>
      <tr><td><code>PLN</code></td><td>波兰兹罗提</td><td><code>RON</code></td><td>罗马尼亚列伊</td></tr>
      <tr><td><code>SEK</code></td><td>瑞典克朗</td><td><code>SGD</code></td><td>新加坡元</td></tr>
      <tr><td><code>THB</code></td><td>泰铢</td><td><code>TRY</code></td><td>土耳其里拉</td></tr>
      <tr><td><code>USD</code></td><td>美元</td><td><code>ZAR</code></td><td>南非兰特</td></tr>
    </tbody>
  </table>
  <p class="tip">Inkflit 只下载公开汇率，不会上传你的笔记。拿不到汇率时会直接提示，不会给出猜测的结果。</p>
  <h3>用 @ 插入函数、单位、货币和常量</h3>
  <p>在计算块里输入 <code>@</code>，还可以找到四组片段。</p>
  <table>
    <thead><tr><th>词</th><th>内容</th></tr></thead>
    <tbody>
      <tr><td><code>@fn</code></td><td>全部函数，旁边是说明。插入 <code>sqrt()</code> 后光标停在括号里，写完参数按 <kbd>Tab</kbd> 跳到括号后面。</td></tr>
      <tr><td><code>@unit</code></td><td>上表中的单位，旁边是类别。</td></tr>
      <tr><td><code>@cur</code></td><td>全部货币，显示名称和对本地货币的汇率：简体中文对 CNY，繁体中文对 HKD，日语对 JPY，英语对 USD。</td></tr>
      <tr><td><code>@const</code></td><td>数学常量和常用科学常量。</td></tr>
    </tbody>
  </table>
  <ul>
    <li>名字可以单独用：<code>@sqrt</code>、<code>@km</code>、<code>@kilometer</code>、<code>@usd</code> 直接找到那一项。</li>
    <li>数字后面可以紧接 <code>@</code>：<code>10@km</code>。</li>
    <li>在计算块里，<code>@min</code> 同时显示最小值函数和分钟单位 <code>@minute</code>，选中分钟会插入 <code>min</code>。<code>@ms</code> 同时显示时间戳和毫秒单位 <code>@millisecond</code>。</li>
  </ul>
  <h3>高亮</h3>
  <p>计算块按“设置 → 外观”里的代码配色给式子上色，浅色和深色外观各有一套：</p>
  <table>
    <thead><tr><th>元素</th><th>例子</th></tr></thead>
    <tbody>
      <tr><td>数字和常数</td><td><code>80</code> <code>1.5e3</code> <code>pi</code></td></tr>
      <tr><td>函数</td><td><code>sqrt</code> <code>round</code></td></tr>
      <tr><td>单位</td><td><code>km</code> <code>min</code> <code>degC</code></td></tr>
      <tr><td>货币代码（与单位同色）</td><td><code>USD</code> <code>CNY</code></td></tr>
      <tr><td>运算符和换算词</td><td><code>+</code> <code>×</code> <code>%</code> <code>to</code> <code>of</code></td></tr>
      <tr><td>括号、逗号、冒号</td><td><code>(</code> <code>,</code> <code>:</code></td></tr>
      <tr><td>行尾的等号（使用运算符颜色）</td><td><code>=</code></td></tr>
      <tr><td>变量定义和引用</td><td><code>price</code> <code>ans</code></td></tr>
      <tr><td>注释</td><td><code>// …</code></td></tr>
    </tbody>
  </table>
  <h3>限制</h3>
  <ul>
    <li>一个式子最长 256 个字符。</li>
    <li>不支持取余、矩阵、字符串、比较、自定义函数，也不能在式子里用 <code>=</code> 赋值。</li>
  </ul>
</section>

<section id="code">
  <h2>代码</h2>
  <ul>
    <li><b>整篇代码笔记：</b>第一行写 <code>code js</code>，整篇按这种语言高亮和编辑。<kbd>⌘L</kbd> 改的是第一行的语言。</li>
    <li><kbd>⌘L</kbd> 选择当前代码块的语言。</li>
    <li>括号和引号会自动补全。<kbd>Return</kbd> 保持缩进，<kbd>Tab</kbd> 缩进，<kbd>⇧Tab</kbd> 取消缩进。</li>
    <li>没有选中内容时，<kbd>⌘C</kbd> 复制整个代码块。</li>
  </ul>
  <p>在「设置 → 编辑 → 代码缩进」可选 2 个空格、4 个空格或 Tab。在「设置 → 外观 → 代码配色」选择并预览配色。</p>
  <p>开启「设置 → 编辑 → 显示代码行号」后，每个代码块从 1 开始编号。再开启「相对行号」，光标所在代码块会显示各行与当前行的距离，当前行和其他代码块仍显示绝对行号。</p>
</section>

<section id="vim">
  <h2>Vim 模式</h2>
  <p>Vim 按键默认开启。编辑器从 Normal 模式开始，按 <kbd>i</kbd> 输入，按 <kbd>Esc</kbd> 返回。图钉关闭时，在 Normal 模式下默认连按两次 <kbd>Esc</kbd> 会收起窗口。在「设置 → 编辑」关闭「连按两次 Esc 收起窗口」后，按一次即可。</p>
  <ul>
    <li>普通模式下，Inkflit 会临时切换到英文（ASCII）输入法，让命令键直接生效；开始输入或离开窗口时恢复你原来的输入法。</li>
    <li>如果输入法候选框还开着，按 <kbd>Esc</kbd> 会先取消候选，再退出插入模式。</li>
    <li>每篇笔记的撤销记录会保留到退出应用为止。</li>
  </ul>
  <p>这是编辑器里的 Vim 模拟，不是 Neovim，不会读取 vimrc。</p>
  <p>在“设置 → 编辑 → Vim 模式”或命令面板里可以关闭。关闭后直接输入。图钉关闭时，<kbd>Esc</kbd> 收起窗口。<kbd>⌘Z</kbd> / <kbd>⌘⇧Z</kbd> 撤销和重做。</p>
</section>

<section id="settings">
  <h2>设置</h2>
  <p>按 <kbd>⌘,</kbd> 或通过菜单栏图标打开设置。大部分选项在命令面板里也能改。</p>
  <table>
    <thead><tr><th>标签页</th><th>选项</th></tr></thead>
    <tbody>
      <tr><td>通用</td><td>开机启动、语言、全局快捷键</td></tr>
      <tr><td>外观</td><td>显示模式、界面主色、编辑器字体和字号、背景材质、纹理强度、恢复窗口大小、窗口不透明度、背景模糊、代码配色。拖动滑块时按住 <kbd>⌥</kbd>，每次调整 5%。</td></tr>
      <tr><td>编辑</td><td>Vim 模式、连按两次 Esc 收起窗口、代码缩进、显示代码行号、相对行号</td></tr>
      <tr><td>片段</td><td>自定义片段和<a href="#writing">片段开关</a></td></tr>
      <tr><td>数据</td><td>笔记保存位置、自动备份、历史版本、回收站、索引恢复</td></tr>
      <tr><td>关于</td><td>当前版本、重新生成引导笔记、打开使用帮助</td></tr>
    </tbody>
  </table>
  <p>在<b>外观</b>中选择跟随系统（默认）、浅色或深色。<b>界面主色</b>中的可乐红蓝、圣诞松绿、朱漆红、午夜黑金和孔雀蓝金会一起调整工具栏、正文和菜单的配色，每套都随显示模式切换。</p>
  <h3>背景材质</h3>
  <p>在「设置 → 外观 → 背景材质」选择空白、宣纸、羊毛毡、细砂石或粗亚麻。「纹理强度」默认是 50%，调到 0% 就是纯色背景。「窗口不透明度」单独控制窗口的透底程度。 选择「空白」时，纹理强度滑块会置灰，并保留原来的数值。</p>
  <p>在命令面板输入 <code>background material</code>，也可以直接搜索「粗亚麻」等材质名称。选中材质后，打开「纹理强度」，输入 <code>37%</code> 等数值即可。</p>
</section>

<section id="shortcuts">
  <h2>快捷键</h2>
  <p>全局快捷键在任何应用里都能用，可以在设置中更改。其他快捷键在笔记窗口激活时可用。</p>
  <table><thead><tr><th>按键</th><th>操作</th></tr></thead><tbody><tr class="group"><td colspan="2">窗口</td></tr><tr><td><kbd>⌃⌥Space</kbd></td><td>在任意应用中显示或隐藏 Inkflit（默认快捷键，可在设置中更改）</td></tr><tr><td><kbd>Esc</kbd></td><td>收起未固定的窗口（Vim Normal 模式下默认连按两次）</td></tr><tr><td><kbd>⌘W</kbd></td><td>收起笔记窗口，固定时也可用</td></tr><tr><td><kbd>⌘⇧T</kbd></td><td>循环切换普通、保持打开和置顶</td></tr><tr><td><kbd>⌘,</kbd></td><td>打开设置</td></tr><tr class="group"><td colspan="2">笔记</td></tr><tr><td><kbd>⌘N</kbd></td><td>在末尾新建笔记</td></tr><tr><td><kbd>⌘[</kbd> / <kbd>⌘]</kbd></td><td>上一条 / 下一条笔记</td></tr><tr><td><kbd>⌘⇧[</kbd> / <kbd>⌘⇧]</kbd></td><td>第一条 / 最后一条笔记</td></tr><tr><td><kbd>⌘1</kbd>–<kbd>⌘9</kbd></td><td>跳到第 1–9 条笔记</td></tr><tr><td><kbd>⌘D</kbd></td><td>删除当前笔记</td></tr><tr><td><kbd>⌘U</kbd></td><td>恢复刚删除的笔记（12 秒内）</td></tr><tr class="group"><td colspan="2">搜索与命令</td></tr><tr><td><kbd>⌘⇧F</kbd></td><td>搜索笔记</td></tr><tr><td><kbd>⌘⇧P</kbd></td><td>命令面板</td></tr><tr class="group"><td colspan="2">编辑</td></tr><tr><td><kbd>⌘+</kbd> / <kbd>⌘-</kbd></td><td>增大 / 减小编辑器字号（⌘= 也可放大）</td></tr><tr><td><kbd>⌘↩</kbd></td><td>切换当前清单项或 Markdown 任务的完成状态</td></tr><tr><td><kbd>⌘/</kbd></td><td>注释或取消注释</td></tr><tr><td><kbd>⌘O</kbd> / <kbd>⌘⇧O</kbd></td><td>在当前行或块下方 / 上方插入空行</td></tr><tr><td><kbd>⌘K</kbd></td><td>更改当前块类型</td></tr><tr><td><kbd>⌘⇧D</kbd></td><td>删除当前块</td></tr><tr><td><kbd>⌘L</kbd></td><td>选择代码块语言</td></tr><tr><td><kbd>⌘C</kbd></td><td>未选中内容时复制整个代码块</td></tr><tr><td><kbd>==</kbd></td><td>在 Vim Normal 模式下自动缩进。代码遵循语言规则和缩进设置，清单按层级调整。</td></tr><tr><td><kbd>&gt;&gt;</kbd> / <kbd>&lt;&lt;</kbd></td><td>在 Vim Normal 模式下缩进或反缩进。清单子项随父项一起移动。</td></tr><tr><td><kbd>⌘Z</kbd> / <kbd>⌘⇧Z</kbd></td><td>撤销 / 重做（关闭 Vim 时）</td></tr></tbody></table>
</section>

<section id="data">
  <h2>数据</h2>
  <p>所有内容都只保存在你的 Mac 上。每篇笔记是一个 UTF-8 编码的 Markdown 文件：</p>
  <pre><code>~/Documents/Inkflit/
  notes/       每篇笔记一个 .md 文件
  index.json   笔记顺序和当前选中的笔记
  backups/     历史版本
  trash/       已删除的笔记</code></pre>
  <h3>保存</h3>
  <ul>
    <li>停止输入半秒后保存；连续输入时至少每两秒保存一次。</li>
    <li>切换笔记、收起窗口、退出应用时立即保存。</li>
    <li>保存失败时底栏会提示；保存成功之前无法退出应用。</li>
  </ul>
  <h3>备份与恢复</h3>
  <ul>
    <li>编辑时，每篇笔记最多每五分钟保留一个旧版本。在「设置 → 数据 → 自动备份」选择保留数量。</li>
    <li>“恢复历史版本…”和“恢复已删除笔记…”都会新建一篇笔记，原文件保留不动。</li>
    <li>如果 <code>index.json</code> 损坏，“重建索引…”会根据笔记文件重新生成索引，旧索引会保留。</li>
  </ul>
  <p>更改保存位置时，会把整个存储目录复制过去，原目录保留不动。</p>
  <p class="tip">Inkflit 没有云同步。请把笔记文件夹纳入你自己的备份，或者选择一个同步服务已经覆盖的文件夹。</p>
</section>

<section id="automation">
  <h2>自动化</h2>
  <p>其他应用和 AI 助手可以通过本机 MCP 服务或 <code>inkflit://</code> 链接读写笔记。两种方式都经过正在运行的 Inkflit，保存和备份照常进行。</p>
  <h3>MCP</h3>
  <p>把 Inkflit 加进你的 MCP 客户端，然后重启客户端：</p>
  <pre><code># Codex
codex mcp add inkflit -- /Applications/Inkflit.app/Contents/MacOS/Inkflit --mcp

# Claude Code
claude mcp add --transport stdio --scope user inkflit -- /Applications/Inkflit.app/Contents/MacOS/Inkflit --mcp

# 其他客户端
{"mcpServers":{"inkflit":{"command":"/Applications/Inkflit.app/Contents/MacOS/Inkflit","args":["--mcp"]}}}</code></pre>
  <p>工具：<code>list_notes</code>、<code>search_notes</code>、<code>get_note</code>、<code>get_current_note</code>、<code>analyze_note</code>、<code>preview_note_format</code>、<code>apply_note_format</code>、<code>create_note</code>、<code>append_note</code>、<code>replace_note</code>、<code>delete_note</code>。</p>
  <p><code>list_notes</code> 可带上 <code>limit</code>、<code>cursor</code> 和 <code>include_content: false</code>，分页获取摘要。<code>get_current_note</code> 读取当前笔记，<code>analyze_note</code> 按 <code>id</code> 或 <code>index</code> 返回计算和清单结果。</p>
  <p>用笔记 <code>id</code> 调用 <code>preview_note_format</code> 查看差异，再把同一个 <code>id</code> 和返回的 <code>preview_id</code> 传给 <code>apply_note_format</code>。正文变动后需要重新预览。</p>
  <ul>
    <li>用 <code>index</code>（Inkflit 里显示的序号）或稳定的 <code>id</code> 指定笔记。增删笔记后序号会变化。</li>
    <li>新笔记默认加在最后。<code>position</code> 可以设为 <code>"first"</code>、<code>"last"</code> 或一个数字，放到其他位置。</li>
    <li>删除的笔记进入回收站。</li>
  </ul>
  <h3>链接</h3>
  <pre><code>open 'inkflit://note/append?index=2&amp;content=Remember%20milk'
open 'inkflit://note/search?query=milk'
open 'inkflit://note/get?index=1'</code></pre>
  <p>可用的操作有 <code>list</code>、<code>get</code>、<code>search</code>、<code>create</code>、<code>append</code>、<code>replace</code> 和 <code>delete</code>。加上 <code>x-success</code> 和 <code>x-error</code> 回调地址，可以收到 JSON 格式的结果。</p>
  <p>用 <code>inkflit://note/open?index=2</code> 打开指定笔记，用 <code>inkflit://settings/appearance</code> 或 <code>inkflit://settings/snippets</code> 直达对应设置。</p>
  <p class="tip">写入和删除类的链接会立即执行，只打开你信任的链接。</p>
</section>

<section id="trouble">
  <h2>常见问题</h2>
  <h3>按快捷键没有反应</h3>
  <p>可能有其他应用占用了这个快捷键。这时菜单栏里会显示“设置…（快捷键不可用）”，请在“设置 → 通用”中换一个快捷键。</p>
  <h3>开机启动打不开</h3>
  <p>macOS 可能需要你授权。请在“系统设置 → 通用 → 登录项”中允许 Inkflit。</p>
  <h3>笔记在 Inkflit 之外被修改</h3>
  <p>如果 Inkflit 运行时笔记文件被其他应用改过，Inkflit 会拒绝覆盖这些文件。请先把当前内容复制到安全的地方，然后重启 Inkflit。</p>
</section>

<section id="start">
  <h2>開始使用</h2>
  <p class="lead">Inkflit 常駐在選單列。按一個快捷鍵就能叫出來，記完隨手收起。輸入時自動儲存。</p>
  <ol>
    <li><b>開啟視窗：</b>按全域快捷鍵，預設為 <kbd>⌃⌥Space</kbd>（可在「設定 → 一般」中變更），或點選單列圖示，選擇「開啟 Inkflit」。</li>
    <li><b>開始寫：</b>內容會自動儲存，沒有儲存按鈕。</li>
    <li><b>收起視窗：</b>圖釘關閉時，再按一次快捷鍵，或按 <kbd>Esc</kbd>（Vim 一般模式下預設連按兩次）。切換到其他應用程式時也會自動收起。</li>
  </ol>
  <p>點擊工具列圖釘、按 <kbd>⌘⇧T</kbd>，或在命令面板搜尋 <code>pin window</code>，可循環切換「一般」「保持開啟」「置頂」。後兩種狀態下，按 <kbd>Esc</kbd> 或切換應用程式時視窗會保持開啟。置頂會讓筆記浮在其他視窗上方。按 <kbd>⌘W</kbd> 可收起。</p>
  <h3>視窗出現在哪裡</h3>
  <p>視窗會出現在滑鼠所在的顯示器、你目前所在的桌面上，不會把你拉回其他桌面。視窗位置會被記住，重新啟動後也一樣。開啟設定時，筆記視窗會保持可見，可即時預覽變更。</p>
  <p>拖曳工具列中間的空白處可以移動視窗，拖曳邊緣可以調整大小。可在「設定 → 外觀 → 視窗大小」中重設。</p>
  <h3>引導筆記</h3>
  <ul>
    <li>第一次啟動時，Inkflit 依你的語言建立七篇引導筆記，可以隨意修改或刪除。</li>
    <li>在「設定 → 關於」選擇「重新產生引導筆記」，在最前面放一套新的引導，並開啟歡迎頁。</li>
  </ul>
</section>

<section id="notes">
  <h2>筆記</h2>
  <p>筆記像筆記本的書頁一樣依序排列。工具列顯示目前位置，例如 <code>2 / 5</code>。用工具列或快捷鍵新增的筆記會加在最後。</p>
  <ul>
    <li><b>新增：</b><kbd>⌘N</kbd>，或工具列上的 <b>+</b>。</li>
    <li><b>翻頁：</b><kbd>⌘[</kbd> 和 <kbd>⌘]</kbd>，或工具列上的箭頭。<kbd>⌘⇧[</kbd> 和 <kbd>⌘⇧]</kbd> 跳到第一則和最後一則筆記。</li>
    <li><b>跳到某一頁：</b><kbd>⌘1</kbd> 到 <kbd>⌘9</kbd> 開啟第 1 到第 9 則。</li>
  </ul>
  <p>翻頁時，筆記內容會橫向滑動。應用程式執行期間，每則筆記會保留游標和捲動位置。右側的小箭頭提示上方或下方還有內容。</p>
  <p>到第一則或最後一則後繼續用快捷鍵往外翻，頁面會輕晃一下。啟用系統的減少動態效果設定後，翻頁和邊界動畫會關閉。</p>
  <p>底列顯示目前筆記的建立時間（本地時間）。在開始記錄建立時間之前就有的筆記不顯示日期。</p>
  <h3>刪除與復原</h3>
  <p><kbd>⌘D</kbd> 直接刪除目前筆記。提示會保留 12 秒，按 <kbd>⌘U</kbd> 或點擊提示就能找回。</p>
  <p class="tip">刪除的筆記會放進回收站資料夾。透過「設定 → 資料 → 還原已刪除筆記…」，可將回收站裡的筆記還原成一則新筆記。</p>
</section>

<section id="palette">
  <h2>搜尋與命令</h2>
  <p>兩個面板的按鍵一樣：輸入文字篩選，<kbd>↑</kbd> <kbd>↓</kbd> 選擇，<kbd>Return</kbd> 開啟，<kbd>Esc</kbd> 關閉。</p>
  <h3>搜尋筆記 <kbd>⌘⇧F</kbd></h3>
  <ul>
    <li>在所有目前筆記的內文中搜尋，每篇筆記列一筆結果。</li>
    <li>輸入框為空時列出全部筆記，可以當目錄用。</li>
    <li>不搜尋備份和垃圾桶。</li>
  </ul>
  <h3>命令面板 <kbd>⌘⇧P</kbd></h3>
  <p>搜尋 <code>format</code> 並選擇「格式化筆記」，可整理目前筆記中數學公式的空格，以及 JavaScript、TypeScript、JSON、HTML、CSS、Markdown 和 YAML 程式碼區塊。程式碼沿用「程式碼縮排」設定，整次操作可以一步復原。</p>
  <p>在命令面板可執行筆記操作、修改設定。用過的命令依最後一次執行的先後排序，最近執行的排在最前。</p>
  <ul>
    <li>帶 <b>›</b> 的命令會開啟第二層清單，例如介面主色、語言。目前生效的選項帶 <b>✓</b>。</li>
    <li>開啟對應設定後，可以手動輸入不透明度、模糊程度、紋理強度或備份數量。例如，開啟「紋理強度」後輸入 <code>37%</code>。</li>
    <li>按 <kbd>Esc</kbd>，或在空白輸入框裡按 <kbd>⌫</kbd>，返回上一層，之前選取的項目仍然選取。</li>
    <li>在第一層直接輸入，也能搜尋到第二層的選項，例如輸入 <code>english</code> 會出現「語言：English」。</li>
  </ul>
  <p>再按一次同一個快捷鍵關閉面板；按另一個快捷鍵則切換到另一個面板。</p>
  <p><a href="#command-keywords">指令關鍵詞</a></p>
</section>
