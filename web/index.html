<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"><title>Inkflit</title></head><body>
<div class="app"><div class="drag-bar" aria-hidden="true"></div><header><div class="nav"><button id="previous" aria-label="上一条笔记" title="上一条笔记 ⌘[">‹</button><span id="position"></span><button id="next" aria-label="下一条笔记" title="下一条笔记 ⌘]">›</button></div><div class="actions"><button id="search" title="搜索笔记 ⌘⇧F" aria-label="搜索笔记"><svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 4 4"/></svg></button><button id="new" title="新建笔记 ⌘N" aria-label="新建笔记">＋</button><button id="delete" title="删除笔记 ⌘D" aria-label="删除笔记"><svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M9 6V4h6v2M6 6l1 14h10l1-14M10 10v6M14 10v6"/></svg></button></div></header>
<main><div id="command-panel" class="command-panel" role="dialog" aria-modal="true" hidden><div class="command-card"><div class="command-search"><span class="command-prompt" aria-hidden="true">›</span><input id="command-input" type="search" autocomplete="off" spellcheck="false" aria-controls="command-results" aria-autocomplete="list" role="combobox" aria-expanded="true"><kbd>esc</kbd></div><div id="command-results" class="command-results" role="listbox"></div><div class="command-footer"><span id="command-hint"></span><span>↑↓ · ↵</span></div></div></div><div id="search-panel" class="search-panel" role="dialog" aria-modal="true" hidden><div class="search-card"><div class="search-heading"><input id="search-input" type="search" autocomplete="off" spellcheck="false"><button id="search-close" type="button" aria-label="关闭">×</button></div><div id="search-results" class="search-results" role="listbox"></div></div></div><div id="block-menu" class="block-menu" role="listbox" aria-label="功能块" hidden></div><div id="language-menu" class="language-menu" role="listbox" aria-label="代码语言" hidden></div><div id="editor" class="editor"></div><div id="delete-notices" class="delete-notices" aria-live="polite" aria-relevant="additions"></div><div id="insights" class="insights" hidden></div></main><footer><span class="mode" id="mode">NORMAL</span><span id="save" aria-live="polite">正在载入…</span><span class="hint" id="shortcut">⌃⌥Space</span></footer></div><script src="editor.js"></script></body></html>
